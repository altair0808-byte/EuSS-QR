<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2aa3b5">

<style>
:root{--bg:oklch(.981 .006 195);--fg:oklch(.285 .063 225);--card:#fff;--pri:oklch(.62 .125 208);--sec:oklch(.936 .026 193);--mut:oklch(.956 .012 198);--mf:oklch(.52 .04 220);--bd:oklch(.89 .018 204);--bad:oklch(.577 .245 27.3);--r:.5rem;font-family:Manrope,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}
h1,h2{font-family:Sora,Manrope,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.hd{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--bd);background:rgb(255 255 255/.95);backdrop-filter:blur(8px)}
.hd>div{max-width:1440px;margin:0 auto;height:4rem;display:flex;align-items:center;justify-content:space-between;padding:0 1rem}
.lg{display:flex;align-items:center;gap:.75rem;min-width:0}.lg img{height:2.25rem;max-width:7rem;object-fit:contain}
.sep{width:1px;height:1.5rem;background:var(--bd)}.sub{font-size:.875rem;font-weight:600;color:var(--mf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:.75rem}.me .t{text-align:right}
.eb{font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--pri);margin:0}.t p+p{margin:0;font-size:.75rem;font-weight:600}
.av{width:2.25rem;height:2.25rem;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.ib{width:2.25rem;height:2.25rem;border:0;background:none;border-radius:var(--r);font-size:1.1rem}.ib:hover{background:var(--sec)}
main{max-width:1440px;margin:0 auto;padding:1.25rem 1rem}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
.top h1{font-size:1.5rem}.top .eb{margin-bottom:.25rem;font-size:.75rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.5rem;padding:0 1rem;border-radius:var(--r);border:1px solid var(--bd);background:var(--card);font-size:.875rem;font-weight:600}

.gl{margin:1.25rem 0 .5rem;font-size:.75rem;font-weight:800;text-transform:uppercase;color:var(--mf)}

.m{min-width:0;border:1px solid var(--bd);border-bottom-width:3px;border-radius:var(--r);background:var(--card);padding:1rem;box-shadow:0 1px 2px rgb(0 0 0/.05)}

.m1{border-bottom-color:var(--pri)}.m2{border-bottom-color:var(--fg)}.m3{border-bottom-color:oklch(.72 .11 174)}.m4{border-bottom-color:oklch(.69 .17 48)}

.ct{position:absolute;top:.75rem;left:.75rem;right:.75rem;display:flex;align-items:center;gap:.25rem;padding-bottom:.55rem;border-bottom:1px solid var(--bd)}

.qg{display:grid;gap:.75rem;margin-top:1.75rem;padding-bottom:2.5rem}

.pn{width:100%;max-width:28rem;background:var(--card);padding:1.25rem;box-shadow:0 20px 50px rgb(0 0 0/.25)}

.lw{max-width:24rem;margin:12vh auto 0;padding:0 1rem}.lw .box{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:1.5rem;box-shadow:0 1px 2px rgb(0 0 0/.05)}

.err{color:var(--bad);font-size:.875rem;min-height:1.3em;margin:.75rem 0 0}.hint{color:var(--mf);font-size:.9rem}
.pn{max-height:92vh;overflow:auto;border-radius:1rem 1rem 0 0}
.ph{display:flex;justify-content:space-between;gap:1rem}.ph p{margin:.25rem 0 0;font-size:.875rem;color:var(--mf)}
.pn h3{font-size:.75rem;font-weight:800;text-transform:uppercase;color:var(--mf);margin:1.25rem 0 .5rem}
.cur{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1rem;padding:.875rem;border-radius:var(--r);background:color-mix(in oklab,var(--pri) 8%,#fff);border:1px solid color-mix(in oklab,var(--pri) 30%,var(--bd))}
.cur b{display:block}.cur span{font-size:.8rem;color:var(--mf)}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.wl button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.1rem;min-height:3.25rem;padding:.5rem .75rem;border:1px solid var(--bd);border-radius:var(--r);background:#fff;text-align:left;font-weight:600;font-size:.875rem}
.wl button small{font-size:.7rem;color:var(--mf);font-weight:500}
.wl button.sel{background:var(--pri);border-color:var(--pri);color:#fff}.wl button.sel small{color:#fff;opacity:.85}
.kgr{display:grid;grid-template-columns:3.5rem 1fr 3.5rem;gap:.5rem}
.kgr button{height:3.25rem;border:1px solid var(--bd);border-radius:var(--r);background:#fff;font-size:1.5rem}
.kgr input,.xg input{width:100%;height:3.25rem;border:1px solid var(--bd);border-radius:var(--r);padding:0 .75rem;font:inherit;background:#fff;color:var(--fg);text-align:center;font-weight:700;font-size:1.25rem}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.xg label{font-size:.75rem;font-weight:700;color:var(--mf)}.xs{display:block;margin-top:.2rem;font-weight:500;color:var(--mf)}.xg input{height:2.75rem;font-size:1rem;margin-top:.25rem}
.wide{width:100%;height:3.25rem;margin-top:1.25rem;font-size:1rem}.btn:disabled{opacity:.4;cursor:default}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--fg);color:#fff;padding:.75rem 1.4rem;border-radius:99px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){.pn{border-radius:var(--r)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bsh{25%{transform:translate(.6px,-.4px)}75%{transform:translate(-.5px,.4px)}}
/* ---- этап 6: типы записей, остатки, телефон ---- */
:root{--ch:oklch(.66 .16 48);--chd:oklch(.52 .15 48);--cht:oklch(.955 .04 70)}
html{-webkit-text-size-adjust:100%}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

.top .acts{display:flex;gap:.5rem;flex-wrap:wrap}
.btn.c{background:var(--ch);border-color:var(--ch);color:#fff}
.btn.p,.btn.c{min-height:2.75rem}

  .top{align-items:stretch}.top>div:first-child{width:100%}.top .acts{width:100%}.top .acts .btn{flex:1}

}

@media(min-width:640px){main,.hd>div{padding-left:1.5rem;padding-right:1.5rem}.mgr{grid-template-columns:repeat(3,1fr)}.pn{border-radius:var(--r);margin:1rem}.top h1{font-size:1.875rem}}

.as{display:grid;gap:.6rem}
.ah{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.1rem;border-radius:1rem;color:#fff;background:linear-gradient(135deg,var(--pri),oklch(.52 .13 215));box-shadow:0 6px 18px -8px var(--pri)}
.ah .l{margin:0;font-size:.7rem;font-weight:800;text-transform:uppercase;opacity:.85}
.ah .hv{margin:.1rem 0 0;font-family:Sora,sans-serif;font-size:2.1rem;font-weight:700;line-height:1.1}.ah .hv small{font-size:.9rem;font-weight:600;opacity:.85}

.ah .hp{text-align:right;padding-left:1rem;border-left:1px solid rgb(255 255 255/.3)}.ah .hp b{display:block;font-family:Sora,sans-serif;font-size:1.5rem}

.ac .l{margin:0;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--mf)}
.ac .v{margin:.15rem 0 .3rem;font-family:Sora,sans-serif;font-size:1.4rem;font-weight:700}.ac .v small{font-size:.8rem;font-weight:600;color:var(--mf)}

.rg::before{content:"";position:absolute;inset:.42rem;border-radius:50%;background:var(--card)}
.rg b,.rg small{position:relative;line-height:1}.rg b{font-family:Sora,sans-serif;font-size:1.1rem}.rg small{font-size:.58rem;color:var(--mf)}
.sb{display:flex;height:.5rem;border-radius:99px;overflow:hidden;background:oklch(.93 .01 200)}.sb i{display:block;background:oklch(.72 .11 174)}.sb i+i{background:oklch(.69 .17 48)}

.mt{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.5rem,1fr));gap:.5rem}

.t1:hover{filter:brightness(.97)}.t1:active{transform:scale(.97)}

<body><div id="app"><p class="hint" style="padding:1rem">Загрузка…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="num.js"></script><script src="app.js"></script><script src="report-calc.js"></script><script src="leftover.js"></script><script src="residents.js"></script>
<script>
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Num.fmt(n);   // без округления: 0,175 → «0,175», 0,350 → «0,35»
const app=$('#app');
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let S=null,tab='all',timer=null,sel=null,isAdm=false;
const who=id=>(id&&S.names[id])||'';
const nextUrl=()=>{const n=q.get('next')||'';return /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(n)?n:null;};

function loginView(){
  clearInterval(timer);
  app.innerHTML=`<div class="lw"><div class="box"><img src="euss-logo.png" alt="EuSS"><h1>Вход</h1>
  <form id="lf"><label>Логин<input id="em" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
  <label>Пароль<input id="pw" type="password" autocomplete="current-password" required></label>
  <p class="err" id="er" role="alert"></p><button class="btn p" id="go" type="submit">Войти</button></form></div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;$('#er').textContent='';
    const{error}=await sb.auth.signInWithPassword({email:loginToEmail($('#em').value),password:pwFix($('#em').value,$('#pw').value)});
    if(error){$('#er').textContent=/invalid/i.test(error.message)?'Неверный логин или пароль':error.message;b.disabled=false;return;}
    const n=nextUrl();if(n){location.href=n;return;}start();};
}

async function loadAll(session){
  const uid=session.user.id;
  const[{data:pr},{data:forms},{data:acc},{data:can},{data:set},{data:wt},{data:ch},{data:rc}]=await Promise.all([
    sb.from('profiles').select('role').eq('id',uid).maybeSingle(),
    sb.from('forms').select('id,slug,name,type,sort_order').eq('archived',false).order('sort_order'),
    sb.from('form_access').select('form_id,role').eq('user_id',uid),
    sb.rpc('can_report'),
    sb.from('settings').select('*'),
    sb.from('wash_types').select('id,name,minutes').order('sort'),
    sb.from('chemicals').select('*').order('sort'),
    sb.from('recipes').select('*')]);
  const g=k=>{const x=(set||[]).find(y=>y.key===k);return x?+x.value:null};
  S={session,isSuper:pr?.role==='superadmin',forms:forms||[],acc:acc||[],can:!!can,tz:g('tz_offset')??5,st:g('shift_start')??6,
     refs:{water:g('water_l')??55,washTypes:wt||[],chemicals:ch||[],recipes:rc||[]},loads:[],changes:[],pool:null,names:{}};
  isAdm=await Residents.isAdmin();
  await loadLoads();
}
const shiftDate=()=>new Date(Date.now()+(S.tz-S.st)*3600e3).toISOString().slice(0,10);
async function loadLoads(){
  const d=shiftDate();
  const r=S.can?await sb.rpc('report_loads',{d1:d,d2:d}):await sb.from('loads').select('id,ts,shift_date,part,machine,wash_type_id,weight_kg,extras,finished_at,created_by').eq('shift_date',d).order('ts');
  S.loads=r.data||[];
  if(S.can){const c=await sb.rpc('report_changes',{d1:d,d2:d});S.changes=c.data||[];}
  const lo=await Leftover.fetch();S.pool=lo.rows;S.names=lo.names;S.poolErr=lo.error;
}
const roleOf=id=>S.isSuper?'admin':S.acc.find(a=>a.form_id===id)?.role;
const canFill=f=>S.isSuper||(f.type==='laundry_load'?['worker','admin'].includes(roleOf(f.id)):['foreman','admin'].includes(roleOf(f.id)));

function machines(){
  const now=Date.now(),out=[];
  for(let id=1;id<=12;id++){
    const last=S.loads.filter(l=>l.machine===id).sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];
    let status='ready',left=null,w=null;
    if(last){w=S.refs.washTypes.find(x=>x.id===last.wash_type_id);
      const end=new Date(last.ts).getTime()+(w?.minutes||0)*60000;
      if(!last.finished_at&&now<end){status='working';left=Math.max(1,Math.ceil((end-now)/60000));}}
    out.push({id,status,left,last,w});
  }
  return out;
}
function metrics(ms){
  const r=calcReport(S.loads,[],S.refs),own=S.can?'за смену':'ваши за смену';
  const mk=(key,lo,hi,title)=>{
    const g=r.groups[key],chem=g.chem.filter(c=>c.kind==='main').reduce((s,c)=>s+(c.theory?.l||0),0);
    const work=ms.filter(m=>m.id>=lo&&m.id<=hi&&m.status==='working').length;
    return{title,cards:[['Стирок',fmt(g.total),'',own,'m1'],['Вес',fmt(g.kg),'кг',own,'m2'],['Химия',fmt(chem,1),'л','по рецептам (теория)','m3'],['В работе',work+' / '+(hi-lo+1),'','сейчас','m4']]};
  };
  return{blocks:[mk('1_10',1,10,'Дозатор 1 · машины 1–10'),mk('11_12',11,12,'Дозатор 2 · машины 11–12')],total:{n:r.total,kg:r.kg}};
}


// ---------- остатки химии и лента операций ----------
const canConnect=()=>S.isSuper||S.forms.some(f=>f.type==='laundry_chem'&&canFill(f));
function leftoverBlock(){
  if(S.pool==null)return S.poolErr?'<p class="hint" style="margin:1rem 0 0">Остатки химии появятся после выполнения stage6.sql.</p>':'';
  return `<section aria-label="Остатки химии"><p class="gl" style="color:var(--chd)">Остатки химии · в запасе</p><div id="lov">${Leftover.html(S.pool,S.refs.chemicals,S.names,{can:canConnect(),canWriteoff:S.isSuper,today:shiftDate()})}</div></section>`;
}
function bindLeftover(){
  const el=document.getElementById('lov');if(!el||S.pool==null)return;
  Leftover.bind(el,S.pool,S.refs.chemicals,S.names,{can:canConnect(),canWriteoff:S.isSuper,today:shiftDate()},async()=>{await loadLoads();dashView();});
}
// ---------- общая статистика за смену (только админы) ----------
function shiftSeries(){
  const hr=t=>(new Date(t+S.tz*3600e3).getUTCHours()-S.st+24)%24;
  const n=Math.max(6,hr(Date.now())+1),c=Array(n).fill(0),k=Array(n).fill(0);
  S.loads.forEach(l=>{const h=hr(new Date(l.ts).getTime());if(h<n){c[h]++;k[h]+=+l.weight_kg||0;}});
  return{c,k};
}
const barsSvg=(a,col)=>{const mx=Math.max(1,...a),w=100/a.length;return `<svg viewBox="0 0 100 32" preserveAspectRatio="none" class="sp" aria-hidden="true">${a.map((v,i)=>{const h=v?Math.max(4,v/mx*30):2;return `<rect x="${(i*w+w*.15).toFixed(1)}" y="${(32-h).toFixed(1)}" width="${(w*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="1.2" fill="${col}" opacity="${v?1:.25}"/>`;}).join('')}</svg>`;};
const lineSvg=(a,col)=>{let t=0;const cum=a.map(v=>t+=v),mx=Math.max(1,t),d=cum.map((v,i)=>(i?'L':'M')+(i/(a.length-1||1)*100).toFixed(1)+' '+(30-v/mx*28).toFixed(1)).join('');return `<svg viewBox="0 0 100 32" preserveAspectRatio="none" class="sp" aria-hidden="true"><path d="${d}L100 32L0 32Z" fill="${col}" opacity=".15"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;};
function adminSummary(people){
  const r=calcReport(S.loads,[],S.refs),sr=shiftSeries();
  const mainL=k=>r.groups[k].chem.filter(c=>c.kind==='main').reduce((s,c)=>s+(c.theory?.l||0),0);
  const l1=mainL('1_10'),l2=mainL('11_12'),chL=l1+l2;
  const chKg=r.groups.all.chem.filter(c=>c.kind==='main').reduce((s,c)=>s+(c.theory?.kg||0),0);
  const work=machines().filter(m=>m.status==='working').length;
  const has=Number.isFinite(people)&&people>0,per=v=>has?Num.fmt(v/people,2):'–';
  const nPeople=people===undefined?'…':people==null?'не введено':fmt(people);
  const p1=chL>0?l1/chL*100:50;
  return `<section class="as" aria-label="Общая статистика"><p class="gl">Общая статистика за смену · видят только админы</p>
  <div class="ah"><div><p class="l">Вес на 1 жителя</p><p class="hv">${per(r.kg)} ${has?'<small>кг</small>':''}</p>
   <p class="hn">${has?'стирок на жителя: '+per(r.total)+' · химии: '+Num.fmt(chL*1000/people,1)+' мл':'введите число проживающих ниже'}</p></div>
   <div class="hp"><p class="l">Проживающих</p><b>${nPeople}</b></div></div>
  <div class="ag">
   <article class="ac rc"><div class="rg" style="--p:${Math.round(work/12*100)}"><b>${work}</b><small>из 12</small></div><div><p class="l">В работе</p><p class="n">машин сейчас</p></div></article>
   <article class="ac"><p class="l">Стирок всего</p><p class="v">${fmt(r.total)}</p>${barsSvg(sr.c,'var(--pri)')}<p class="n">по часам смены</p></article>
   <article class="ac"><p class="l">Вес всего</p><p class="v">${fmt(r.kg)} <small>кг</small></p>${lineSvg(sr.k,'oklch(.55 .1 250)')}<p class="n">нарастает за смену</p></article>
   <article class="ac"><p class="l">Химия всего</p><p class="v">${fmt(chL,1)} <small>л</small></p><div class="sb" title="Дозатор 1 / Дозатор 2"><i style="width:${p1.toFixed(0)}%"></i><i style="width:${(100-p1).toFixed(0)}%"></i></div><p class="n">≈ ${fmt(chKg,1)} кг · Д1 ${fmt(l1,1)} / Д2 ${fmt(l2,1)} л</p></article>
  </div></section>`;
}
function drawSummary(){const el=document.getElementById('asum');if(el)el.innerHTML=adminSummary(Residents.get(shiftDate()));}

function dashView(){
  const ms=machines(),em=showLogin(S.session.user.email),ini=em.slice(0,2).toUpperCase();
  const loc=new Date(Date.now()+S.tz*3600e3),first=S.forms.find(f=>f.type==='laundry_load'&&canFill(f)),firstChem=S.forms.find(f=>f.type==='laundry_chem'&&canFill(f));
  const hh=n=>String(n).padStart(2,'0'),acts=[];
  S.forms.filter(canFill).forEach(f=>acts.push([f.type==='laundry_chem'?'⚗':'▤',f.name,f.type==='laundry_chem'?'Замена химии':'Загрузка белья','form.html?f='+encodeURIComponent(f.slug),f.type==='laundry_chem'?'ch':'',0]));
  if(S.can){acts.push(['▦','Бланк за смену','Проверить и подготовить отчёт','blank.html','',1]);acts.push(['▥','Отчёт по сменам','Теория и факт по химии','report.html','',1]);acts.push(['☰','Журнал','Все операции: кто что добавил, исправил и удалил','journal.html','',1]);}
  if(S.isSuper){acts.push(['⚙','Настройки','Химия, рецепты, бланки','settings.html','',2]);acts.push(['☺','Пользователи','Создать и выдать доступ','admin.html','',2]);
    S.forms.forEach(f=>acts.push(['▣','QR: '+f.name,'Печать QR-кода','qr.html?f='+encodeURIComponent(f.slug),'',2]));}
  const vis=ms.filter(m=>tab==='all'||(tab==='main'?m.id<=10:m.id>=11));
  const T=[['all','Все машины'],['main','Дозатор 1 · 1–10'],['extra','Дозатор 2 · 11–12']];
  app.innerHTML=`
  <header class="hd"><div><div class="lg"><img src="euss-logo.png" alt="EuSS"><span class="sep hide-s"></span><span class="sub">Панель смены</span></div>
   <div class="me"><div class="t hide-s"><p class="eb">Смена ${hh(S.st)}:00–${hh(S.st)}:00</p><p>${esc(em)}${S.isSuper?' · суперадмин':''}</p></div>
   <div class="av">${esc(ini)}</div><button class="ib" id="out" aria-label="Выйти" title="Выйти">⎋</button></div></div></header>
  <main><div class="top"><div><p class="eb">Сегодня, ${loc.getUTCDate()} ${MON[loc.getUTCMonth()]}</p><h1>Обзор текущей смены</h1></div>
   <div class="acts">${first?`<a class="btn p" href="form.html?f=${encodeURIComponent(first.slug)}">🧺 Загрузка белья</a>`:''}${firstChem?`<a class="btn c" href="form.html?f=${encodeURIComponent(firstChem.slug)}">⚗ Замена химии</a>`:''}</div></div>
  ${isAdm?'<div id="asum"></div><div id="rsd"></div>':''}
  ${(()=>{const M=metrics(ms);return leftoverBlock()+M.blocks.map(b=>`<section aria-label="${esc(b.title)}"><p class="gl">${esc(b.title)}</p><div class="mg">${b.cards.map(([l,v,u,n,c])=>`<article class="m ${c}"><p class="l">${l}</p><p class="v">${v} ${u?`<small>${u}</small>`:''}</p><p class="n">${n}</p></article>`).join('')}</div></section>`).join('')+`<p class="hint" style="margin:.75rem 0 0">Всего по двум дозаторам: ${fmt(M.total.n)} стирок · ${fmt(M.total.kg)} кг</p>`;})()}
  <section><div class="sh"><div><h2>Стиральные машины</h2><p>Нажмите на машину, чтобы открыть запись</p></div>
   <div class="tabs" role="tablist">${T.map(([id,l])=>`<button role="tab" aria-selected="${tab===id}" data-t="${id}">${l}</button>`).join('')}</div></div>
   <div class="mt">${vis.map(m=>{const on=m.status==='working',pr=on&&m.w?.minutes?Math.min(100,Math.max(0,(1-m.left/m.w.minutes)*100)):0;return `<button class="t1 ${on?'on':''}" data-m="${m.id}" aria-label="Машина ${m.id}: ${on?'стирка, осталось '+m.left+' мин':'свободна'}"><i></i><span class="dm"><b>${hh(m.id)}</b></span><small>${on?m.left+' мин':'свободна'}</small>${on?`<em style="width:${pr.toFixed(0)}%"></em>`:''}</button>`;}).join('')}</div></section>
  ${acts.length?`<section aria-label="Разделы сайта">${[['Записи смены',0],['Отчёты и журнал',1],['Администрирование',2]].map(([t,g],k,all)=>{const l=acts.filter(a=>a[5]===g);return l.length?`<p class="gl">${t}</p><div class="qg" style="margin-top:.25rem;padding-bottom:.5rem">${l.map(a=>`<a class="qa ${a[4]||''}" href="${a[3]}"><span class="qi">${a[0]}</span><span><b>${esc(a[1])}</b><small>${esc(a[2])}</small></span><span>→</span></a>`).join('')}</div>`:''}).join('')}</section>`
   :'<p class="hint">Вам пока не выдан доступ ни к одному бланку. Обратитесь к суперадмину.</p>'}
  </main><div id="ovl"></div>`;
  $('#out').onclick=async()=>{await sb.auth.signOut();Residents.reset();isAdm=false;loginView();};
  bindLeftover();
  if(isAdm){drawSummary();Residents.mount($('#rsd'),shiftDate(),{today:shiftDate(),toast,onValue:drawSummary});}
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;dashView();});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sel=+b.dataset.m;panel(ms.find(m=>m.id===sel),first);});
  if(sel){const m=ms.find(m=>m.id===sel);if(m)panel(m,first);}
}

function panel(m,first){
  const l=m.last,busy=m.status==='working',wt=S.refs.washTypes,ex=S.refs.chemicals.filter(c=>c.kind==='extra');
  const hhmm=ts=>new Date(new Date(ts).getTime()+S.tz*3600e3).toISOString().slice(11,16);
  let w=null;
  $('#ovl').innerHTML=`<div class="ov" id="bg"><section class="pn" role="dialog" aria-modal="true" aria-label="Машина ${m.id}">
   <div class="ph"><div><p class="eb">${busy?'Стирка идёт':'Свободна'}</p><h2>Машина ${String(m.id).padStart(2,'0')}</h2><p>${m.id<=10?'Основной дозатор · 1–10':'Отдельный дозатор · 11–12'}</p></div><button class="ib" id="cl" aria-label="Закрыть">✕</button></div>
   ${busy?`<div class="cur ld"><div><b>🧺 ${esc(m.w?.name||'Загрузка')}</b><span>${fmt(l.weight_kg,1)} кг · с ${hhmm(l.ts)} · осталось ${m.left} мин${who(l.created_by)?'<br>Загрузил: '+esc(who(l.created_by)):''}</span></div><button class="btn p" id="fin">✓ Постиралось</button></div>`:''}
   ${first?`<h3>${busy?'Следующая стирка':'Вид стирки'}</h3>
   <div class="wl" id="wl">${wt.map(x=>`<button data-v="${x.id}"><span>${esc(x.name)}</span>${x.minutes?`<small>${x.minutes} мин</small>`:''}</button>`).join('')}</div>
   <h3>Вес, кг</h3><div class="kgr"><button id="mi" aria-label="Меньше">−</button><input id="kg" type="number" inputmode="decimal" min="0" step="any" value="25"><button id="pl" aria-label="Больше">+</button></div>
   ${ex.length?`<h3>Дополнительно, количество (шт)</h3><div class="xg">${ex.map(x=>`<label>${esc(x.name)}<input type="number" min="0" step="1" inputmode="numeric" data-x="${x.id}" data-u="${+x.per_unit||0}" data-un="${x.per_unit_unit==='g'?'г':'мл'}" placeholder="0"><small class="xs">1 шт = ${+x.per_unit||0} ${x.per_unit_unit==='g'?'г':'мл'}</small></label>`).join('')}</div>`:''}
   <button class="btn p wide" id="save">${busy?'Записать и начать следующую':'Записать загрузку'}</button>`
   :'<p class="hint" style="margin-top:1rem">Нет доступа к бланку загрузки.</p>'}</section></div>`;
  const close=()=>{sel=null;$('#ovl').innerHTML='';document.onkeydown=null;};
  document.onkeydown=e=>{if(e.key==='Escape')close();};
  $('#cl').onclick=close;$('#bg').onmousedown=e=>{if(e.target.id==='bg')close();};
  const fin=async()=>{const{error}=await sb.rpc('finish_load',{p_id:l.id});if(error){toast('Не удалось: '+error.message);return false;}return true;};
  if($('#fin'))$('#fin').onclick=async()=>{$('#fin').disabled=true;if(await fin()){await loadLoads();toast('Машина '+m.id+' свободна');dashView();}else $('#fin').disabled=false;};
  if(!first)return;
  document.querySelectorAll('[data-x]').forEach(i=>i.oninput=()=>{const n=+i.value||0,u=+i.dataset.u;i.nextElementSibling.textContent=n>0?n+' шт × '+u+' = '+fmt(n*u)+' '+i.dataset.un:'1 шт = '+u+' '+i.dataset.un;});
  $('#wl').onclick=e=>{const b=e.target.closest('button');if(!b)return;w=+b.dataset.v;$('#wl').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));};
  $('#mi').onclick=()=>$('#kg').value=Math.max(0,(+$('#kg').value||0)-1);
  $('#pl').onclick=()=>$('#kg').value=(+$('#kg').value||0)+1;
  $('#save').onclick=async()=>{
    if(!w){toast('Выберите вид стирки');return;}
    const kgv=+$('#kg').value;if(!(kgv>0)){toast('Укажите вес белья в килограммах');return;}
    if(kgv>100&&!confirm('Вес '+kgv+' кг. Это точно верно?'))return;
    const b=$('#save');b.disabled=true;
    if(busy&&!await fin()){b.disabled=false;return;}
    const extras={};document.querySelectorAll('[data-x]').forEach(i=>{if(+i.value>0)extras[i.dataset.x]=+i.value;});
    const{error}=await sb.from('loads').insert({form_id:first.id,machine:m.id,wash_type_id:w,weight_kg:kgv,extras});
    if(error){toast('Не сохранено: '+error.message);b.disabled=false;return;}
    sel=null;await loadLoads();dashView();toast('Машина '+m.id+': загрузка записана');
  };
}

async function start(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return loginView();
  const n=nextUrl();if(n){location.replace(n);return;}
  try{await loadAll(session);}catch(e){app.innerHTML='<p class="err" style="padding:1rem">Не удалось загрузить данные: '+esc(e.message)+'</p>';return;}
  dashView();
  clearInterval(timer);
  let k=0;timer=setInterval(async()=>{if(++k%2===0)await loadLoads();if(!sel&&!Residents.busy())dashView();},30000);
}
start();
</script></body></html>
