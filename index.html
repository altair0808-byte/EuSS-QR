<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EuSS — Бланки</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><p class="hint">Загрузка…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const app = $('#app');
const ROLE = { admin: 'Админ', foreman: 'Бригадир', worker: 'Сотрудник' };

// безопасный переход после входа: только на страницы этого же сайта
function nextUrl() {
  const n = q.get('next') || '';
  return /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(n) ? n : null;
}

function loginView() {
  app.innerHTML = `
    <header><h1>Вход</h1></header>
    <form id="login" class="box" autocomplete="on">
      <label>Почта<input id="em" type="email" autocomplete="username" required></label>
      <label>Пароль<input id="pw" type="password" autocomplete="current-password" required></label>
      <p class="err" id="err" role="alert"></p>
      <button class="go" id="enter" type="submit" style="margin-top:8px">Войти</button>
    </form>`;
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const b = $('#enter'); b.disabled = true; $('#err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) {
      $('#err').textContent = /invalid/i.test(error.message) ? 'Неверная почта или пароль' : error.message;
      b.disabled = false; return;
    }
    const n = nextUrl(); if (n) { location.href = n; return; }
    start();
  };
}

async function listView(session) {
  const uid = session.user.id;
  const [{ data: pr }, { data: forms, error: fe }, { data: acc }, { data: can }] = await Promise.all([
    sb.from('profiles').select('role').eq('id', uid).maybeSingle(),
    sb.from('forms').select('id,slug,name,type,sort_order,archived').eq('archived', false).order('sort_order'),
    sb.from('form_access').select('form_id,role').eq('user_id', uid),
    sb.rpc('can_report')
  ]);
  const isSuper = pr?.role === 'superadmin';
  const roleOf = id => isSuper ? 'admin' : (acc || []).find(a => a.form_id === id)?.role;

  const items = (forms || []).map(f => {
    const r = roleOf(f.id);
    const canFill = isSuper || (f.type === 'laundry_load' ? ['worker', 'admin'].includes(r) : ['foreman', 'admin'].includes(r));
    return `<div class="card"><div><span class="nm">${esc(f.name)}</span><small>${isSuper ? 'Суперадмин' : esc(ROLE[r] || '')}</small></div>
      <span>${canFill ? `<a href="form.html?f=${encodeURIComponent(f.slug)}">Открыть</a>` : '<small>только просмотр</small>'}${isSuper || r === 'admin' ? ` · <a href="qr.html?f=${encodeURIComponent(f.slug)}">QR</a>` : ''}</span></div>`;
  }).join('');

  const nav = [
    can ? '<a class="ghost" href="report.html">Отчёт</a>' : '',
    can ? '<a class="ghost" href="blank.html">Бланк за смену</a>' : '',
    isSuper ? '<a class="ghost" href="settings.html">Настройки</a><a class="ghost" href="admin.html">Пользователи</a>' : ''
  ].join('');

  let empty = '';
  if (fe) empty = `<p class="err">Не удалось загрузить бланки: ${esc(fe.message)}</p>`;
  else if (!items) empty = isSuper
    ? '<p class="hint">Бланков нет. Выполните supabase.sql (раздел «Начальные данные»).</p>'
    : '<p class="hint">Вам пока не выдан доступ ни к одному бланку. Обратитесь к суперадмину.</p>';

  app.innerHTML = `
    <header><h1>Бланки</h1><button class="ghost" id="out">Выйти</button></header>
    <p class="hint">${esc(session.user.email)}${isSuper ? ' · суперадмин' : ''}</p>
    <div class="cards">${items}</div>${empty}
    ${nav ? `<h2>Разделы</h2><div class="row" style="flex-wrap:wrap">${nav}</div>` : ''}`;
  $('#out').onclick = async () => { await sb.auth.signOut(); loginView(); };
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const n = nextUrl(); if (n) { location.replace(n); return; }
  listView(session);
}
start();
</script></body></html>
