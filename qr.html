<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR бланка</title><link rel="stylesheet" href="style.css"></head>
<body><main class="qr">
<h1 id="t"></h1><div id="code"></div><p id="u"></p>
<button class="go" onclick="print()">Печать</button>
<a class="ghost" href="index.html">К списку бланков</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
(async () => {
  if (!await need()) return;
  const { data: f } = await sb.from('forms').select('name').eq('slug', q.get('f')).maybeSingle();
  $('#t').textContent = f ? f.name : 'Бланк недоступен';
  if (!f) return;
  const u = new URL('form.html?f=' + q.get('f'), location.href).href;
  new QRCode($('#code'), { text: u, width: 340, height: 340 });
  $('#u').textContent = u;
})();
</script></body></html>
