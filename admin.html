<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пользователи — EuSS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2aa3b5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EuSS">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Администрирование</span></a><nav class="nav"><a class="btn s" href="settings.html">Настройки</a><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top"><h1>Пользователи</h1></div>
<div class="box">
  <h2>Новый сотрудник</h2>
  <label>Имя<input id="nm" placeholder="Фамилия Имя" autocomplete="off"></label>
  <label>Логин <small>(от 4 символов: латиница, цифры, . _ -)</small><input id="em" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
  <label>Пароль <small>(от 4 символов)</small><input id="pw" autocomplete="off"></label>
  <button class="mini" id="gen" type="button" style="margin-top:.5rem">Придумать пароль</button>
  <h3>Доступ к бланкам</h3><div id="fa"></div>
  <button class="go" id="mk">Создать сотрудника</button>
</div>
<div id="made" class="box" hidden></div>
<h2>Все аккаунты <small id="cnt" style="font-weight:500"></small></h2>
<p class="hint" id="warn" hidden></p>
<label>Поиск<input id="q" type="search" placeholder="Имя или логин" autocomplete="off"></label>
<div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = { '': 'Нет доступа', worker: 'Сотрудник', foreman: 'Бригадир', admin: 'Админ' };
const opts = v => Object.entries(R).map(([k, t]) => `<option value="${k}"${k === v ? ' selected' : ''}>${t}</option>`).join('');
let forms = [];

async function call(b) {
  const { data, error } = await sb.functions.invoke('admin-users', { body: b });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (e) {} toast('Не выполнено: ' + m); return null; }
  return data;
}

const RANK = { admin: 3, foreman: 2, worker: 1 };
const summary = roles => { const r = roles.filter(Boolean).sort((a, b) => RANK[b] - RANK[a]); return r.length ? R[r[0]] : 'Нет доступа'; };
const when = ts => ts ? new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'ещё не входил';
// быстрые роли: какой доступ выдать на каждый бланк. Точная настройка по бланкам остаётся в списках ниже
const PRESETS = { none: 'Без доступа', worker: 'Сотрудник', foreman: 'Бригадир', admin: 'Админ' };
const presetRole = (p, f) => p === 'admin' ? 'admin' : p === 'foreman' ? (f.type === 'laundry_chem' ? 'foreman' : 'worker') : p === 'worker' ? (f.type === 'laundry_chem' ? '' : 'worker') : '';
let accounts = [];

async function accountsList() {
  const r = await sb.rpc('list_accounts');
  if (!r.error) { $('#warn').hidden = true; return (r.data || []).map(a => ({ id: a.acc_id, email: a.acc_email, name: a.acc_name, last: a.acc_last, sup: a.acc_super })); }
  // stage11.sql ещё не выполнен: показываем только тех, кто есть в таблице people
  $('#warn').hidden = false; $('#warn').textContent = 'Чтобы видеть все аккаунты и время входа, выполните stage11.sql в Supabase. Сейчас показаны только созданные через эту страницу.';
  const [{ data: ppl }, { data: sup }] = await Promise.all([sb.from('people').select('*').order('created_at'), sb.from('profiles').select('id').eq('role', 'superadmin')]);
  return (ppl || []).map(p => ({ id: p.id, email: p.email, name: p.full_name, last: null, sup: (sup || []).some(x => x.id === p.id) }));
}

async function load() {
  const [{ data: f }, acc, list] = await Promise.all([
    sb.from('forms').select('id,name,type').eq('archived', false).order('sort_order'),
    sb.from('form_access').select('*'),
    accountsList()
  ]);
  forms = f || []; accounts = list;
  $('#fa').innerHTML = forms.map(x => `<div class="acc"><span>${esc(x.name)}</span><select data-f="${x.id}">${opts('')}</select></div>`).join('');
  let noAccess = 0;
  $('#list').innerHTML = accounts.map(p => {
    const mine = forms.map(x => { const a = (acc.data || []).find(r => r.user_id === p.id && r.form_id === x.id); return { x, role: a ? a.role : '' }; });
    const tag = p.sup ? 'Суперадмин' : summary(mine.map(m => m.role));
    if (!p.sup && tag === 'Нет доступа') noAccess++;
    const login = showLogin(p.email);
    return `<div class="box" data-u="${p.id}" data-s="${esc((p.name || '') + ' ' + login).toLowerCase()}">
      <b>${esc(p.name || login)}</b> <small>${p.name ? 'логин: ' + esc(login) + ' · ' : ''}вход: ${when(p.last)}</small>
      <div><span class="tg ld rt" style="margin-top:.4rem">${tag}</span></div>` +
      (p.sup ? '<div class="row"><button class="mini" data-act="nm">Имя</button><button class="mini" data-act="pw">Новый пароль</button></div></div>' :
      `<h3 style="margin-top:.9rem">Быстрая роль на все бланки</h3><div class="row">${Object.entries(PRESETS).map(([k, t]) => `<button class="mini" data-act="pre" data-p="${k}">${t}</button>`).join('')}</div>
      <h3>Доступ по бланкам</h3>` +
      mine.map(m => `<div class="acc"><span>${esc(m.x.name)}</span><select data-f="${m.x.id}">${opts(m.role)}</select></div>`).join('') +
      `<div class="row"><button class="mini" data-act="nm">Имя</button><button class="mini" data-act="pw">Новый пароль</button><button class="mini danger" data-act="del">Удалить</button></div></div>`);
  }).join('');
  $('#cnt').textContent = `· ${accounts.length}` + (noAccess ? `, без доступа: ${noAccess}` : '');
  $('#q').oninput();
}

$('#q').oninput = () => { const v = $('#q').value.trim().toLowerCase(); document.querySelectorAll('#list [data-u]').forEach(b => b.style.display = v && !b.dataset.s.includes(v) ? 'none' : ''); };

$('#gen').onclick = () => {
  const c = 'abcdefghjkmnpqrstuvwxyz23456789', a = crypto.getRandomValues(new Uint8Array(8));
  $('#pw').value = [...a].map(x => c[x % c.length]).join('');
};

$('#mk').onclick = async () => {
  const access = [...document.querySelectorAll('#fa select')].filter(s => s.value).map(s => ({ form_id: s.dataset.f, role: s.value }));
  const le = loginError($('#em').value); if (le) { toast(le); return; }
  if ($('#pw').value.length < 4) { toast('Пароль: не меньше 4 символов'); return; }
  const b = { action: 'create', login: normLogin($('#em').value), password: $('#pw').value, full_name: $('#nm').value.trim(), access };
  if (!await call(b)) return;
  $('#made').hidden = false;
  $('#made').innerHTML = `Создан: <b>${esc(b.full_name || b.login)}</b><br>Логин: <code>${esc(b.login)}</code><br>Пароль: <code>${esc(b.password)}</code><br><small>Передайте сотруднику. Пароль больше нигде не показывается.</small>`;
  ['nm', 'em', 'pw'].forEach(i => $('#' + i).value = '');
  load();
};

const refreshTag = box => { const t = box.querySelector('.rt'); if (t) t.textContent = summary([...box.querySelectorAll('select')].map(x => x.value)); };

$('#list').onchange = async e => {
  const s = e.target.closest('select'); if (!s) return;
  const box = s.closest('[data-u]'), u = box.dataset.u;
  const { error } = s.value
    ? await sb.from('form_access').upsert({ user_id: u, form_id: s.dataset.f, role: s.value })
    : await sb.from('form_access').delete().eq('user_id', u).eq('form_id', s.dataset.f);
  if (!error) refreshTag(box);
  toast(error ? 'Не сохранено' : 'Сохранено');
};

$('#list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const box = b.closest('[data-u]'), u = box.dataset.u;
  if (b.dataset.act === 'pre') {
    const p = b.dataset.p, who = box.querySelector('b').textContent;
    if (p === 'admin' && !confirm('Выдать «Админ» на все бланки: ' + who + '?\nАдмин может исправлять и удалять записи сотрудников (с паролем).')) return;
    let err = null;
    for (const f of forms) {
      const role = presetRole(p, f);
      const r = role ? await sb.from('form_access').upsert({ user_id: u, form_id: f.id, role }) : await sb.from('form_access').delete().eq('user_id', u).eq('form_id', f.id);
      err = err || r.error;
      const sel = box.querySelector(`select[data-f="${f.id}"]`); if (sel) sel.value = role;
    }
    refreshTag(box); toast(err ? 'Сохранено не полностью' : 'Роль: ' + PRESETS[p]);
  } else if (b.dataset.act === 'nm') {
    const name = prompt('Фамилия Имя'); if (name === null) return;
    const { error } = await sb.from('people').update({ full_name: name.trim() || null }).eq('id', u);
    toast(error ? 'Не сохранено' : 'Сохранено'); load();
  } else if (b.dataset.act === 'pw') {
    const password = prompt('Новый пароль (от 4 символов)'); if (!password) return;
    if (password.length < 4) { toast('Пароль: не меньше 4 символов'); return; }
    if (await call({ action: 'password', id: u, password })) toast('Пароль изменён');
  } else if (b.dataset.act === 'del' && confirm('Удалить пользователя?')) {
    if (await call({ action: 'remove', id: u })) { toast('Удалён'); load(); }
  }
};

(async () => {
  const s = await need(); if (!s) return;
  const { data: pr } = await sb.from('profiles').select('role').eq('id', s.user.id).maybeSingle();
  if (!pr || pr.role !== 'superadmin') { location.replace('index.html'); return; }
  load();
})();
</script><script src="compat.js"></script>
<script src="idle.js"></script>
<script src="pwa.js"></script>
</body></html>
