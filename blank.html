<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бланк за смену — EuSS</title><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"><style>
/* бланк за смену: спокойный вид таблиц */
.sum{display:grid;grid-template-columns:repeat(4,1fr);margin-top:.75rem;border:1px solid var(--ln);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
.sum>div{padding:.7rem .9rem;min-width:0}.sum>div+div{border-left:1px solid var(--ln)}
.sum span{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--mut)}
.sum b{display:block;margin-top:.1rem;font-family:Sora,Manrope,sans-serif;font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}
.sum b i{font-style:normal;font-family:Manrope,sans-serif;font-size:.8rem;font-weight:600;color:var(--mut)}
.sum small{display:block;font-size:.75rem;color:var(--mut)}
@media(max-width:639px){.sum{grid-template-columns:1fr 1fr}.sum>div:nth-child(3){border-left:0}.sum>div:nth-child(n+3){border-top:1px solid var(--ln)}.sum b{font-size:1.15rem}}
.okl{margin:.6rem 0 0;font-size:.82rem;color:var(--mut)}.okl::before{content:"✓ ";color:var(--good);font-weight:800}
details.cx{margin:.6rem 0 0;border:1px solid color-mix(in oklab,oklch(.69 .17 48) 45%,var(--ln));border-radius:var(--r);background:color-mix(in oklab,oklch(.69 .17 48) 7%,#fff)}
details.cx.bad{border-color:color-mix(in oklab,var(--bad) 40%,var(--ln));background:color-mix(in oklab,var(--bad) 5%,#fff)}
details.cx>summary{padding:.6rem .9rem;cursor:pointer;font-size:.88rem;font-weight:700;list-style:none}
details.cx>summary::-webkit-details-marker{display:none}
details.cx>div{padding:.1rem .9rem .6rem;font-size:.85rem}details.cx>div+div{border-top:1px dashed var(--ln);padding-top:.5rem}
details.cx span{display:block;color:var(--mut);font-size:.8rem}
.tabs2{margin-top:1rem}.tabs2 button{flex:1 1 auto}
.pn2{margin-top:.75rem}.pn2>.hint{margin:0 0 .5rem}
.tw{border:1px solid var(--ln);border-radius:var(--r);background:#fff;box-shadow:var(--sh);overflow-x:auto}
.tw.scroll{max-height:70vh;overflow:auto}
.t2{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
.t2 th,.t2 td{padding:.34rem .65rem;text-align:right;white-space:nowrap;border-top:1px solid color-mix(in oklab,var(--ln) 60%,#fff)}
.t2 thead th{position:sticky;top:0;z-index:1;background:var(--soft);border-top:0;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--mut)}
.t2 thead tr+tr th{top:1.85rem}
.t2 th.l,.t2 td.l{text-align:left}
.t2 tbody th{font-weight:600;color:var(--ink)}
.t2 .z{color:color-mix(in oklab,var(--mut) 40%,#fff)}
.t2 .dim{color:var(--mut);font-weight:500}
.t2 tr.sub th,.t2 tr.sub td{background:var(--soft);font-weight:700;border-top:1px solid var(--ln)}
.t2 tr.tot th,.t2 tr.tot td{background:var(--tint);font-weight:800;border-top:2px solid var(--ink)}
.t2 tfoot th,.t2 tfoot td{position:sticky;bottom:0;background:var(--tint);font-weight:800;border-top:2px solid var(--ink)}
.t2 tr.flag th,.t2 tr.flag td{background:color-mix(in oklab,oklch(.69 .17 48) 9%,#fff)}
.t2 tr.miss th,.t2 tr.miss td{background:color-mix(in oklab,oklch(.69 .17 48) 8%,#fff)}
.t2 td.none{text-align:left;color:var(--mut);font-size:.8rem}
.t2 tr.go-day{cursor:pointer}.t2 tr.go-day:hover th,.t2 tr.go-day:hover td{background:var(--soft)}
.t2 th a{color:var(--ac-d);text-decoration:underline;text-underline-offset:2px}
.t2 .sp{border-left:1px solid var(--ln)}
details.det{margin-top:.75rem}
.cal{margin-top:0}
@media(max-width:640px){.t2 .hs{display:none}.t2 th,.t2 td{padding:.4rem .45rem}}
</style>
</head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Отчёты</span></a><nav class="nav"><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top"><p class="eb" id="eb">Смена</p><h1 id="ttl">Бланк за смену</h1></div>
<div class="box">
  <div class="seg" id="md" role="group" aria-label="Режим отчёта"><button data-v="day" class="on" aria-pressed="true">Одна смена</button><button data-v="month" aria-pressed="false">Месяц</button></div>
  <div id="dayc">
    <div class="dnav" style="margin-top:.75rem"><button class="btn" id="pv" aria-label="Предыдущая смена" title="Предыдущая смена">‹</button><label>Дата смены<input type="date" id="d"></label><button class="btn" id="nx" aria-label="Следующая смена" title="Следующая смена">›</button></div>
    <div class="seg" role="group" aria-label="Смена"><button id="t">Сегодня</button><button id="y">Вчера</button></div>
  </div>
  <div id="monc" hidden>
    <div class="dnav" style="margin-top:.75rem"><button class="btn" id="mpv" aria-label="Предыдущий месяц" title="Предыдущий месяц">‹</button><label>Месяц<select id="mm"></select></label><label>Год<select id="yy"></select></label><button class="btn" id="mnx" aria-label="Следующий месяц" title="Следующий месяц">›</button></div>
    <div class="seg" role="group" aria-label="Период"><button id="mt">Этот месяц</button><button id="mp">Прошлый месяц</button></div>
  </div>
  <p class="hint" id="msg"></p>
  <button class="go" id="x" style="margin-top:.5rem">⬇ Скачать Excel за месяц</button>
</div>
<div id="out"><p class="hint">Загрузка…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="config.js"></script><script src="num.js"></script><script src="app.js"></script><script src="report-calc.js"></script><script src="chem-stats.js"></script><script src="blanc.js"></script><script src="storage-anim.js"></script><script src="residents.js"></script>
<script>
let refs = null, tz = 5, st = 6, seq = 0, isAdm = false, isSuper = false;   // isAdm: админ или суперадмин (видят проживающих), isSuper: может добавлять химию
const shiftToday = () => new Date(Date.now() + (tz - st) * 3600e3).toISOString().slice(0, 10);
const addDays = (d, n) => new Date(new Date(d + 'T00:00:00Z').getTime() + n * 864e5).toISOString().slice(0, 10);
const lastDay = ym => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate();
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dmy = d => d.split('-').reverse().join('.');
const longDate = d => `${+d.slice(8)} ${MON[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`;
const E = Blank.esc, F = n => Num.fmt(n);   // без округления: 0,175 → «0,175», 0,350 → «0,35»

async function loads(d1, d2) {
  const { data, error } = await sb.rpc('report_loads', { d1, d2 });
  if (error) throw error;
  return data || [];
}

// Проверки данных: всё, что может исказить итоги, показываем сразу, а не прячем.
function checks(m, data) {
  const out = [], mins = {}; refs.washTypes.forEach(w => mins[w.id] = +w.minutes || 0);
  const byM = {}; data.forEach(l => (byM[l.machine] = byM[l.machine] || []).push(l));
  const overlaps = [];
  Object.entries(byM).forEach(([mach, arr]) => {
    arr.sort((a, b) => new Date(a.ts) - new Date(b.ts));
    for (let i = 1; i < arr.length; i++) {
      const gap = (new Date(arr[i].ts) - new Date(arr[i - 1].ts)) / 60000, need = mins[arr[i - 1].wash_type_id] || 0;
      if (need && gap < need * .5) overlaps.push(`машина ${mach}: интервал ${Math.round(gap)} мин при стирке ${need} мин`);
    }
  });
  const odd = data.filter(l => !(+l.weight_kg > 0) || +l.weight_kg > 100);
  const rawKg = data.reduce((x, l) => x + (+l.weight_kg || 0), 0), msN = Object.values(m.machineStats).reduce((x, y) => x + y.n, 0), msKg = Object.values(m.machineStats).reduce((x, y) => x + y.kg, 0);
  const okSum = msN === data.length && Math.abs(msKg - rawKg) < 1e-6 && m.total.n + m.total.unknownN === data.length && Math.abs(m.total.kg - m.total.colSum.reduce((x, y) => x + y, 0)) < 1e-6;
  out.push({ k: okSum ? 'ok' : 'bad', t: okSum ? `Итоги сходятся: ${data.length} записей, ${F(rawKg)} кг` : 'Итоги по машинам и по видам расходятся, сообщите администратору' });
  if (m.total.unknownN) out.push({ k: 'warn', t: `Вид стирки не из шаблона: ${m.total.unknownN} (${Object.entries(m.unknown).map(([n, c]) => E(n) + ' ' + c).join(', ')})`, n: 'Они есть в итогах по машинам и химии, но в классический бланк и Excel-лист дня не попадают.' });
  if (m.lost.length) out.push({ k: 'warn', t: `Не влезло в 5 строк бланка: ${m.lost.length}`, n: 'В итогах и в сумме по столбцам эти стирки учтены. В ячейки Excel помещаются первые 5 на вид и машину.' });
  if (overlaps.length) out.push({ k: 'warn', t: `Слишком короткий интервал на машине: ${overlaps.length}`, n: overlaps.slice(0, 4).join('; ') + (overlaps.length > 4 ? '…' : '') });
  if (odd.length) out.push({ k: 'bad', t: `Подозрительный вес: ${odd.length}`, n: odd.slice(0, 4).map(l => `машина ${l.machine}, ${F(l.weight_kg)} кг`).join('; ') });
  if (m.skipped && m.skipped.length) out.push({ k: 'warn', t: 'Химия вне шаблона Excel: ' + m.skipped.map(E).join(', ') });
  if (!overlaps.length && !odd.length && !m.total.unknownN && !m.lost.length) out.push({ k: 'ok', t: 'Подозрительных записей нет' });
  return { out, overlapMachines: new Set(Object.keys(byM).filter(k => overlaps.some(o => o.startsWith('машина ' + k + ':')))) };
}

const all12 = Array.from({ length: 12 }, (_, i) => i + 1);
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const MONN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const wdOf = d => WD[(new Date(d + 'T00:00:00Z').getUTCDay() + 6) % 7];
const addMonth = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const ymLabel = ym => MONN[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
let mode = 'day', ym = null;
const tabState = { day: 'mach', mon: 'cal', chem: 'stor' };            // выбранная вкладка помнится при смене даты

// ---------- общие элементы ----------
const strip = k => `<div class="sum">${k.map(([l, v, u, n]) => `<div><span>${l}</span><b>${v}${u ? ` <i>${u}</i>` : ''}</b><small>${n}</small></div>`).join('')}</div>`;
// одна строка «всё сходится» или раскрывающийся список замечаний: вместо длинного блока проверок
function chkLine(out) {
  const ok = out.filter(c => c.k === 'ok'), bad = out.filter(c => c.k === 'bad'), warn = out.filter(c => c.k === 'warn'), n = bad.length + warn.length;
  const line = ok.length ? `<p class="okl">${ok.map(c => c.t).join(' · ')}</p>` : '';
  if (!n) return line;
  return `${line}<details class="cx${bad.length ? ' bad' : ''}"${bad.length ? ' open' : ''}><summary>${bad.length ? '✕' : '⚠'} Замечаний: ${n}</summary>${[...bad, ...warn].map(c => `<div><b>${c.t}</b>${c.n ? `<span>${c.n}</span>` : ''}</div>`).join('')}</details>`;
}
const tabBar = (g, items) => `<div class="seg tabs2" data-tabs="${g}" role="tablist">${items.map(([v, l]) => `<button role="tab" data-tab="${v}" aria-selected="${v === tabState[g]}" class="${v === tabState[g] ? 'on' : ''}">${l}</button>`).join('')}</div>`;
function setTab(g, v) {
  tabState[g] = v;
  document.querySelectorAll(`[data-tabs="${g}"] button`).forEach(b => { const on = b.dataset.tab === v; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  document.querySelectorAll(`[data-p^="${g}:"]`).forEach(p => { p.hidden = p.dataset.p !== g + ':' + v; });
}
const applyTabs = () => Object.keys(tabState).forEach(g => document.querySelector(`[data-tabs="${g}"]`) && setTab(g, tabState[g]));
const cell = (v, d = 1) => v ? F(v, d) : '<span class="z">·</span>';

// ---------- машины ----------
function machTable(ms, flags) {
  const row = n => { const x = ms[n], flag = flags.has(String(n));
    return `<tr${flag ? ' class="flag"' : ''}><th class="l">Машина ${n}</th><td class="sp">${cell(x.day, 0)}</td><td>${cell(x.dayKg)}</td><td class="sp">${cell(x.night, 0)}</td><td>${cell(x.nightKg)}</td><td class="sp"><b>${cell(x.n, 0)}</b></td><td><b>${cell(x.kg)}</b></td><td>${x.n ? F(x.kg / x.n) : '<span class="z">·</span>'}</td></tr>`; };
  const sumRow = (label, rows, cls) => { const a = rows.map(n => ms[n]), s = k => a.reduce((t, x) => t + x[k], 0), n = s('n'), kg = s('kg');
    return `<tr class="${cls}"><th class="l">${label}</th><td class="sp">${s('day')}</td><td>${F(s('dayKg'))}</td><td class="sp">${s('night')}</td><td>${F(s('nightKg'))}</td><td class="sp">${n}</td><td>${F(kg)}</td><td>${n ? F(kg / n) : '–'}</td></tr>`; };
  return `<div class="tw"><table class="t2"><thead><tr><th class="l" rowspan="2">Машина</th><th colspan="2" class="sp">День</th><th colspan="2" class="sp">Ночь</th><th colspan="2" class="sp">Всего</th><th rowspan="2">Ср. кг</th></tr><tr><th class="sp">ст.</th><th>кг</th><th class="sp">ст.</th><th>кг</th><th class="sp">ст.</th><th>кг</th></tr></thead><tbody>
    ${all12.slice(0, 10).map(row).join('')}${sumRow('Итого 1–10 · дозатор 1', all12.slice(0, 10), 'sub')}${all12.slice(10).map(row).join('')}${sumRow('Итого 11–12 · дозатор 2', [11, 12], 'sub')}${sumRow('Всего', all12, 'tot')}</tbody></table></div>`;
}

// ---------- виды стирки: дозатор 1 и дозатор 2 в одной таблице ----------
function typesTable(data) {
  const rows = {}, order = [];
  const get = id => rows[id] || (order.push(id), rows[id] = { name: 'вид ' + id, min: 0, a: { n: 0, kg: 0 }, b: { n: 0, kg: 0 } });
  refs.washTypes.forEach(w => { const r = get(w.id); r.name = w.name; r.min = +w.minutes || 0; });
  data.forEach(l => { const g = +l.machine <= 10 ? get(l.wash_type_id).a : get(l.wash_type_id).b; g.n++; g.kg += +l.weight_kg || 0; });
  const list = order.map(id => rows[id]).filter(r => r.a.n || r.b.n);
  const T = list.reduce((t, r) => ({ an: t.an + r.a.n, ak: t.ak + r.a.kg, bn: t.bn + r.b.n, bk: t.bk + r.b.kg, h: t.h + (r.a.n + r.b.n) * r.min / 60 }), { an: 0, ak: 0, bn: 0, bk: 0, h: 0 });
  return `<div class="tw"><table class="t2"><thead><tr><th class="l">Вид стирки</th><th class="sp">1–10, ст.</th><th>1–10, кг</th><th class="sp">11–12, ст.</th><th>11–12, кг</th><th class="sp">Всего, ст.</th><th>Всего, кг</th><th class="sp hs">Время, ч</th></tr></thead><tbody>
    ${list.map(r => `<tr><th class="l">${E(r.name)}</th><td class="sp">${cell(r.a.n, 0)}</td><td>${cell(r.a.kg)}</td><td class="sp">${cell(r.b.n, 0)}</td><td>${cell(r.b.kg)}</td><td class="sp"><b>${r.a.n + r.b.n}</b></td><td><b>${F(r.a.kg + r.b.kg)}</b></td><td class="sp hs">${F((r.a.n + r.b.n) * r.min / 60)}</td></tr>`).join('') || '<tr><td class="none" colspan="8">Нет стирок</td></tr>'}
    <tr class="tot"><th class="l">Итого</th><td class="sp">${T.an}</td><td>${F(T.ak)}</td><td class="sp">${T.bn}</td><td>${F(T.bk)}</td><td class="sp">${T.an + T.bn}</td><td>${F(T.ak + T.bk)}</td><td class="sp hs">${F(T.h)}</td></tr></tbody></table></div>`;
}

// ---------- химия ----------
// расход химии по дозаторам за одну или несколько смен (list: модели Blank.build)
function chemBlock(list) {
  const base = list[0] || Blank.build([], refs, '2000-01-01');
  const sum = (k, i, key) => list.reduce((s, m) => s + (m.groups[key][k][i] || 0), 0);
  const unit = c => c.per_unit_unit === 'g' ? 'г' : 'мл';
  const rows = [...base.mains.map((c, i) => [c.name, 'по рецепту', sum('chem', i, '1_10') / 1000, sum('chem', i, '11_12') / 1000, 'л']),
    ...base.extras.map((c, i) => [c.name, `${F(sum('exQty', i, 'all'), 0)} шт × ${+c.per_unit || 0} ${unit(c)}`, sum('exTot', i, '1_10') / 1000, sum('exTot', i, '11_12') / 1000, c.per_unit_unit === 'g' ? 'кг' : 'л'])];
  return `<div class="tw"><table class="t2"><thead><tr><th class="l">Химия</th><th class="l hs">Как посчитано</th><th>Дозатор 1</th><th>Дозатор 2</th><th>Всего</th></tr></thead><tbody>
    ${rows.map(([n, how, a, b, u]) => `<tr><th class="l">${E(n)}</th><td class="l dim hs">${how}</td><td>${cell(a, 2)}${a ? ` <span class="dim">${u}</span>` : ''}</td><td>${cell(b, 2)}${b ? ` <span class="dim">${u}</span>` : ''}</td><td><b>${cell(a + b, 2)}</b>${a + b ? ` <span class="dim">${u}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Теоретический расход по рецептам и отправленным загрузкам. Фактический расход по заменам бутылей смотрите в отчёте по сменам.</p>`;
}
// теоретический расход основной химии по видам стирки (раскрывается по желанию)
function chemByType(list) {
  const base = list[0]; if (!base) return '';
  const rows = base.types.map((ty, t) => ({ name: ty.name, n: list.reduce((s, m) => s + m.types[t].n, 0), chem: base.mains.map((_, i) => list.reduce((s, m) => s + m.types[t].chem[i], 0) / 1000) })).filter(r => r.n);
  if (!rows.length) return '';
  const tot = base.mains.map((_, i) => rows.reduce((s, r) => s + r.chem[i], 0));
  return `<details class="box det"><summary><b>Расход основной химии по видам стирки</b> <small>литры</small></summary><div class="tw" style="margin-bottom:1rem"><table class="t2"><thead><tr><th class="l">Вид стирки</th><th>Стирок</th>${base.mains.map(c => `<th>${E(c.name)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr><th class="l">${E(r.name)}</th><td>${r.n}</td>${r.chem.map(v => `<td>${cell(v, 2)}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><th class="l">Итого</th><td>${rows.reduce((s, r) => s + r.n, 0)}</td>${tot.map(v => `<td>${F(v, 2)}</td>`).join('')}</tr></tbody></table></div></details>`;
}

// ---------- одна смена ----------
function view(m, data) {
  const G = m.groups, ms = m.machineStats;
  const day = Object.values(ms).reduce((a, x) => a + x.day, 0), night = Object.values(ms).reduce((a, x) => a + x.night, 0);
  const used = Object.values(ms).filter(x => x.n).length;
  const ck = checks(m, data);
  return `${strip([['Стирок', F(G.all.n, 0), '', `день ${day} · ночь ${night}`], ['Белья', F(G.all.kg), 'кг', G.all.n ? `в среднем ${F(G.all.kg / G.all.n)} кг` : 'нет данных'],
      ['Дозатор 1 · 1–10', F(G['1_10'].n, 0), 'ст.', `${F(G['1_10'].kg)} кг`], ['Дозатор 2 · 11–12', F(G['11_12'].n, 0), 'ст.', `${F(G['11_12'].kg)} кг`]])}
    ${chkLine(ck.out)}
    ${tabBar('day', [['mach', 'Машины'], ['type', 'Виды стирки'], ['chem', 'Химия'], ['blk', 'Бланк как в Excel']])}
    <section class="pn2" data-p="day:mach"><p class="hint">Задействовано машин: ${used} из 12. Дозаторы 1–10 и 11–12 считаются отдельно.</p>${machTable(ms, ck.overlapMachines)}</section>
    <section class="pn2" data-p="day:type">${typesTable(data)}</section>
    <section class="pn2" data-p="day:chem">${tabBar('chem', [['stor', 'Хранилище и остатки'], ['use', 'Расход по рецептам']])}
      <div data-p="chem:stor"><p class="hint">Сколько химии сейчас в каждом дозаторе и в запасе. Если в дозаторе было другое количество, нажмите «Указать реальный уровень».</p><div id="stg"></div></div>
      <div data-p="chem:use"><h3 style="margin:.5rem 0 0">Залито и израсходовано</h3><div id="cst"><p class="hint">Загрузка…</p></div>${chemBlock([m])}${chemByType([m])}</div></section>
    <section class="pn2" data-p="day:blk"><p class="hint">Вес каждой стирки по машинам: так же, как в листе дня Excel.</p><div class="blkwrap box" style="margin-top:0">${Blank.html(m)}</div></section>`;
}

// ---------- месяц ----------
function monthDays(ym, data) {
  const byDay = {}; data.forEach(l => (byDay[l.shift_date] = byDay[l.shift_date] || []).push(l));
  return Array.from({ length: lastDay(ym) }, (_, i) => { const date = ym + '-' + String(i + 1).padStart(2, '0'); return { d: i + 1, date, data: byDay[date] || [], m: byDay[date] ? Blank.build(byDay[date], refs, date) : null }; });
}

function viewMonth(ym, data, days, res) {   // res: { дата: число } — только для админов, иначе null
  const today = shiftToday(), live = days.filter(x => x.m);
  const g = key => live.reduce((a, x) => ({ n: a.n + x.m.groups[key].n, kg: a.kg + x.m.groups[key].kg }), { n: 0, kg: 0 });
  const g1 = g('1_10'), g2 = g('11_12'), n = g1.n + g2.n, kg = g1.kg + g2.kg;
  const part = k => live.reduce((a, x) => a + Object.values(x.m.machineStats).reduce((s, y) => s + y[k], 0), 0);
  const best = live.reduce((b, x) => !b || x.m.groups.all.kg > b.m.groups.all.kg ? x : b, null);
  const kpi = [['Стирок', F(n, 0), '', `день ${part('day')} · ночь ${part('night')}`], ['Белья', F(kg, 0), 'кг', live.length ? `в среднем ${F(kg / live.length, 0)} кг в смену` : 'нет данных'],
    ['Дозатор 1 · 1–10', F(g1.n, 0), 'ст.', `${F(g1.kg, 0)} кг`], ['Дозатор 2 · 11–12', F(g2.n, 0), 'ст.', `${F(g2.kg, 0)} кг`]];

  // проверки
  const out = [], rawKg = data.reduce((s, l) => s + (+l.weight_kg || 0), 0);
  const ok = n === data.length && Math.abs(kg - rawKg) < 1e-6;
  out.push({ k: ok ? 'ok' : 'bad', t: ok ? `Итоги сходятся: ${data.length} записей, ${F(rawKg)} кг` : 'Итоги по дням не совпадают с числом записей, сообщите администратору' });
  const missing = days.filter(x => !x.m && x.date < today).map(x => x.d);
  if (live.length && missing.length) out.push({ k: 'warn', t: `Дни без записей: ${missing.length}`, n: 'Числа: ' + missing.join(', ') + '. Если в эти дни стирки были, бланк не заполнили.' });
  const odd = data.filter(l => !(+l.weight_kg > 0) || +l.weight_kg > 100);
  if (odd.length) out.push({ k: 'bad', t: `Подозрительный вес: ${odd.length}`, n: odd.slice(0, 4).map(l => `${dmy(l.shift_date)}, машина ${l.machine}, ${F(l.weight_kg)} кг`).join('; ') + (odd.length > 4 ? '…' : '') });
  const unk = live.reduce((s, x) => s + x.m.total.unknownN, 0);
  if (unk) out.push({ k: 'warn', t: `Вид стирки не из шаблона: ${unk}`, n: 'Они есть в итогах, но в листы дней Excel не попадают.' });
  if (best) out.push({ k: 'ok', t: `Самая загруженная смена: ${dmy(best.date).slice(0, 5)} (${wdOf(best.date)}), ${F(best.m.groups.all.kg, 0)} кг` });

  // календарь
  const maxKg = Math.max(1, ...live.map(x => x.m.groups.all.kg));
  const lead = (new Date(ym + '-01T00:00:00Z').getUTCDay() + 6) % 7;
  const cal = `<div class="cal" role="list">${WD.map(w => `<div class="wd">${w}</div>`).join('')}${'<span class="ep"></span>'.repeat(lead)}${days.map(x => {
    if (x.m) { const a = x.m.groups['1_10'], b = x.m.groups['11_12'], k = x.m.groups.all.kg, p = Math.round(12 + k / maxKg * 55);
      return `<button class="dc${x.date === today ? ' now' : ''}" style="--p:${p}%" data-day="${x.date}" title="${dmy(x.date)}: дозатор 1 — ${a.n} ст., ${F(a.kg, 0)} кг; дозатор 2 — ${b.n} ст., ${F(b.kg, 0)} кг"><b>${x.d}</b><span>${F(k, 0)} кг</span><small>${a.n} | ${b.n}</small></button>`; }
    const fut = x.date > today, now = x.date === today;
    return `<button class="dc ${fut || now ? 'no' : 'miss'}${fut ? ' fut' : ''}${now ? ' now' : ''}" data-day="${x.date}"><b>${x.d}</b><span>–</span><small>${fut || now ? '' : 'нет записей'}</small></button>`; }).join('')}</div>
    <p class="note">В ячейке: вес за смену и стирок «дозатор 1 | дозатор 2». Чем темнее, тем больше белья. Нажмите на день, чтобы открыть его бланк.</p>`;

  // проживающие за месяц: среднее и сумма только по тем дням, где число введено
  const resVals = res ? Object.values(res).map(Number).filter(v => isFinite(v)) : [], resAvg = resVals.length ? { k: resVals.length, sum: resVals.reduce((a, b) => a + b, 0), avg: resVals.reduce((a, b) => a + b, 0) / resVals.length } : null;
  // таблица по дням: только прошедшие дни и сегодня, будущие не показываем
  const drow = x => { const m = x.m, a = m && m.groups['1_10'], b = m && m.groups['11_12'];
    const lab = `<th class="l"><a href="#" data-day="${x.date}">${dmy(x.date).slice(0, 5)}</a> <span class="dim">${wdOf(x.date)}</span></th>`;
    const rc = res ? (res[x.date] != null ? `<td class="sp hs">${res[x.date]}</td>` : '<td class="sp hs"><span class="z">·</span></td>') : '';
    if (!m) return `<tr class="go-day${x.date < today ? ' miss' : ''}" data-day="${x.date}">${lab}<td class="none" colspan="7">${x.date < today ? 'нет записей' : 'пока нет записей'}</td>${rc}</tr>`;
    const dn = Object.values(m.machineStats), d = dn.reduce((s, y) => s + y.day, 0), nt = dn.reduce((s, y) => s + y.night, 0);
    return `<tr class="go-day" data-day="${x.date}">${lab}<td class="sp">${cell(a.n, 0)}</td><td>${cell(a.kg)}</td><td class="sp">${cell(b.n, 0)}</td><td>${cell(b.kg)}</td><td class="sp"><b>${a.n + b.n}</b></td><td><b>${F(a.kg + b.kg)}</b></td><td class="sp hs">${d} / ${nt}</td>${rc}</tr>`; };
  const dayTbl = `<div class="tw scroll"><table class="t2"><thead><tr><th class="l">Смена</th><th class="sp">1–10, ст.</th><th>1–10, кг</th><th class="sp">11–12, ст.</th><th>11–12, кг</th><th class="sp">Всего, ст.</th><th>Всего, кг</th><th class="sp hs">День / ночь</th>${res ? '<th class="sp hs">Проживающих</th>' : ''}</tr></thead><tbody>
    ${days.filter(x => x.date <= today).map(drow).join('')}</tbody>
    <tfoot><tr><th class="l">Итого за месяц</th><td class="sp">${g1.n}</td><td>${F(g1.kg)}</td><td class="sp">${g2.n}</td><td>${F(g2.kg)}</td><td class="sp">${n}</td><td>${F(kg)}</td><td class="sp hs">${part('day')} / ${part('night')}</td>${res ? `<td class="sp hs">${resAvg ? F(resAvg.avg) + ' ср.' : '·'}</td>` : ''}</tr></tfoot></table></div>${res ? `<p class="note">Проживающие (видят только админы): ${resAvg ? `заполнено дней: ${resAvg.k}, в среднем ${F(resAvg.avg)} чел. в день, всего ${F(resAvg.sum)} человеко-дней.` : 'за этот месяц числа ещё не введены. Их вводят на панели смены или в бланке за смену.'}</p>` : ''}`;

  // машины за месяц
  const agg = {}; all12.forEach(i => agg[i] = { n: 0, kg: 0, day: 0, night: 0, dayKg: 0, nightKg: 0 });
  live.forEach(x => all12.forEach(i => { const s = x.m.machineStats[i]; Object.keys(agg[i]).forEach(k => { agg[i][k] += s[k]; }); }));

  return `${strip(kpi)}${chkLine(out)}
    ${tabBar('mon', [['cal', 'Календарь'], ['days', 'По дням'], ['mach', 'Машины'], ['type', 'Виды и химия']])}
    <section class="pn2" data-p="mon:cal">${cal}</section>
    <section class="pn2" data-p="mon:days">${dayTbl}</section>
    <section class="pn2" data-p="mon:mach">${machTable(agg, new Set())}</section>
    <section class="pn2" data-p="mon:type">${typesTable(data)}<div style="height:.75rem"></div><h3 style="margin:.5rem 0 0">Залито и израсходовано</h3><div id="cst"><p class="hint">Загрузка…</p></div>${chemBlock(live.map(x => x.m))}${chemByType(live.map(x => x.m))}</section>`;
}

// статистика химии: залито и израсходовано (теория), по нажатию на химикат — кто, где и во сколько
async function mountStats(d1, d2, data, my) {
  const el = $('#cst'); if (!el) return;
  try {
    const back = addDaysISO(d1, -60);
    const [ch, cn, mv, lv, sn] = await Promise.all([sb.rpc('report_changes', { d1: back, d2 }), sb.rpc('report_connects', { d1: back, d2 }),
      sb.rpc('report_moves', { d1: back, d2 }).then(r => r, () => ({ data: [] })), sb.rpc('report_levels', { d1: back, d2 }).then(r => r, () => ({ data: [] })), sb.rpc('staff_names').then(r => r, () => ({ data: [] }))]);
    if (my !== seq || !$('#cst')) return;
    if (ch.error || cn.error) throw (ch.error || cn.error);
    const nm = Object.fromEntries(((sn && sn.data) || []).map(x => [x.id, x.name]));
    const ev = { changes: ch.data || [], connects: cn.data || [], moves: (mv && mv.data) || [], levels: (lv && lv.data) || [] };
    const rep = calcReport(data, [], refs, [], null, [], []);          // для теории достаточно загрузок
    ChemStats.mount($('#cst'), { refs, rep, ev, loads: data, from: d1, to: d2, tz, st, nm, key: 'all', picker: true });
  } catch (e) { if ($('#cst')) $('#cst').innerHTML = '<p class="hint">Статистика химии недоступна: выполните stage3.sql … stage12.sql.</p>'; }
}

async function showMonth() {
  const my = ++seq; if (!ym) return;
  $('#ttl').textContent = 'Отчёт за ' + ymLabel(ym);
  $('#x').textContent = '⬇ Скачать Excel за ' + ymLabel(ym);
  $('#msg').textContent = `Смена начинается в ${String(st).padStart(2, '0')}:00 и длится сутки; ночная часть после полуночи входит в смену предыдущего дня. Машины 1–10 и 11–12 считаются отдельно.`;
  $('#out').innerHTML = '<p class="hint">Загрузка…</p>';
  try {
    const d2 = ym + '-' + String(lastDay(ym)).padStart(2, '0');
    const [data, res] = await Promise.all([loads(ym + '-01', d2), isAdm ? Residents.range(ym + '-01', d2) : null]);
    if (my !== seq) return;
    $('#out').innerHTML = viewMonth(ym, data, monthDays(ym, data), res); applyTabs();
    mountStats(ym + '-01', d2, data, my);
  } catch (e) {
    $('#out').innerHTML = '<p class="err">Не удалось загрузить данные. Проверьте, что выполнены report.sql, stage2.sql и stage5.sql.</p>';
  }
}

async function showDay() {
  const date = $('#d').value, my = ++seq;
  if (!date) return;
  $('#ttl').textContent = 'Смена ' + longDate(date);
  $('#x').textContent = '⬇ Скачать Excel за месяц';
  $('#msg').textContent = `Смена начинается в ${String(st).padStart(2, '0')}:00 и длится сутки: день ${String(st).padStart(2, '0')}:00–${String((st + 12) % 24).padStart(2, '0')}:00, ночь до ${String(st).padStart(2, '0')}:00.`;
  try {
    const data = await loads(date, date);
    if (my !== seq) return;
    $('#out').innerHTML = (isAdm ? '<div id="rsd"></div>' : '') + view(Blank.build(data, refs, date), data); applyTabs();
    mountStats(date, date, data, my);
    if (isAdm) Residents.mount($('#rsd'), date, { today: shiftToday(), toast });          // проживающие: только админы
    if ($('#stg')) StorageAnim.mount($('#stg'), { refs, date, st, tz, toast, can: true, isSuper }).catch(() => { $('#stg').innerHTML = '<p class="hint">Хранилище появится после выполнения stage10.sql.</p>'; });
  } catch (e) {
    $('#out').innerHTML = '<p class="err">Не удалось загрузить данные. Проверьте, что выполнены report.sql и stage2.sql.</p>';
  }
}

async function download() {
  const ymX = mode === 'month' ? ym : $('#d').value.slice(0, 7); if (!ymX) return;
  const b = $('#x'); b.disabled = true; $('#msg').textContent = 'Собираю файл…';
  try {
    const res = await fetch('Blanc.xlsx', { cache: 'no-store' });
    if (!res.ok) throw new Error('Файл Blanc.xlsx не найден на сайте. Положите его в корень репозитория рядом с index.html.');
    const zip = await JSZip.loadAsync(await res.arrayBuffer());
    const d2 = ymX + '-' + String(lastDay(ymX)).padStart(2, '0');
    const data = await loads(ymX + '-01', d2);
    const back = addDaysISO(ymX + '-01', -60);                                              // запас назад: подключение могло быть в прошлом месяце
    const { data: chAll, error: chErr } = await sb.rpc('report_changes', { d1: back, d2 });
    if (chErr) throw chErr;
    const { data: cnAll } = await sb.rpc('report_connects', { d1: back, d2 });              // нужен stage6.sql
    const { data: lvAll } = await sb.rpc('report_levels', { d1: back, d2 });                // нужен stage12.sql (если его нет — просто пусто)
    const changes = (chAll || []).filter(x => x.shift_date >= ymX + '-01'), connects = (cnAll || []).filter(x => x.shift_date >= ymX + '-01');
    const used = chemUsed(refs, chAll || [], cnAll || [], null, lvAll || []).used;
    const byDay = {};
    data.forEach(l => (byDay[l.shift_date] = byDay[l.shift_date] || []).push(l));
    const days = {}, warn = new Set();
    Object.keys(byDay).forEach(d => { const mm = Blank.build(byDay[d], refs, d); days[+d.slice(8)] = mm; Blank.warnings(mm).forEach(w => warn.add(w)); });
    await Blank.fillWorkbook(zip, days, refs, changes, connects, used);
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Blanc-' + ymX + '.xlsx';
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
    $('#msg').textContent = 'Файл готов: ' + a.download + (warn.size ? '. Есть замечания, они показаны ниже.' : '');
    toast('Файл скачан');
    document.querySelectorAll('.xw').forEach(n => n.remove());
    $('#msg').insertAdjacentHTML('afterend', [...warn].map(w => `<p class="err xw">${E(w)}</p>`).join(''));
  } catch (e) { $('#msg').textContent = ''; $('#msg').insertAdjacentHTML('afterend', `<p class="err xw">${E(e.message || e)}</p>`); }
  b.disabled = false;
}

// ---------- переключатели ----------
const mark = () => { const d = $('#d').value, t = shiftToday(), y = addDays(t, -1);
  [['t', d === t], ['y', d === y]].forEach(([id, on]) => { $('#' + id).classList.toggle('on', on); $('#' + id).setAttribute('aria-pressed', on); });
  const cm = shiftToday().slice(0, 7);
  [['mt', ym === cm], ['mp', ym === addMonth(cm, -1)]].forEach(([id, on]) => { $('#' + id).classList.toggle('on', on); $('#' + id).setAttribute('aria-pressed', on); }); };
const go = d => { $('#d').value = d; mark(); showDay(); };
const goMonth = v => { ym = v; $('#mm').value = v.slice(5, 7); $('#yy').value = v.slice(0, 4); mark(); showMonth(); };
const setMode = v => {
  mode = v; $('#dayc').hidden = v !== 'day'; $('#monc').hidden = v !== 'month';
  $('#md').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.v === v); b.setAttribute('aria-pressed', b.dataset.v === v); });
  $('#eb').textContent = v === 'month' ? 'Месяц' : 'Смена';
  document.querySelectorAll('.xw').forEach(n => n.remove());
  if (v === 'month') goMonth(ym || ($('#d').value || shiftToday()).slice(0, 7)); else go($('#d').value || shiftToday());
};
$('#md').onclick = e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.v); };
$('#d').onchange = () => { mark(); showDay(); };
$('#t').onclick = () => go(shiftToday());
$('#y').onclick = () => go(addDays(shiftToday(), -1));
$('#pv').onclick = () => $('#d').value && go(addDays($('#d').value, -1));
$('#nx').onclick = () => $('#d').value && go(addDays($('#d').value, 1));
$('#mm').onchange = $('#yy').onchange = () => goMonth($('#yy').value + '-' + $('#mm').value);
$('#mt').onclick = () => goMonth(shiftToday().slice(0, 7));
$('#mp').onclick = () => goMonth(addMonth(shiftToday().slice(0, 7), -1));
$('#mpv').onclick = () => ym && goMonth(addMonth(ym, -1));
$('#mnx').onclick = () => ym && goMonth(addMonth(ym, 1));
$('#x').onclick = download;
// нажатие на день в календаре или таблице открывает бланк этой смены
$('#out').onclick = e => { const t = e.target.closest('[data-tab]'); if (t) { setTab(t.closest('[data-tabs]').dataset.tabs, t.dataset.tab); return; } const b = e.target.closest('[data-day]'); if (!b || b.disabled) return; e.preventDefault(); mode = 'day'; $('#d').value = b.dataset.day; setMode('day'); window.scrollTo({ top: 0 }); };

(async () => {
  if (!await need()) return;
  const { data: ok } = await sb.rpc('can_report');
  if (!ok) { $('#out').innerHTML = '<p class="hint">Нет доступа. Обратитесь к администратору.</p>'; return; }
  isAdm = await Residents.isAdmin();                                                      // проживающих показываем только админам (проверяет база)
  { const ses = (await sb.auth.getSession()).data.session; const { data: pr } = await sb.from('profiles').select('role').eq('id', ses.user.id).maybeSingle(); isSuper = pr?.role === 'superadmin'; }
  const [s, c, w, r] = await Promise.all([
    sb.from('settings').select('*'), sb.from('chemicals').select('*').order('sort'),
    sb.from('wash_types').select('*').order('sort'), sb.from('recipes').select('*')
  ]);
  const g = k => { const x = (s.data || []).find(y => y.key === k); return x ? +x.value : null; };
  tz = g('tz_offset') ?? 5; st = g('shift_start') ?? 6;
  refs = { water: g('water_l') ?? 55, washTypes: w.data || [], chemicals: c.data || [], recipes: r.data || [] };
  const cy = +shiftToday().slice(0, 4);
  $('#mm').innerHTML = MONN.map((n, i) => `<option value="${String(i + 1).padStart(2, '0')}">${n[0].toUpperCase() + n.slice(1)}</option>`).join('');
  $('#yy').innerHTML = [cy - 3, cy - 2, cy - 1, cy, cy + 1].map(y => `<option value="${y}">${y}</option>`).join('');
  const qm = q.get('m');                                           // blank.html?m=2026-10 открывает месяц сразу
  if (/^\d{4}-(0[1-9]|1[0-2])$/.test(qm || '')) { ym = qm; setMode('month'); } else go(shiftToday());
})();
</script></body></html>
