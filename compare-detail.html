<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2aa3b5">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="compare-detail.css"><style>
.tot{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.6rem 0}@media(min-width:720px){.tot{grid-template-columns:repeat(4,1fr)}}
.tot div{padding:.65rem .8rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.tot span{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--mut)}.tot b{font-family:Sora,sans-serif;font-size:1.1rem}
.tot .bad{border-color:#f3b8b1;background:#fdecea}.tot .low{border-color:#b9d7f0;background:#eaf3fc}.tot .ck,.tot .wn{border-color:#f1d58a;background:#fff6e0}
.tw{overflow-x:auto;margin:.5rem 0;border:1px solid var(--ln);border-radius:var(--r);background:var(--card)}
.tw table{width:100%;border-collapse:collapse;font-size:.88rem}.tw th,.tw td{padding:.5rem .65rem;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
.tw th:first-child,.tw td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}.tw th{font-size:.68rem;text-transform:uppercase;color:var(--mut)}
.tw tr.tt td{font-weight:800;background:var(--soft)}.tw tr.tt td:first-child{background:var(--soft)}
td.bad{color:#b42318;font-weight:700}td.low{color:#175cd3;font-weight:700}td.ck{color:#8a5a00;font-weight:700}
.st{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.7rem;font-weight:800;background:var(--tint);color:var(--mut)}
.st.ok{background:#e7f6ef;color:#14532d}.st.over{background:#fdecea;color:#7a1a12}.st.under{background:#eaf3fc;color:#0b3f8a}.st.ck{background:#fff6e0;color:#6b4a00}.st.nd{background:#eef2f3;color:#4f6f79}
.msg{margin:.6rem 0;padding:.7rem .9rem;border-radius:var(--r);font-size:.88rem}.msg.wr{background:#fff6e0;color:#6b4a00;border:1px solid #f1d58a}.msg.er{background:#fdecea;color:#7a1a12;border:1px solid #f3b8b1}
.msg ul{margin:.3rem 0 0;padding-left:1.1rem}.msg summary{cursor:pointer;font-weight:700}
.pick{display:grid;grid-template-columns:1fr;gap:.5rem;margin:.6rem 0}@media(min-width:720px){.pick.c{grid-template-columns:1fr 1fr auto;align-items:end}}
.pick label{margin-top:0}.pick .go{min-height:2.75rem}
</style></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Сравнение химии — подробно</span></a><nav class="nav"><a class="btn s" id="tobrief" href="compare.html">Кратко</a><a class="btn s" href="closings-report.html">Закрытия</a><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem"><h1>Сравнение химии — подробно</h1><div class="acts"><button class="btn" id="xl" type="button" hidden>Скачать Excel</button></div></div>
<div class="seg" id="mode" role="group" aria-label="Период"><button data-m="last" class="on">Последнее закрытие</button><button data-m="month">Месяц</button><button data-m="custom">Свой период</button></div>
<div id="pick"></div>
<div class="seg" id="grp" role="group" aria-label="Дозатор"><button data-g="all" class="on">Оба</button><button data-g="1_10">Дозатор 1</button><button data-g="11_12">Дозатор 2</button></div>
<div id="out"><p class="hint">Загрузка…</p></div>
</main>
<script src="lite.js"></script>
<script src="kiosk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="num.js"></script><script src="app.js"></script><script src="report-calc.js"></script><script src="compare-calc.js"></script><script src="compare-view.js"></script><script src="xlsx-writer.js"></script><script src="compare-detail.js"></script><script src="compare-xlsx.js"></script><script src="compare-data.js"></script>
<script>
// Сравнение химии — подробно (этап 3). Только для админов и суперадмина: доступ проверяет CompareData.init (is_admin / роль superadmin).
// Те же данные и тот же расчёт, что в кратком виде (compare.html), поэтому итоги совпадают. Здесь: светофор, итоги, карточка по каждому химикату
// (баланс, теория, расход на кг/стирку/жителя, эталон, график по закрытиям, хронология) и «Скачать Excel» (7 листов).
let env=null,mode='last',group='all',month=null,customFrom=null,customTo=null,res=null,inp=null,ctx=null,seq=0;
const V=CompareView,D=CompareDetail,out=()=>document.getElementById('out'),$id=i=>document.getElementById(i);
const qget=k=>{const m=new RegExp('[?&]'+k+'=([^&]*)').exec(typeof location!=='undefined'?location.search:'');return m?decodeURIComponent(m[1]):null;};

function range(){return CompareData.rangeOf(env,mode,month,customFrom,customTo);}
function briefLink(){const a=$id('tobrief');if(a)a.href='compare.html';}

async function compute(){
  const my=++seq,r=range();res=null;ctx=null;$id('xl').hidden=true;
  if(!r){out().innerHTML=mode==='last'?'<div class="msg wr">Нужно хотя бы два закрытия (начальный замер и ещё одно). Выберите «Месяц» или «Свой период».</div>':'<p class="hint">Выберите период и нажмите «Показать».</p>';return;}
  if(!(new Date(r.toTs)>new Date(r.fromTs))){out().innerHTML='<div class="msg er">Конец периода должен быть позже начала.</div>';return;}
  out().innerHTML='<p class="hint">Считаю…</p>';
  try{
    const x=await CompareData.compute(sb,env,r);
    if(my!==seq)return;
    res=x.res;inp=x.inp;
    ctx=await CompareData.makeCtx(sb,env,res,inp,mode,false);                                     // сначала без месяца: экран появляется быстро
    if(my!==seq)return;
    draw();
    CompareData.makeCtx(sb,env,res,inp,mode,true).then(c=>{if(my!==seq)return;ctx=c;fillCharts();}).catch(()=>{});   // график за месяц дорисовывается позже
  }catch(e){if(my===seq)out().innerHTML=`<div class="msg er">Не удалось посчитать: ${V.esc(e.message)}</div>`;}
}

function chemIds(){const ids=[];(res.rows||[]).filter(r=>group==='all'||r.group===group).forEach(r=>{if(!ids.includes(r.chemical_id))ids.push(r.chemical_id);});return ids;}
function draw(){
  if(!res)return;
  const tr=D.trust(res,{isAdmin:true,tz:env.tz});
  const cards=chemIds().map(id=>{
    const row=res.rows.find(r=>+r.chemical_id===+id),it=tr.chems.find(c=>+c.chemical_id===+id);
    return `<details class="chem" open><summary>${it?`<span class="dot ${({green:'g',yellow:'y',red:'r'})[it.level]}" aria-hidden="true"></span> `:''}${V.esc(row.name)}</summary>${D.cardHTML(res,inp,ctx,id,group,{isAdmin:true})}</details>`;
  }).join('');
  out().innerHTML=`<h2>Итоги</h2>`+V.screenHTML(res,group,env.tz,{before:D.trustHTML(res,group,{isAdmin:true,tz:env.tz})})+`<h2>По химикатам</h2>`+(cards||'<p class="hint">Нет химикатов для сравнения.</p>');
  $id('xl').hidden=false;
}
function fillCharts(){
  (out().querySelectorAll?out().querySelectorAll('.chartbox'):[]).forEach(b=>{
    const p=String(b.dataset.chart||'').split('|'),row=res.rows.find(r=>+r.chemical_id===+p[0]&&r.group===p[1]);
    if(row)b.innerHTML=D.chartBlock(res,ctx,row);
  });
}

out().onclick=e=>{D.onClick(e,()=>({res,inp,ctx}));};
$id('xl').onclick=()=>{
  if(!res)return;
  try{CompareXlsx.download(res,inp,ctx,{view:'full',isAdmin:true});}
  catch(err){out().insertAdjacentHTML('afterbegin',`<div class="msg er">Не удалось сформировать Excel: ${V.esc(err.message)}</div>`);}
};

function setOn(sel,attr,val){document.querySelectorAll(sel).forEach(x=>x.classList.toggle('on',x.dataset[attr]===val));}
function drawPick(){
  const p=$id('pick');
  if(mode==='last'){const r=V.lastClosingRange(env.closings);p.innerHTML=r?`<p class="hint">От предыдущего замера до последнего закрытия.</p>`:'';return;}
  if(mode==='month'){p.innerHTML=`<div class="pick"><label>Месяц<select id="mn">${V.monthOptions(Date.now(),env.tz,env.st).map(o=>`<option value="${o.key}"${o.key===month?' selected':''}>${o.label}</option>`).join('')}</select></label></div>`;$id('mn').onchange=e=>{month=e.target.value;compute();};return;}
  p.innerHTML=`<div class="pick c"><label>С<input type="datetime-local" id="cf" value="${customFrom?V.toLocalInput(customFrom,env.tz):''}"></label><label>По<input type="datetime-local" id="ct" value="${customTo?V.toLocalInput(customTo,env.tz):''}"></label><button class="go" id="cg">Показать</button></div><p class="hint">Время местное. Факт будет посчитан только между закрытиями внутри периода.</p>`;
  $id('cg').onclick=()=>{customFrom=V.fromLocalInput($id('cf').value,env.tz);customTo=V.fromLocalInput($id('ct').value,env.tz);compute();};
}

(async()=>{
  const ses=await need();if(!ses)return;
  env=await CompareData.init(sb,ses);
  if(!env.ok){out().innerHTML='<p>Сравнение химии доступно админам и суперадмину.</p>';return;}
  if(env.error){out().innerHTML=`<div class="msg er">${V.esc(env.error)}</div>`;return;}
  month=V.monthKeyOf(Date.now(),env.tz,env.st);
  const def=V.lastClosingRange(env.closings)||{fromTs:new Date(Date.now()-7*864e5).toISOString(),toTs:new Date().toISOString()};customFrom=def.fromTs;customTo=def.toTs;
  // параметры из ссылки краткого вида: ?m=last|month|custom&g=all|1_10|11_12&month=YYYY-MM&from=…&to=…
  const m=qget('m'),g=qget('g');
  if(m==='month'||m==='custom'||m==='last')mode=m;
  if(g==='1_10'||g==='11_12'||g==='all')group=g;
  if(mode==='month'&&/^\d{4}-\d{2}$/.test(qget('month')||''))month=qget('month');
  if(mode==='custom'&&qget('from')&&qget('to')){customFrom=qget('from');customTo=qget('to');}
  setOn('#mode button','m',mode);setOn('#grp button','g',group);
  $id('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;setOn('#mode button','m',mode);drawPick();compute();};
  $id('grp').onclick=e=>{const b=e.target.closest('button');if(!b)return;group=b.dataset.g;setOn('#grp button','g',group);draw();fillCharts();};
  drawPick();await compute();
})();
</script>
<script src="compat.js"></script>
<script src="idle.js"></script>
<script src="pwa.js"></script>
</body></html>
