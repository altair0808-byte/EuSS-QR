<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Настройки — EuSS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2aa3b5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EuSS">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Администрирование</span></a><nav class="nav"><a class="btn s" href="admin.html">Пользователи</a><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top"><h1>Настройки</h1></div>

<h2 style="margin-top:.25rem">Общие</h2>
<div class="box" id="gen">
  <label>Вода на загрузку, л<input type="number" step="1" data-k="water_l"></label>
  <label>Часовой пояс, часы от UTC<input type="number" step="1" data-k="tz_offset"></label>
  <label>Начало смены, час<input type="number" min="0" max="23" step="1" data-k="shift_start"></label>
  <label>Закрытие: предупреждать, если расход больше теории на, %<input type="number" min="0" step="any" inputmode="decimal" data-k="close_warn_pct"></label>
  <button class="go" id="sg">Сохранить</button>
</div>

<h2>Химия</h2>
<div class="box" id="chem"></div>
<details class="box" id="nc"><summary><b>+ Новый химикат</b></summary>
  <label>Название<input id="cn" autocomplete="off"></label>
  <label>Ссылка на фото<input id="cim" type="url" inputmode="url" autocomplete="off" placeholder="https://…"></label>
  <label>Тип<select id="ck"><option value="main">Основная (дозатор, по рецептам)</option><option value="extra">Дополнительная (вручную на машину)</option></select></label>
  <div class="acc"><label>1 шт = литров<input id="cl2" type="number" min="0" step="any" inputmode="decimal"></label><label>1 шт = кг<input id="ckg" type="number" min="0" step="any" inputmode="decimal"></label></div>
  <div class="acc" id="cex" hidden><label>Расход на единицу<input id="cu" type="number" min="0" step="1" inputmode="numeric"></label><label>Измеряется в<select id="cun"><option value="ml">мл</option><option value="g">г</option></select></label></div>
  <button class="go" id="ca">Добавить химикат</button></details>

<h2>Виды стирки и рецепты</h2>
<div id="wt"></div>
<div class="box">
  <h2>Новый вид стирки</h2>
  <label>Название<input id="wn"></label>
  <div class="acc"><label>Заполнение, мин<input id="wf" type="number" min="0" inputmode="numeric" value="0"></label>
  <label>Стирка, мин<input id="wm" type="number" min="0" inputmode="numeric"></label>
  <label>Сушка, мин<input id="wd" type="number" min="0" inputmode="numeric" value="0"></label></div>
  <button class="go" id="wa">Добавить</button>
</div>

<h2>Бланки</h2>
<div id="fm"></div>
<div class="box">
  <h2>Новый бланк</h2>
  <label>Название<input id="fn"></label>
  <label>Адрес (латиница, например laundry-load-2)<input id="fs" autocapitalize="off"></label>
  <label>Тип<select id="ft"><option value="laundry_load">Загрузка белья</option><option value="laundry_chem">Замена химии</option></select></label>
  <button class="go" id="fa">Добавить</button>
</div>
</main>
<script src="wm.js"></script>
<script src="lite.js"></script>
<script src="kiosk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => v === '' ? null : +v;
const done = e => { toast(e ? 'Не сохранено: ' + e.message : 'Сохранено'); return !e; };
let chems = [], wts = [], rec = [];
const hue = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const safeUrl = u => /^https?:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim().replace(/^http:\/\//i, 'https://') : '';
const chemImg = x => `<span class="ci sm" style="--h:${hue(x.name)}"><span class="lt"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h5v3h-5z"/><path d="M8.5 5.5h7l2 3.2v10.8a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V8.7z"/><rect x="8.5" y="12" width="7" height="5" rx="1"/></svg></span>${safeUrl(x.image_url) ? `<img src="${esc(safeUrl(x.image_url))}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</span>`;
const imgFallback = root => root.querySelectorAll('.ci img').forEach(i => { i.onerror = () => i.remove(); });

async function load() {
  const [{ data: st }, { data: ch }, { data: w }, { data: rc }, { data: fm }] = await Promise.all([
    sb.from('settings').select('*'),
    sb.from('chemicals').select('*').order('sort'),
    sb.from('wash_types').select('*').order('sort'),
    sb.from('recipes').select('*'),
    sb.from('forms').select('*').order('sort_order')
  ]);
  chems = ch || []; wts = w || []; rec = rc || [];
  document.querySelectorAll('#gen [data-k]').forEach(i => { const r = (st || []).find(x => x.key === i.dataset.k); i.value = r ? r.value : ''; });

  const nv = v => v ?? '';
  $('#chem').innerHTML = '<p class="hint">1 штука (бутыль, пачка) = столько литров = столько кг. Остаток бригадир вводит в кг, система сама переведёт в литры.</p>' + chems.map(c =>
    `<div class="cb" data-c="${c.id}"><b class="chrow">${chemImg(c)}${esc(c.name)} <small>${c.kind === 'extra' ? 'дополнительная' : 'основная'}</small></b>
      <label>Название<input data-f="name" value="${esc(c.name)}" autocomplete="off"></label>
      <label>Ссылка на фото<input type="url" inputmode="url" data-f="image_url" placeholder="https://…" value="${esc(c.image_url)}" autocomplete="off"></label>
      <div class="acc"><label>1 шт = литров<input type="number" min="0" step="any" inputmode="decimal" data-f="bottle_l" value="${nv(c.bottle_l)}"></label>
      <label>1 шт = кг<input type="number" min="0" step="any" inputmode="decimal" data-f="bottle_kg" value="${nv(c.bottle_kg)}"></label></div>
      ${c.kind === 'extra' ? `<div class="acc"><label>Расход на единицу<input type="number" min="0" step="1" inputmode="numeric" data-f="per_unit" value="${nv(c.per_unit)}"></label>
      <label>Расход измеряется в<select data-f="per_unit_unit"><option value="ml"${c.per_unit_unit === 'g' ? '' : ' selected'}>мл</option><option value="g"${c.per_unit_unit === 'g' ? ' selected' : ''}>г</option></select></label></div>
      <label class="chk" style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" data-f="in_closing"${c.in_closing ? ' checked' : ''} style="width:auto"> Ведётся на дозаторе (закрывать по замеру остатков)</label>` : ''}
    </div>`).join('') + '<button class="go" id="sc">Сохранить</button>';
  imgFallback($('#chem'));

  const mains = chems.filter(c => c.kind === 'main');
  $('#wt').innerHTML = wts.map(x => `<details class="box" data-w="${x.id}"><summary><span class="wk" style="--k:${esc(wkind(x).color)}">${esc(wkind(x).icon)}</span><b>${esc(x.name)}</b> <small>${x.minutes ?? '–'} мин${x.hidden ? ' · скрыт' : ''}</small></summary>
    <label>Название<input data-wf="name" value="${esc(x.name)}"></label>
    ${'color' in x ? `<h3>Цвет и значок режима</h3>
    <div class="acc"><label>Цвет<input type="color" data-wf="color" value="${esc(wkind(x).color)}" style="height:2.6rem;padding:.15rem"></label>
    <label>Значок (один эмодзи)<input data-wf="icon" maxlength="4" value="${esc(wkind(x).icon)}" autocomplete="off"></label></div>
    <p class="hint">Цвет и значок видны в списке, на плитке машины и в окне, чтобы режимы не путались.</p>` : '<p class="hint">Чтобы задать цвет и значок, выполните stage25.sql.</p>'}
    <h3>Этапы, минут</h3>
    <div class="acc"><label>Заполнение<input data-wf="fill_min" type="number" min="0" inputmode="numeric" value="${x.fill_min ?? 0}"></label>
    <label>Стирка<input data-wf="wash_min" type="number" min="0" inputmode="numeric" value="${x.wash_min ?? x.minutes ?? 0}"></label>
    <label>Сушка<input data-wf="dry_min" type="number" min="0" inputmode="numeric" value="${x.dry_min ?? 0}"></label></div>
    <p class="hint">Всего: <b data-tot>${(+(x.fill_min ?? 0)) + (+(x.wash_min ?? x.minutes ?? 0)) + (+(x.dry_min ?? 0))}</b> мин (сумма этапов; по ней считается «осталось» и бланк)</p>
    <h3>Химия, мл на литр воды</h3>
    ${mains.map(c => { const r = rec.find(y => y.wash_type_id === x.id && y.chemical_id === c.id);
      return `<label>${esc(c.name)}<input type="number" min="0" step="any" data-r="${c.id}" value="${r ? r.ml_per_l : 0}"></label>`; }).join('')}
    <button class="go" data-act="sw">Сохранить</button>
    <button class="mini" data-act="hid">${x.hidden ? 'Показать в выборе стирки' : 'Скрыть из выбора стирки'}</button>
    <p class="hint">${x.hidden ? 'Сейчас скрыт: сотрудники его не выбирают, старые записи и отчёты его по-прежнему показывают.' : 'Скрытый вид не пропадает из старых записей и отчётов, только убирается из выбора при загрузке.'}</p></details>`).join('');

  $('#fm').innerHTML = (fm || []).map(x => `<div class="box" data-fid="${x.id}"><b>${esc(x.name)}</b> <small>${esc(x.slug)}${x.archived ? ' · в архиве' : ''}</small>
    <div class="row"><button class="mini" data-act="fr">Переименовать</button><button class="mini" data-act="fz">${x.archived ? 'Вернуть' : 'В архив'}</button></div></div>`).join('');
}

$('#sg').onclick = async () => {
  const rows = [...document.querySelectorAll('#gen [data-k]')].filter(i => i.value !== '').map(i => ({ key: i.dataset.k, value: +i.value }));
  done((await sb.from('settings').upsert(rows)).error);
};

$('#chem').onclick = async e => {
  if (e.target.id !== 'sc') return;
  let err = null;
  for (const d of document.querySelectorAll('#chem [data-c]')) {
    const row = {};
    d.querySelectorAll('[data-f]').forEach(i => {
      const k = i.dataset.f;
      row[k] = k === 'in_closing' ? i.checked : k === 'per_unit_unit' ? i.value : k === 'name' ? i.value.trim() : k === 'image_url' ? (i.value.trim() || null) : num(i.value);
    });
    if (!row.name) { toast('У химиката должно быть название'); return; }
    if (row.image_url && !safeUrl(row.image_url)) { toast('Ссылка на фото должна начинаться с http:// или https:// (' + row.name + ')'); return; }
    const { error } = await sb.from('chemicals').update(row).eq('id', d.dataset.c);
    err = err || error;
  }
  done(err);
};

const wkind = x => WM.kind(x);
const stageMin = d => ['fill_min', 'wash_min', 'dry_min'].map(k => Math.max(0, Math.round(+d.querySelector(`[data-wf="${k}"]`).value || 0)));
$('#wt').oninput = e => {
  if (!e.target.matches('[data-wf="fill_min"],[data-wf="wash_min"],[data-wf="dry_min"]')) return;
  const d = e.target.closest('[data-w]'); d.querySelector('[data-tot]').textContent = stageMin(d).reduce((a, b) => a + b, 0);
};
$('#wt').onclick = async e => {
  const hb = e.target.closest('[data-act="hid"]');
  if (hb) {
    const hid = +hb.closest('[data-w]').dataset.w, wt0 = wts.find(x => x.id === hid);
    if (done((await sb.from('wash_types').update({ hidden: !wt0.hidden }).eq('id', hid)).error)) load();
    return;
  }
  const b = e.target.closest('[data-act="sw"]'); if (!b) return;
  const d = b.closest('[data-w]'), id = +d.dataset.w;
  const name = d.querySelector('[data-wf="name"]').value.trim();
  if (!name) { toast('Укажите название'); return; }
  const [fill_min, wash_min, dry_min] = stageMin(d);
  if (fill_min + wash_min + dry_min <= 0) { toast('Укажите минуты хотя бы для одного этапа'); return; }
  const row = { name, fill_min, wash_min, dry_min, minutes: fill_min + wash_min + dry_min };
  const ci = d.querySelector('[data-wf="color"]'), ii = d.querySelector('[data-wf="icon"]');
  if (ci) { row.color = ci.value; row.icon = ii.value.trim() || null; }
  let { error } = await sb.from('wash_types').update(row).eq('id', id);
  if (!error) ({ error } = await sb.from('recipes').upsert([...d.querySelectorAll('[data-r]')].map(i => ({ wash_type_id: id, chemical_id: +i.dataset.r, ml_per_l: +i.value || 0 }))));
  if (done(error)) load();
};

$('#ck').onchange = () => $('#cex').hidden = $('#ck').value !== 'extra';
$('#ca').onclick = async () => {
  const name = $('#cn').value.trim(); if (!name) { toast('Укажите название'); return; }
  if (chems.some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('Такой химикат уже есть'); return; }
  const url = $('#cim').value.trim();
  if (url && !safeUrl(url)) { toast('Ссылка на фото должна начинаться с http:// или https://'); return; }
  const kind = $('#ck').value, row = { name, kind, image_url: url || null, bottle_l: num($('#cl2').value), bottle_kg: num($('#ckg').value), sort: Math.max(0, ...chems.map(x => x.sort || 0)) + 1 };
  if (kind === 'extra') { row.per_unit = num($('#cu').value); row.per_unit_unit = $('#cun').value; }
  const { data, error } = await sb.from('chemicals').insert(row).select('id').single();
  if (error) { done(error); return; }
  if (kind === 'main' && wts.length) await sb.from('recipes').insert(wts.map(w => ({ wash_type_id: w.id, chemical_id: data.id, ml_per_l: 0 })));
  ['cn', 'cim', 'cl2', 'ckg', 'cu'].forEach(i => $('#' + i).value = ''); toast('Химикат добавлен' + (kind === 'main' ? ', задайте рецепты' : '')); load();
};

$('#wa').onclick = async () => {
  const name = $('#wn').value.trim(); if (!name) { toast('Укажите название'); return; }
  const fm = Math.max(0, Math.round(+$('#wf').value || 0)), wm = Math.max(0, Math.round(+$('#wm').value || 0)), dm = Math.max(0, Math.round(+$('#wd').value || 0));
  if (fm + wm + dm <= 0) { toast('Укажите минуты хотя бы для одного этапа'); return; }
  const { data, error } = await sb.from('wash_types').insert({ name, fill_min: fm, wash_min: wm, dry_min: dm, minutes: fm + wm + dm, sort: Math.max(0, ...wts.map(x => x.sort || 0)) + 1 }).select('id').single();
  if (error) { done(error); return; }
  await sb.from('recipes').insert(chems.filter(c => c.kind === 'main').map(c => ({ wash_type_id: data.id, chemical_id: c.id, ml_per_l: 0 })));
  $('#wn').value = $('#wm').value = ''; $('#wf').value = $('#wd').value = 0; toast('Добавлено, задайте рецепт'); load();
};

$('#fm').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.closest('[data-fid]').dataset.fid;
  if (b.dataset.act === 'fr') {
    const name = prompt('Новое название'); if (!name || !name.trim()) return;
    if (done((await sb.from('forms').update({ name: name.trim() }).eq('id', id)).error)) load();
  } else if (b.dataset.act === 'fz') {
    const { data: f } = await sb.from('forms').select('archived').eq('id', id).single();
    if (done((await sb.from('forms').update({ archived: !f.archived }).eq('id', id)).error)) load();
  }
};

$('#fa').onclick = async () => {
  const name = $('#fn').value.trim(), slug = $('#fs').value.trim().toLowerCase();
  if (!name || !/^[a-z0-9-]+$/.test(slug)) { toast('Нужны название и адрес из латиницы, цифр и дефиса'); return; }
  const { error } = await sb.from('forms').insert({ name, slug, type: $('#ft').value });
  if (done(error)) { $('#fn').value = $('#fs').value = ''; load(); }
};

(async () => {
  const s = await need(); if (!s) return;
  const { data: pr } = await sb.from('profiles').select('role').eq('id', s.user.id).maybeSingle();
  if (!pr || pr.role !== 'superadmin') { location.replace('index.html'); return; }
  load();
})();
</script><script src="compat.js"></script>
<script src="idle.js"></script>
<script src="pwa.js"></script>
</body></html>
