<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2aa3b5">
<title>Закрытие периода — EuSS</title><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"><style>
.kd{display:grid;gap:.5rem;margin:.6rem 0}@media(min-width:640px){.kd{grid-template-columns:1fr 1fr}}
.kd button{min-height:3.2rem;padding:.6rem .8rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);font:inherit;font-weight:700;text-align:left;cursor:pointer}
.kd button small{display:block;font-weight:500;color:var(--mut);font-size:.78rem}
.kd button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.kd button:disabled{opacity:.45;cursor:not-allowed}
.ms{display:grid;gap:.6rem}@media(min-width:900px){.ms{grid-template-columns:1fr 1fr}}
.mc2{padding:.75rem .9rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.mc2 h3{margin:0 0 .4rem;font-size:1rem}.mc2 h3 small{font-weight:500;color:var(--mut)}
.mc2 .acc label small{display:block;font-weight:500;color:var(--mut);font-size:.72rem;margin-top:.15rem}
.msg{margin:.6rem 0;padding:.7rem .9rem;border-radius:var(--r);font-size:.88rem}
.msg ul{margin:.3rem 0 0;padding-left:1.1rem}.msg b{display:block}
.msg.er{background:#fdecea;color:#7a1a12;border:1px solid #f3b8b1}.msg.wr{background:#fff6e0;color:#6b4a00;border:1px solid #f1d58a}
.msg.ok{background:#e7f6ef;color:#14532d;border:1px solid #a7dcc0}
.tot{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.6rem 0}@media(min-width:720px){.tot{grid-template-columns:repeat(4,1fr)}}
.tot div{padding:.65rem .8rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.tot span{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--mut)}.tot b{font-family:Sora,sans-serif;font-size:1.1rem}
.pr{margin:.6rem 0;padding:.75rem .9rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.pr h3{margin:0;font-size:1rem}.pr .sm{font-size:.78rem;color:var(--mut)}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem .8rem;margin-top:.5rem}@media(min-width:720px){.pg{grid-template-columns:repeat(4,1fr)}}
.pg div span{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--mut)}.pg div b{font-size:.92rem}
.pr details{margin-top:.5rem}.pr summary{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--mut)}
.bad{color:#b42318}.good{color:oklch(.5 .12 160)}
.cf{display:flex;gap:.5rem;align-items:flex-start;margin:.6rem 0;font-size:.9rem}.cf input{width:1.2rem;height:1.2rem;margin-top:.1rem}
.fbar{position:sticky;bottom:0;padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg,#fff) 70%,transparent)}
</style></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Закрытие</span></a><nav class="nav"><a class="btn s" href="closings-report.html">Закрытия</a><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top"><h1>Закрытие периода по замерам</h1></div>
<div id="out"><p class="hint">Загрузка…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="num.js"></script><script src="app.js"></script><script src="report-calc.js"></script>
<script>
// Этап 2: экран «Закрытие». Ввод остатков в кг по химикатам и дозаторам, предпросмотр, закрытие паролем.
// Расчёт — calcClosing (report-calc.js), запись — closing_create (stage15.sql). Права и пароль проверяет база.
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(n,m)=>Num.fmt(n,m);
const dmy=d=>String(d).split('-').reverse().join('.');
const GL={'1_10':'Дозатор 1 · машины 1–10','11_12':'Дозатор 2 · машины 11–12'};
let refs=null,tz=5,st=6,warnPct=25,isSuper=false,today=null,last=null,lastMeas={},chems=[],kind=null,res=null,seq=0;

const page=async(fn,args)=>{const {data,error}=await sb.rpc(fn,args);if(error)throw new Error(fn+': '+error.message);return data||[];};
const sign=n=>n>0?'+':'';
const cls=p=>p==null?'':p>warnPct?'bad':p<-warnPct?'good':'';

function kindAllowed(k,date,late){
  if(!last) return k==='start';
  if(k==='start') return false;
  if(!date||date<=last.boundary_date) return false;
  const d1=date.slice(8)==='01';
  if(k==='month') return d1||late;
  return !d1;
}
function draw(){
  const date=$('#bd')?$('#bd').value:today, late=$('#late')?$('#late').checked:false;
  const ks=last?[['month','Закрыть месяц','1 числа в 06:00. Замер станет начальным остатком нового месяца'],['interval','Закрыть отчёт за прошедшие смены','Любой день в 06:00, кроме 1 числа. Все смены с прошлого замера']]:[['start','Начальный замер','Первая точка отсчёта. Расчёта нет, дальше закрываются периоды']];
  if(!kindAllowed(kind,date,late)) kind=ks.map(x=>x[0]).find(k=>kindAllowed(k,date,late))||null;
  $('#kd').innerHTML=ks.map(([k,t,s])=>`<button type="button" data-k="${k}" class="${kind===k?'on':''}" ${kindAllowed(k,date,late)?'':'disabled'}>${t}<small>${s}</small></button>`).join('');
  const per=last&&date>last.boundary_date?`Период: смены ${dmy(last.boundary_date)} – ${dmy(addDaysISO(date,-1))} (замер ${dmy(last.boundary_date)} 06:00 → замер ${dmy(date)} 06:00)`:'';
  let why='';
  if(last&&date<=last.boundary_date) why=`Замер должен быть позже предыдущего (${dmy(last.boundary_date)}).`;
  else if(last&&!kind) why='Для этой даты нельзя выбрать вид закрытия.';
  else if(last&&!late&&last.boundary_date.slice(0,7)!==addDaysISO(date,-1).slice(0,7)) why='Период пересекает границу месяца: сначала закройте месяц на 1 число.'+(isSuper?' Если 1 число пропущено — отметьте «позднее закрытие».':'');
  $('#per').innerHTML=esc(per)+(why?`<br><span class="bad">${esc(why)}</span>`:'');
  invalidate();
}
function invalidate(){res=null;$('#pv').innerHTML='';$('#go').hidden=true;}

function measuresForm(){
  return `<div class="ms">${chems.map(c=>`<div class="mc2"><h3>${esc(c.name)} <small>${c.kind==='extra'?'доп. средство':'основная'}${+c.bottle_kg>0&&+c.bottle_l>0?` · 1 шт = ${f(c.bottle_l)} л = ${f(c.bottle_kg)} кг`:''}</small></h3>
    <div class="acc">${CLOSE_GROUPS.map(g=>{const k=c.id+':'+g,p=lastMeas[k];return `<label>${GL[g]}, кг<input type="text" inputmode="decimal" autocomplete="off" data-m="${k}" placeholder="кг"><small>${p!=null?'прошлый замер: '+f(p)+' кг':last?'прошлого замера нет':''}</small></label>`;}).join('')}</div></div>`).join('')}</div>`;
}
function readMeasures(){
  const end={},bad=[],arr=[];
  document.querySelectorAll('[data-m]').forEach(i=>{
    const v=Num.parse(i.value);i.style.borderColor='';
    if(i.value.trim()==='') return;
    if(!isFinite(v)||v<0||v>100000){bad.push(i);i.style.borderColor='#b42318';return;}
    end[i.dataset.m]=v;const [cid,g]=i.dataset.m.split(':');arr.push({chemical_id:+cid,machine_group:g,amount_kg:v});
  });
  return {end,arr,bad};
}
function missingList(end){
  const out=[];chems.forEach(c=>CLOSE_GROUPS.forEach(g=>{if(end[c.id+':'+g]==null)out.push(c.name+', '+(g==='1_10'?'дозатор 1':'дозатор 2'));}));return out;
}

function units(r,key){
  const kg=r[key];if(kg==null)return '–';
  const out=[f(kg)+' кг'];
  if(r.density) out.push(f(kg/r.density)+' л');
  if(r.bottle_kg) out.push(f(kg/r.bottle_kg,2)+' шт');
  return out.join('<br>');
}
function rowCard(r){
  const fl=r.flows,u=r.unit_small;
  const parts=[['новые бутыли',fl.bottles],['остатки ушли в запас',-fl.leftovers],['подключено остатков',fl.connects],['вместо бутыли при подключении',fl.replacedByConnect],['залито из запаса',fl.pours],['добавлено суперадмином',fl.adds],['забрано',-fl.takes],['поправка по уровню',fl.levelAdj]].filter(x=>Math.abs(x[1])>1e-12);
  return `<div class="pr"><h3>${r.group==='all'?'Итого по обоим дозаторам':GL[r.group]}</h3>
   <div class="pg">
    <div><span>На начало</span><b>${units(r,'start_kg')}</b></div>
    <div><span>Приход</span><b>${units(r,'inflow_kg')}</b></div>
    <div><span>На конец</span><b>${units(r,'end_kg')}</b></div>
    <div><span>Расход факт</span><b>${units(r,'fact_kg')}</b></div>
    <div><span>Теория</span><b>${units(r,'theory_kg')}</b></div>
    <div><span>Отклонение</span><b class="${cls(r.dev_pct)}">${r.dev_kg==null?'–':sign(r.dev_kg)+f(r.dev_kg)+' кг'+(r.dev_pct==null?'':'<br>'+sign(r.dev_pct)+f(r.dev_pct,2)+'%')}</b></div>
    <div><span>${u} на кг белья</span><b>${r.per_kg_laundry==null?'–':f(r.per_kg_laundry,3)}</b></div>
    <div><span>${u} на стирку</span><b>${r.per_wash==null?'–':f(r.per_wash,2)}</b></div>
    ${r.group==='all'?`<div><span>${u} на жителя в сутки</span><b>${r.per_resident_day==null?'–':f(r.per_resident_day,2)}</b></div>`:''}
    <div><span>Факт / теория</span><b>${r.ratio==null?'–':f(r.ratio,3)}</b></div>
   </div>
   <p class="sm" style="margin:.4rem 0 0">Справочно, старый факт «по замене»: ${r.old_fact_kg==null?'–':f(r.old_fact_kg)+' кг'}</p>
   ${r.group!=='all'&&parts.length?`<details><summary>Из чего сложился приход</summary><p class="sm">${parts.map(([t,v])=>esc(t)+': '+sign(v)+f(v)+' кг').join('<br>')}<br><b>${f(r.start_kg)} + ${f(r.inflow_kg)} − ${f(r.end_kg)} = ${f(r.fact_kg)} кг</b></p></details>`:''}
  </div>`;
}
function renderPreview(){
  const r=res,T=r.totals,warnTypes=r.warnings;
  let h='';
  if(r.problems.length) h+=`<div class="msg er"><b>Закрытие не пройдёт, нужно исправить:</b><ul>${r.problems.map(p=>`<li>${esc(p.text)}${p.type==='density'?' — <a href="settings.html">Настройки</a>':''}</li>`).join('')}</ul></div>`;
  if(warnTypes.length) h+=`<div class="msg wr"><b>Проверьте перед подтверждением:</b><ul>${warnTypes.map(w=>`<li>${esc(w.text)}${w.type==='over'?` (${sign(w.value)}${f(w.value,2)}% при пороге ${f(w.limit)}%)`:w.type==='negative'?` (${f(w.value)} кг)`:''}</li>`).join('')}</ul></div>`;
  if(!r.problems.length&&!warnTypes.length) h+='<div class="msg ok"><b>Всё сходится, можно закрывать.</b></div>';
  h+=`<h2>Итоги периода</h2><p class="hint">Смен: ${r.days} · ${dmy(r.from)} 06:00 → ${dmy(r.to)} 06:00</p>
   <div class="tot"><div><span>Стирок</span><b>${f(T.washes)}</b></div><div><span>Белья, кг</span><b>${f(T.laundry_kg)}</b></div>
   <div><span>Жителе-суток</span><b>${T.resident_days==null?'–':f(T.resident_days)}</b></div>
   <div><span>Факт / теория</span><b>${(()=>{const a=r.rows.filter(x=>x.group==='all'&&x.kind==='main'),fs=a.reduce((s,x)=>s+(x.fact_kg||0),0),ts=a.reduce((s,x)=>s+(x.theory_kg||0),0);return ts>0&&a.every(x=>x.fact_kg!=null)?f(fs/ts,3):'–';})()}</b></div></div>`;
  h+='<div class="tot" style="grid-template-columns:repeat(2,1fr)">'+CLOSE_GROUPS.map(g=>`<div><span>${GL[g]}</span><b>${f(T.byGroup[g].washes)} стирок · ${f(T.byGroup[g].laundry_kg)} кг</b></div>`).join('')+'</div>';
  h+='<h2>По химикатам</h2>';
  chems.forEach(c=>{const rs=r.rows.filter(x=>x.chemical_id===c.id);const all=rs.find(x=>x.group==='all');
    h+=`<details class="box" ${r.problems.some(p=>p.chemical_id===c.id)||r.warnings.some(w=>w.chemical_id===c.id)?'open':''}><summary><b>${esc(c.name)}</b> — факт ${all.fact_kg==null?'–':f(all.fact_kg)+' кг'}, теория ${all.theory_kg==null?'–':f(all.theory_kg)+' кг'}${all.dev_pct==null?'':` <span class="${cls(all.dev_pct)}">(${sign(all.dev_pct)}${f(all.dev_pct,2)}%)</span>`}</summary>
     ${rs.filter(x=>x.group!=='all').map(rowCard).join('')}${rowCard(all)}</details>`;});
  if(r.canClose&&r.warnings.length) h+=`<label class="cf"><input type="checkbox" id="ack"> Я проверил(а) предупреждения, замеры верны</label>`;
  $('#pv').innerHTML=h;
  $('#go').hidden=!r.canClose;
  $('#go').textContent=kind==='month'?'Закрыть месяц':'Закрыть отчёт за прошедшие смены';
}

async function preview(){
  const my=++seq,date=$('#bd').value;
  const {end,arr,bad}=readMeasures();
  if(bad.length){toast('Проверьте замеры: только числа от 0 кг');bad[0].focus();return;}
  if(!kind){toast('Выберите вид закрытия');return;}
  if(kind==='start'){
    const miss=missingList(end);
    $('#pv').innerHTML=miss.length?`<div class="msg er"><b>Не хватает замеров:</b><ul>${miss.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`:`<div class="msg ok"><b>Начальный замер ${dmy(date)} 06:00 готов: ${arr.length} значений.</b>Расчёта нет: это точка отсчёта для следующего закрытия.</div>`;
    res=miss.length?null:{start:true,arr};$('#go').hidden=!!miss.length;$('#go').textContent='Сохранить начальный замер';return;
  }
  $('#pv').innerHTML='<p class="hint">Считаю…</p>';$('#go').hidden=true;
  try{
    const from=last.boundary_date,to=date,back=addDaysISO(from,-60),d2=addDaysISO(to,-1);
    const [loads,changes,connects,moves,levels]=await Promise.all([page('report_loads',{d1:from,d2}),page('report_changes',{d1:back,d2:to}),page('report_connects',{d1:back,d2:to}),page('report_moves',{d1:back,d2:to}).catch(()=>[]),page('report_levels',{d1:back,d2:to}).catch(()=>[])]);
    let residents=null;
    try{const rr=await page('get_residents',{d1:from,d2});residents={};rr.forEach(x=>residents[x.day]=x.cnt);}catch(e){residents=null;}
    if(my!==seq)return;
    res=calcClosing(refs,{from,to,tz,st,startKg:lastMeas,endKg:end,loads,changes,connects,moves,levels,residents,warnPct});
    res.arr=arr;
    renderPreview();
  }catch(e){if(my===seq)$('#pv').innerHTML=`<div class="msg er"><b>Не удалось посчитать</b>${esc(e.message)}</div>`;}
}

async function submit(){
  if(!res)return;
  const date=$('#bd').value,late=!!($('#late')&&$('#late').checked&&kind==='month'&&date.slice(8)!=='01');
  if(!res.start&&res.warnings.length&&!($('#ack')&&$('#ack').checked)){toast('Отметьте, что предупреждения проверены');return;}
  const note=$('#note').value.trim()||null;
  let snap=null;
  if(!res.start){const {arr,...rest}=res;snap={...rest,warn_pct:warnPct,version:1};}
  const title=kind==='start'?'Сохранить начальный замер?':kind==='month'?'Закрыть месяц?':'Закрыть отчёт за прошедшие смены?';
  const txt=kind==='start'?`Замер ${dmy(date)} 06:00`:`Смены ${dmy(last.boundary_date)} – ${dmy(addDaysISO(date,-1))}\nЗамер ${dmy(date)} 06:00${late?'\nПозднее закрытие':''}\nЗаписи внутри периода после закрытия менять нельзя.`;
  const ok=await withPw(title,txt,pw=>rpcAsk('closing_create',{p_kind:kind,p_boundary:date,p_measures:res.arr,p_snapshot:snap,p_pw:pw,p_late:late,p_note:note}));
  if(!ok)return;
  toast(kind==='start'?'Начальный замер сохранён':'Период закрыт');
  if(kind==='start')await init();else location.href='closings-report.html';
}

async function loadLast(){
  const {data,error}=await sb.from('closings').select('id,kind,boundary_date,at_ts,is_etalon').order('at_ts',{ascending:false}).limit(1);
  if(error) throw new Error(/closings/.test(error.message)?'Выполните stage15.sql в Supabase.':error.message);
  last=(data||[])[0]||null;lastMeas={};
  if(last){const {data:m}=await sb.from('closing_measures').select('chemical_id,machine_group,amount_kg').eq('closing_id',last.id);(m||[]).forEach(x=>lastMeas[x.chemical_id+':'+x.machine_group]=+x.amount_kg);}
}

async function init(){
  try{
    await loadLast();
    const [s,c,w,r,td]=await Promise.all([sb.from('settings').select('*'),sb.from('chemicals').select('*').order('sort'),sb.from('wash_types').select('id,name').order('sort'),sb.from('recipes').select('*'),sb.rpc('closing_today')]);
    const g=k=>{const x=(s.data||[]).find(y=>y.key===k);return x?+x.value:null};
    tz=g('tz_offset')??5;st=g('shift_start')??6;warnPct=g('close_warn_pct')??25;
    refs={water:g('water_l')??55,washTypes:w.data||[],chemicals:c.data||[],recipes:r.data||[]};
    chems=closingChems(refs.chemicals);
    today=td.data||new Date(Date.now()+(tz-st)*3600e3).toISOString().slice(0,10);
  }catch(e){$('#out').innerHTML=`<div class="msg er"><b>Не удалось загрузить</b>${esc(e.message)}</div>`;return;}
  const stHH=String(st).padStart(2,'0');
  $('#out').innerHTML=`
   <div class="box">
    <p class="hint" style="margin-top:0">${last?`Последний замер: <b>${dmy(last.boundary_date)} ${stHH}:00</b> (${last.kind==='start'?'начальный':last.kind==='month'?'закрытие месяца':'закрытие внутри месяца'})`:'Замеров ещё нет. Сначала внесите начальный замер остатков во всех дозаторах.'}</p>
    <label>Дата замера (в ${stHH}:00, начало смены)<input type="date" id="bd" value="${today}" max="${today}"></label>
    ${isSuper&&last?'<label class="cf"><input type="checkbox" id="late"> Позднее закрытие месяца (1 число пропущено)</label>':''}
    <div class="kd" id="kd"></div>
    <p class="hint" id="per"></p>
   </div>
   <h2>Остатки в дозаторах, кг</h2>
   <p class="hint">Взвесьте химию в ${stHH}:00, до заливок и замен бутылей. Можно с запятой: 12,5. Порог предупреждения «больше теории»: ${f(warnPct)}% (меняется в настройках).</p>
   ${chems.length?measuresForm():'<div class="msg er">Нет химикатов для закрытия.</div>'}
   <label style="margin-top:.8rem">Комментарий (необязательно)<input id="note" maxlength="300" autocomplete="off"></label>
   <div id="pv"></div>
   <div class="fbar"><button class="go" id="pb" type="button">Посчитать предпросмотр</button><button class="go" id="go" type="button" hidden style="margin-top:.5rem"></button></div>`;
  $('#kd').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;kind=b.dataset.k;draw();};
  $('#bd').onchange=draw;if($('#late'))$('#late').onchange=draw;
  document.querySelectorAll('[data-m]').forEach(i=>i.oninput=invalidate);
  $('#note').oninput=()=>{};
  $('#pb').onclick=preview;$('#go').onclick=submit;
  kind=null;draw();
}

(async()=>{
  const ses=await need();if(!ses)return;
  const [{data:adm},{data:pr}]=await Promise.all([sb.rpc('is_admin'),sb.from('profiles').select('role').eq('id',ses.user.id).maybeSingle()]);
  isSuper=pr?.role==='superadmin';
  if(!adm&&!isSuper){$('#out').innerHTML='<p>Закрывать период могут админы и суперадмин.</p>';return;}
  await init();
})();
</script>
</body></html>
