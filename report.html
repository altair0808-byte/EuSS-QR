<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отчёт по сменам — EuSS</title><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Отчёты</span></a><nav class="nav"><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top"><h1>Отчёт по сменам</h1></div>
<div class="box">
  <div class="acc"><label>С даты смены<input type="date" id="d1"></label><label>По дату смены<input type="date" id="d2"></label></div>
  <div class="seg" role="group" aria-label="Период"><button id="t">Сегодня</button><button id="y">Вчера</button><button id="w">7 дней</button><button id="mo">Этот месяц</button><button id="pm">Прошлый месяц</button></div>
  <p class="hint" id="rng"></p>
</div>
<div id="out"><p class="hint">Загрузка…</p></div>
<div id="ovl"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script><script src="report-calc.js"></script>
<script>
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(n,d=1)=>(Math.round(n*10**d)/10**d).toLocaleString('ru-RU');
let refs=null,tz=5,st=6,seq=0,isSuper=false,byId={};
const shiftToday=()=>new Date(Date.now()+(tz-st)*3600e3).toISOString().slice(0,10);
const addDays=(d,n)=>new Date(new Date(d+'T00:00:00Z').getTime()+n*864e5).toISOString().slice(0,10);
const hhmm=ts=>new Date(new Date(ts).getTime()+tz*3600e3).toISOString().slice(11,16);
const dmy=d=>d.split('-').reverse().join('.');

function two(o){return o?[o.l!=null?f(o.l)+' л':'',o.kg!=null?f(o.kg)+' кг':''].filter(Boolean).join('<br>')||'–':'–'}
function dif(c){if(c.diff==null||!c.changes)return'–';const u=c.prim==='l'?'л':'кг',cls=c.pct!=null&&c.pct>10?' class="bad"':c.pct!=null&&c.pct<-10?' class="good"':'';return `<span${cls}>${c.diff>0?'+':''}${f(c.diff)} ${u}${c.pct==null?'':'<br>'+(c.pct>0?'+':'')+f(c.pct,0)+'%'}</span>`}
function note(c){if(c.kind==='extra')return'по загрузкам, замены бутылей не отмечаются';return c.prim==null?'Задайте литры и кг в настройках':c.diff==null?'Задайте и литры, и кг в настройках':`замен: ${c.changes}${c.noLeft?`, без остатка: ${c.noLeft}`:''}`}
function chemTable(g){
  return `<div class="box"><table class="tbl"><tr><th>Химия</th><th>Теория</th><th>Факт</th><th>Разница</th></tr>
  ${g.chem.map(c=>`<tr><td>${esc(c.name)}<br><small>${note(c)}</small></td><td>${two(c.theory)}</td><td>${c.changes?two(c.actual):'–'}</td><td>${dif(c)}</td></tr>`).join('')}</table></div>`;
}
function washTable(g){
  return `<div class="box"><table class="tbl"><tr><th>Вид стирки</th><th>Стирок</th><th>Кг</th></tr>
  ${refs.washTypes.filter(w=>g.byWash[w.id]).map(w=>`<tr><td>${esc(w.name)}</td><td>${g.byWash[w.id].n}</td><td>${f(g.byWash[w.id].kg,0)}</td></tr>`).join('')||'<tr><td colspan="3">За период стирок нет</td></tr>'}</table></div>`;
}
function groupBlock(title,g){
  return `<section><h2>${title}</h2><div class="kpi"><div><b>${g.total}</b><span>стирок</span></div><div><b>${f(g.kg,0)}</b><span>кг белья</span></div></div>
  <h2>Стирки по видам</h2>${washTable(g)}
  <h2>Химия: теория и факт</h2>${chemTable(g)}</section>`;
}

async function show(){
  const d1=$('#d1').value,d2=$('#d2').value,my=++seq;
  if(!d1||!d2||d1>d2){$('#out').innerHTML='<p class="hint">Укажите период: дата «с» не позже даты «по».</p>';return;}
  $('#rng').textContent=`Смена начинается в ${String(st).padStart(2,'0')}:00 и длится сутки. Расход считается отдельно по двум дозаторам.`;
  const [{data,error},{data:chg,error:e2}]=await Promise.all([sb.rpc('report_loads',{d1,d2}),sb.rpc('report_changes',{d1,d2})]);
  if(my!==seq)return;
  if(error||e2){$('#out').innerHTML='<p class="err">Не удалось загрузить данные. Выполните supabase.sql и затем stage3.sql.</p>';return;}
  const loads=data||[],changes=chg||[],r=calcReport(loads,changes,refs),wn={},cn={};
  refs.washTypes.forEach(w=>wn[w.id]=w.name);refs.chemicals.forEach(c=>cn[c.id]=c.name);
  const rows=loads.slice().reverse().slice(0,300), chRows=changes.slice().reverse().slice(0,300);
  byId={};rows.forEach(l=>byId[l.id]=l);
  $('#out').innerHTML=`
    <div class="kpi"><div><b>${r.total}</b><span>стирок всего</span></div><div><b>${f(r.kg,0)}</b><span>кг всего</span></div><div><b>${r.byPart.day}</b><span>день</span></div><div><b>${r.byPart.night}</b><span>ночь</span></div></div>
    ${groupBlock('Дозатор 1 · машины 1–10',r.groups['1_10'])}
    ${groupBlock('Дозатор 2 · машины 11–12',r.groups['11_12'])}
    <section><h2>Общий итог · оба дозатора</h2>${groupBlock('Стирки и химия вместе',r.groups.all)}</section>
    <h2>Записи загрузок${loads.length>rows.length?` (последние ${rows.length})`:''}</h2>
    <div class="box"><table class="tbl"><tr><th>Смена</th><th>Время</th><th>Машина</th><th>Дозатор</th><th>Вид</th><th>Кг</th>${isSuper?'<th></th>':''}</tr>
    ${rows.map(l=>`<tr><td>${dmy(l.shift_date)} ${l.part==='night'?'ночь':'день'}</td><td>${hhmm(l.ts)}</td><td>${l.machine}</td><td>${l.machine<=10?'1–10':'11–12'}</td><td>${esc(wn[l.wash_type_id])}${l.edited_at?' <small title="Исправлено суперадмином">· испр.</small>':''}</td><td>${f(l.weight_kg)}</td>${isSuper?`<td><button class="mini" data-ed="${l.id}" aria-label="Исправить запись" title="Исправить">✎</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${isSuper?7:6}">Нет записей</td></tr>`}</table></div>
    <h2>Замены химии${changes.length>chRows.length?` (последние ${chRows.length})`:''}</h2>
    <div class="box"><table class="tbl"><tr><th>Смена</th><th>Время</th><th>Дозатор</th><th>Химия</th><th>Остаток</th></tr>
    ${chRows.map(x=>`<tr><td>${dmy(x.shift_date)}</td><td>${hhmm(x.ts)}</td><td>${x.machine_group==='11_12'?'11–12':'1–10'}</td><td>${esc(cn[x.chemical_id])}</td><td>${x.leftover_kg!=null?f(x.leftover_kg)+' кг':x.leftover_l!=null?f(x.leftover_l)+' л':'пусто'}</td></tr>`).join('')||'<tr><td colspan="5">Нет замен</td></tr>'}</table></div>`;
}

// ---------- правка истории загрузок (только суперадмин; права закрыты и в базе) ----------
const optN=(v,sel)=>`<option value="${v}"${v===sel?' selected':''}`;
function editPanel(l){
  const ex=refs.chemicals.filter(c=>c.kind==='extra'),loc=new Date(new Date(l.ts).getTime()+tz*3600e3).toISOString();
  const t0=loc.slice(11,16),d0=l.shift_date;
  $('#ovl').innerHTML=`<div class="ov" id="bg"><section class="pn" role="dialog" aria-modal="true" aria-label="Исправить загрузку">
   <div class="ph"><div><p class="eb">Только суперадмин</p><h2>Исправить загрузку</h2><p class="hint">Запись от ${dmy(l.shift_date)}, ${hhmm(l.ts)}</p></div><button class="ib" id="cl" aria-label="Закрыть">✕</button></div>
   <label>Машина<select id="em">${Array.from({length:12},(_,i)=>i+1).map(m=>`${optN(m,l.machine)}>${m} · ${m<=10?'дозатор 1':'дозатор 2'}</option>`).join('')}</select></label>
   <label>Вид стирки<select id="ew">${refs.washTypes.map(w=>`${optN(w.id,l.wash_type_id)}>${esc(w.name)}</option>`).join('')}</select></label>
   <label>Вес, кг<input id="ek" type="number" min="0" step="0.5" inputmode="decimal" value="${+l.weight_kg}"></label>
   <div class="acc"><label>Дата смены<input id="ed" type="date" value="${d0}"></label><label>Время запуска<input id="et" type="time" value="${t0}"></label></div>
   <p class="hint">Смена начинается в ${String(st).padStart(2,'0')}:00. Время до ${String(st).padStart(2,'0')}:00 относится к ночи этой же смены.</p>
   ${ex.length?`<h3>Дополнительно, шт</h3><div class="acc">${ex.map(c=>`<label>${esc(c.name)}<input type="number" min="0" step="1" inputmode="numeric" data-x="${c.id}" value="${(l.extras||{})[c.id]||''}" placeholder="0"></label>`).join('')}</div>`:''}
   <button class="go" id="ok">Сохранить исправление</button>
   <button class="ghost danger" id="rm">Удалить запись</button></section></div>`;
  const close=()=>{$('#ovl').innerHTML='';document.onkeydown=null;};
  document.onkeydown=e=>{if(e.key==='Escape')close();};
  $('#cl').onclick=close;$('#bg').onmousedown=e=>{if(e.target.id==='bg')close();};
  $('#ok').onclick=async()=>{
    const kg=+$('#ek').value,d=$('#ed').value,t=$('#et').value;
    if(!(kg>0)){toast('Укажите вес в килограммах');return;}
    if(!d||!t){toast('Укажите дату смены и время');return;}
    if(kg>100&&!confirm('Вес '+kg+' кг. Это точно верно?'))return;
    const upd={machine:+$('#em').value,wash_type_id:+$('#ew').value,weight_kg:kg};
    const ex2={};document.querySelectorAll('#ovl [data-x]').forEach(i=>{if(+i.value>0)ex2[i.dataset.x]=+i.value;});upd.extras=ex2;
    if(d!==d0||t!==t0){                                   // время менялось: пересчитываем момент записи
      const[y,mo,da]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);
      let at=Date.UTC(y,mo-1,da,h,mi)-tz*3600e3;if(h<st)at+=864e5;     // до начала смены = следующие календарные сутки
      upd.ts=new Date(at).toISOString();
    }
    $('#ok').disabled=true;
    const{data,error}=await sb.from('loads').update(upd).eq('id',l.id).select('id');
    if(error||!data||!data.length){toast('Не сохранено: '+(error?error.message:'нет прав или не выполнен stage5.sql'));$('#ok').disabled=false;return;}
    close();toast('Запись исправлена');show();
  };
  $('#rm').onclick=async()=>{
    if(!confirm('Удалить эту запись безвозвратно?'))return;
    const{data,error}=await sb.from('loads').delete().eq('id',l.id).select('id');
    if(error||!data||!data.length){toast('Не удалено: '+(error?error.message:'нет прав или не выполнен stage5.sql'));return;}
    close();toast('Запись удалена');show();
  };
}
$('#out').onclick=e=>{const b=e.target.closest('[data-ed]');if(b&&byId[b.dataset.ed])editPanel(byId[b.dataset.ed]);};

const mr=n=>{const t=shiftToday(),d=new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7)-1+n,1)),ym=d.toISOString().slice(0,7),last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();return[ym+'-01',ym+'-'+String(last).padStart(2,'0')]};
function mark(){const a=$('#d1').value,b=$('#d2').value,t=shiftToday(),y=addDays(t,-1),w=addDays(t,-6);
  [['t',a===t&&b===t],['y',a===y&&b===y],['w',a===w&&b===t],['mo',a===mr(0)[0]&&b===mr(0)[1]],['pm',a===mr(-1)[0]&&b===mr(-1)[1]]].forEach(([id,on])=>{$('#'+id).classList.toggle('on',on);$('#'+id).setAttribute('aria-pressed',on);});}
function setRange(a,b){$('#d1').value=a;$('#d2').value=b;mark();show();}
$('#d1').onchange=$('#d2').onchange=()=>{mark();show();};
$('#t').onclick=()=>setRange(shiftToday(),shiftToday());
$('#y').onclick=()=>{const d=addDays(shiftToday(),-1);setRange(d,d)};
$('#mo').onclick=()=>setRange(...mr(0));
$('#pm').onclick=()=>setRange(...mr(-1));
$('#w').onclick=()=>setRange(addDays(shiftToday(),-6),shiftToday());

(async()=>{
  const ses=await need();if(!ses)return;
  const {data:pr}=await sb.from('profiles').select('role').eq('id',ses.user.id).maybeSingle();isSuper=pr?.role==='superadmin';
  const {data:ok}=await sb.rpc('can_report');
  if(!ok){$('#out').innerHTML='<p>Нет доступа к отчёту. Обратитесь к администратору.</p>';return;}
  const [s,c,w,r]=await Promise.all([sb.from('settings').select('*'),sb.from('chemicals').select('*').order('sort'),sb.from('wash_types').select('id,name').order('sort'),sb.from('recipes').select('*')]);
  const g=k=>{const x=(s.data||[]).find(y=>y.key===k);return x?+x.value:null};
  tz=g('tz_offset')??5;st=g('shift_start')??6;
  refs={water:g('water_l')??55,washTypes:w.data||[],chemicals:c.data||[],recipes:r.data||[]};
  setRange(shiftToday(),shiftToday());
})();
</script></body></html>
