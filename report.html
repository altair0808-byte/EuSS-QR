<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2aa3b5">
<title>Отчёт по сменам — EuSS</title><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"><style>
.rv{margin:1rem 0 .25rem;display:grid;gap:.6rem}
.sbx{padding:.7rem .9rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.sbx .sl{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem;color:var(--mut)}.sbx .sl b{color:var(--ink)}
.sbx .sb2{display:flex;height:.6rem;margin:.4rem 0;border-radius:99px;overflow:hidden;background:var(--tint)}
.sbx .sb2 i{display:block;background:var(--ac)}.sbx .sb2 i+i{background:oklch(.69 .17 48)}
.sbx>p{margin:0 0 .1rem;font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--mut)}
.sgrid{display:grid;gap:.6rem}@media(min-width:720px){.sgrid{grid-template-columns:1fr 1fr}}
.rtabs{margin:.9rem 0 0}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem;margin:1.25rem 0 .1rem}.gh h2{margin:0}.gh small{color:var(--mut)}
.csum{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.6rem 0}
.csum div{padding:.65rem .8rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.csum span{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--mut)}.csum b{font-family:Sora,sans-serif;font-size:1.15rem}
.csum .bad b{color:#b42318}.csum .good b{color:oklch(.5 .12 160)}
.cn3{margin:.2rem 0 .6rem;font-size:.75rem;color:var(--mut)}
.cmw{display:grid;gap:.6rem}.cmw .cm+.cm{margin-top:0}@media(min-width:1000px){.cmw{grid-template-columns:1fr 1fr}}
.wb .bz{width:38%}.wb .bz span{display:block;height:.55rem;border-radius:99px;background:var(--tint);overflow:hidden}.wb .bz i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.wb td:last-child,.wb th:last-child{text-align:right;white-space:nowrap}
@media(max-width:639px){.wb .bz{display:none}}
</style>
</head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Отчёты</span></a><nav class="nav"><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem"><h1>Отчёт по сменам</h1><span><a class="btn" id="tocl" href="closings-report.html" hidden>⚖ Закрытия</a> <a class="btn" href="journal.html">☰ Журнал изменений</a></span></div>
<div class="box">
  <div class="acc"><label>С даты смены<input type="date" id="d1"></label><label>По дату смены<input type="date" id="d2"></label></div>
  <div class="seg" role="group" aria-label="Период"><button id="t">Сегодня</button><button id="y">Вчера</button><button id="w">7 дней</button><button id="mo">Этот месяц</button><button id="pm">Прошлый месяц</button></div>
  <p class="hint" id="rng"></p>
</div>
<div id="out"><p class="hint">Загрузка…</p></div>
<div id="ovl"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="num.js"></script><script src="app.js"></script><script src="report-calc.js"></script>
<script>
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>Num.fmt(n);   // без округления: 0,175 → «0,175», 0,350 → «0,35»
let tabR='all',R=null,refs=null,tz=5,st=6,seq=0,canEdit=false,byId={},byCh={},nm={},cache={loads:[],changes:[],conns:[]},kindF='all';
const who=id=>(id&&nm[id])||'';
const shiftToday=()=>new Date(Date.now()+(tz-st)*3600e3).toISOString().slice(0,10);
const addDays=(d,n)=>new Date(new Date(d+'T00:00:00Z').getTime()+n*864e5).toISOString().slice(0,10);
const hhmm=ts=>new Date(new Date(ts).getTime()+tz*3600e3).toISOString().slice(11,16);
const dmy=d=>d.split('-').reverse().join('.');

function two(o){return o?[o.pc!=null?f(o.pc,2)+' шт':'',o.l!=null?f(o.l)+' л':'',o.kg!=null?f(o.kg)+' кг':''].filter(Boolean).join('<br>')||'–':'–'}
function dif(c){if(c.diff==null||!c.changes)return'–';const u=c.prim==='l'?'л':'кг',cls=c.pct!=null&&c.pct>10?' class="bad"':c.pct!=null&&c.pct<-10?' class="good"':'';return `<span${cls}>${c.diff>0?'+':''}${f(c.diff)} ${u}${c.size>0&&c.kind!=='extra'?'<br>'+(c.diff>0?'+':'')+f(c.diff/c.size,2)+' шт':''}${c.pct==null?'':'<br>'+(c.pct>0?'+':'')+Num.fmt(c.pct,2)+'%'}</span>`}
function note(c){if(c.kind==='extra')return'по загрузкам, замены бутылей не отмечаются';return c.prim==null?'Задайте литры и кг в настройках':c.diff==null?'Задайте и литры, и кг в настройках':`замен: ${c.changes}${c.noLeft?`, без остатка: ${c.noLeft}`:''}`}
function chemTable(g){
  const body=g.chem.map(c=>{
    const ex=c.kind==='extra',has=c.stock&&(c.stock.l>0||c.stock.kg>0),con=c.connected&&(c.connected.l>0||c.connected.kg>0);
    return `<div class="cm"><div class="cmh"><b>${esc(c.name)}</b><small>${note(c)}</small></div><div class="cmg">
      <div><span>Теория</span><b>${two(c.theory)}</b></div>
      <div><span>Факт</span><b>${c.changes?two(c.actual):'–'}</b>${c.connected&&((c.connected.l||0)>0||(c.connected.kg||0)>0)?`<small>с учётом подключённого остатка</small>`:''}</div>
      <div><span>Разница</span><b>${dif(c)}</b></div>
      <div class="st"><span>Остаток</span>${ex?'<b>–</b>':`<b>${has?'в запасе: '+two(c.stock).replace('<br>',' · '):'в запасе: нет'}</b>${con?`<small>подключено: ${two(c.connected).replace('<br>',' · ')}</small>`:''}`}</div>
    </div></div>`;}).join('');
  return `<div class="cmw">${body}</div>`;
}
function washTable(g){
  const rows=refs.washTypes.filter(w=>g.byWash[w.id]),mx=Math.max(1,...rows.map(w=>g.byWash[w.id].kg)),tk=rows.reduce((x,w)=>x+g.byWash[w.id].kg,0);
  return `<div class="box"><table class="tbl wb"><tr><th>Вид стирки</th><th>Стирок</th><th>Кг</th><th class="bz"></th><th>Доля</th></tr>
  ${rows.map(w=>{const v=g.byWash[w.id];return `<tr><td>${esc(w.name)}</td><td>${v.n}</td><td>${f(v.kg,0)}</td><td class="bz"><span><i style="width:${(v.kg/mx*100).toFixed(0)}%"></i></span></td><td>${tk>0?Math.round(v.kg/tk*100)+'%':'–'}</td></tr>`;}).join('')||'<tr><td colspan="5">За период стирок нет</td></tr>'}</table></div>`;
}
function chemSum(g){
  const m=g.chem.filter(c=>c.kind==='main'&&c.theory&&c.theory.l!=null),th=m.reduce((x,c)=>x+c.theory.l,0);
  const w=m.filter(c=>c.changes&&c.actual&&c.actual.l!=null),thW=w.reduce((x,c)=>x+c.theory.l,0),ac=w.reduce((x,c)=>x+c.actual.l,0),pct=thW>0?(ac-thW)/thW*100:null;
  const cls=pct==null?'':pct>10?'bad':pct<-10?'good':'';
  return `<div class="csum"><div><span>Теория, основная химия</span><b>${f(th)} л</b></div><div><span>Факт, по заменам</span><b>${w.length?f(ac)+' л':'–'}</b></div><div class="${cls}"><span>Отклонение</span><b>${pct==null?'–':(pct>0?'+':'')+Num.fmt(pct,1)+'%'}</b></div></div>
  <p class="cn3">Итоги по основной химии. Факт и отклонение считаются только по позициям, где были замены бутылей (${w.length} из ${m.length}). Доп. средства — в карточках ниже, по загрузкам.</p>`;
}
function groupBlock(title,g){
  return `<section><div class="gh"><h2>${title}</h2></div>
  <div class="kpi"><div><b>${g.total}</b><span>стирок</span></div><div><b>${f(g.kg,0)}</b><span>кг белья</span></div><div><b>${g.total?Num.fmt(g.kg/g.total,1):'–'}</b><span>средний вес загрузки, кг</span></div></div>
  <div class="gh"><h2>Стирки по видам</h2></div>${washTable(g)}
  <div class="gh"><h2>Химия: теория и факт</h2></div>${chemSum(g)}${chemTable(g)}</section>`;
}
const split=(t,a,b,la,lb,fa,fb)=>{const sum=a+b,pa=sum>0?a/sum*100:50;return `<div class="sbx"><p>${t}</p><div class="sb2"><i style="width:${pa.toFixed(0)}%"></i><i style="width:${(100-pa).toFixed(0)}%"></i></div><div class="sl"><span>${la}: <b>${fa}</b></span><span>${lb}: <b>${fb}</b></span></div></div>`;};
const RT=[['all','Итого'],['1_10','Дозатор 1'],['11_12','Дозатор 2'],['ops','Журнал операций']];
function draw(){
  const r=R,A=r.groups.all,g1=r.groups['1_10'],g2=r.groups['11_12'];
  const chL=g=>g.chem.filter(c=>c.kind==='main').reduce((x,c)=>x+(c.theory?.l||0),0);
  let body;
  if(tabR==='ops')body=`<div class="gh"><h2>Журнал операций</h2></div><p class="hint">Синие записи — загрузка белья, оранжевые — замена химии, фиолетовые — подключение остатка.</p>
    <div class="seg" id="kf" role="group" aria-label="Что показывать"><button data-v="all">Все</button><button data-v="ld">🧺 Загрузки</button><button data-v="ch">⚗ Химия</button></div>
    <div class="ops" id="opsw" style="margin-top:.75rem"></div>`;
  else body=groupBlock(tabR==='all'?'Итого · оба дозатора':tabR==='1_10'?'Дозатор 1 · машины 1–10':'Дозатор 2 · машины 11–12',r.groups[tabR]);
  $('#out').innerHTML=`<div class="rv"><div class="kpi"><div><b>${r.total}</b><span>стирок всего</span></div><div><b>${f(r.kg,0)}</b><span>кг всего</span></div><div><b>${r.total?Num.fmt(r.kg/r.total,1):'–'}</b><span>средний вес, кг</span></div><div><b>${f(chL(A))} л</b><span>химия, теория</span></div></div>
    <div class="sgrid">${split('День / ночь',r.byPart.day,r.byPart.night,'день',' ночь',r.byPart.day+' стирок',r.byPart.night+' стирок')}${split('Дозатор 1 / Дозатор 2 · вес',g1.kg,g2.kg,'Д1 (1–10)','Д2 (11–12)',f(g1.kg,0)+' кг · '+g1.total+' ст.',f(g2.kg,0)+' кг · '+g2.total+' ст.')}</div></div>
    <div class="seg rtabs" role="tablist">${RT.map(([id,l])=>`<button role="tab" aria-selected="${tabR===id}" class="${tabR===id?'on':''}" data-rt="${id}">${l}</button>`).join('')}</div>${body}`;
  if(tabR==='ops')renderOps();
}

async function show(){
  const d1=$('#d1').value,d2=$('#d2').value,my=++seq;
  if(!d1||!d2||d1>d2){$('#out').innerHTML='<p class="hint">Укажите период: дата «с» не позже даты «по».</p>';return;}
  $('#rng').textContent=`Смена начинается в ${String(st).padStart(2,'0')}:00 и длится сутки. Расход считается отдельно по двум дозаторам.`;
  const [{data,error},{data:chg,error:e2},{data:cn,error:e3},sn,{data:lv}]=await Promise.all([sb.rpc('report_loads',{d1,d2}),sb.rpc('report_changes',{d1:addDaysISO(d1,-60),d2}),sb.rpc('report_connects',{d1:addDaysISO(d1,-60),d2}),sb.rpc('staff_names'),sb.rpc('report_levels',{d1:addDaysISO(d1,-60),d2})]);   // report_levels появится после stage12.sql; без него просто пусто
  if(my!==seq)return;
  if(error||e2||e3){$('#out').innerHTML='<p class="err">Не удалось загрузить данные. Выполните supabase.sql, затем stage3.sql … stage12.sql.</p>';return;}
  nm=Object.fromEntries(((sn&&sn.data)||[]).map(x=>[x.id,x.name]));
  const loads=data||[],chgAll=chg||[],cnAll=cn||[],changes=chgAll.filter(x=>x.shift_date>=d1),conns=cnAll.filter(x=>x.shift_date>=d1),r=calcReport(loads,changes,refs,conns,{changes:chgAll,connects:cnAll,levels:lv||[]});
  cache={loads,changes,conns};R=r;draw();
}
function renderOps(){
  const wn={},cn2={};refs.washTypes.forEach(w=>wn[w.id]=w.name);refs.chemicals.forEach(c=>cn2[c.id]=c.name);
  const {loads,changes,conns}=cache;byId={};byCh={};
  const all=[...loads.map(o=>({k:'ld',ts:o.ts,o})),...changes.map(o=>({k:'ch',ts:o.ts,o})),...conns.map(o=>({k:'cn',ts:o.ts,o}))]
    .filter(i=>kindF==='all'||(kindF==='ld'?i.k==='ld':i.k!=='ld')).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  const shown=all.slice(0,300);
  document.querySelectorAll('#kf button').forEach(b=>{const on=b.dataset.v===kindF;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  const act=(k,id,ed)=>canEdit?`<div class="act"><button class="mini" data-${ed}="${id}">✎ Изменить</button><button class="mini danger" data-del="${id}" data-k="${k}">🗑 Удалить</button></div>`:'';
  let day='';
  const html=shown.map(i=>{
    const o=i.o,by=who(o.created_by),byT=by?' · внёс: '+esc(by):'',sd=o.shift_date;
    let head='';if(sd!==day){day=sd;head=`<p class="day">Смена ${dmy(sd)}</p>`;}
    if(i.k==='ld'){
      byId[o.id]=o;
      const ex=Object.entries(o.extras||{}).map(([id,q])=>{const c=refs.chemicals.find(x=>String(x.id)===String(id));return c?esc(c.name)+': '+q+' шт':''}).filter(Boolean).join(', ');
      return head+`<article class="op ld"><div class="r1"><span class="tg ld">🧺 Загрузка белья</span><span class="tm">${o.part==='night'?'ночь':'день'} · ${hhmm(o.ts)}</span></div>
        <div class="tt">Машина ${o.machine} · ${esc(wn[o.wash_type_id]||'вид '+o.wash_type_id)} · ${f(o.weight_kg)} кг</div>
        <div class="mt">дозатор ${o.machine<=10?'1–10':'11–12'}${ex?' · '+ex:''}${byT}${o.edited_at?' · <b>исправлено</b>':''}</div>${act('ld',o.id,'ed')}</article>`;
    }
    if(i.k==='ch'){
      byCh[o.id]=o;
      const left=+o.leftover_l>0?f(o.leftover_l)+' л':+o.leftover_kg>0?f(o.leftover_kg)+' кг':'бутыль пустая';
      const has=+o.leftover_l>0||+o.leftover_kg>0;
      return head+`<article class="op ch"><div class="r1"><span class="tg ch">⚗ Замена химии</span><span class="tm">${hhmm(o.ts)}</span></div>
        <div class="tt">${esc(cn2[o.chemical_id]||'Химия')} · дозатор ${o.machine_group==='11_12'?'11–12':'1–10'}</div>
        <div class="mt">остаток: ${left}${has?(o.connect_id?' · <b>подключён</b>':o.written_off_at?'':' · в запасе'):''}${byT}${o.edited_at?' · <b>исправлено</b>':''}</div>${act('ch',o.id,'edc')}</article>`;
    }
    const amt=+o.amount_l>0?f(o.amount_l)+' л':+o.amount_kg>0?f(o.amount_kg)+' кг':'';
    return head+`<article class="op cn"><div class="r1"><span class="tg cn">🔗 Остаток подключён</span><span class="tm">${hhmm(o.ts)}</span></div>
      <div class="tt">${esc(cn2[o.chemical_id]||'Химия')} · ${amt} → дозатор ${o.machine_group==='11_12'?'11–12':'1–10'}</div>
      <div class="mt">объединено остатков: ${o.n}${byT}</div></article>`;
  }).join('');
  $('#opsw').innerHTML=(html||'<p class="hint">Нет записей за период.</p>')+(all.length>shown.length?`<p class="hint">Показаны последние ${shown.length} из ${all.length}.</p>`:'');
}

// ---------- удаление и правка замен химии (админ и суперадмин, с паролем; права и пароль проверяет база) ----------
function chemEdit(x){
  const c=refs.chemicals.find(z=>+z.id===+x.chemical_id)||{name:'Химия'};
  let unit=+x.leftover_l>0?'l':(+x.leftover_kg>0?'kg':(+c.bottle_kg>0?'kg':'l'));
  const v0=+x.leftover_l>0?+x.leftover_l:(+x.leftover_kg>0?+x.leftover_kg:'');
  $('#ovl').innerHTML=`<div class="ov" id="bg"><section class="pn" role="dialog" aria-modal="true" aria-label="Исправить замену химии">
   <div class="ph"><div><p class="eb">Админ и суперадмин</p><h2>${esc(c.name)}</h2><p class="hint">Замена от ${dmy(x.shift_date)}, ${hhmm(x.ts)}</p></div><button class="ib" id="cl" aria-label="Закрыть">✕</button></div>
   <label>Дозатор<select id="eg"><option value="1_10"${x.machine_group!=='11_12'?' selected':''}>1–10 · основной</option><option value="11_12"${x.machine_group==='11_12'?' selected':''}>11–12 · отдельный</option></select></label>
   <h3>Остаток в бутыли</h3>
   <div class="seg" id="eu"><button data-v="kg" class="${unit==='kg'?'on':''}">кг</button><button data-v="l" class="${unit==='l'?'on':''}">литры</button></div>
   <label>Остаток (пусто или 0 — бутыль пустая)<input id="ev" type="number" min="0" step="any" inputmode="decimal" value="${v0}"></label>
   ${x.connect_id?'<p class="hint">Этот остаток уже подключён к дозатору. Если изменить количество, подключение и отчёт пересчитаются автоматически.</p>':''}
   <button class="go" id="ok">Сохранить исправление</button>
   <button class="ghost danger" id="rm">Удалить запись</button></section></div>`;
  const close=()=>{$('#ovl').innerHTML='';document.onkeydown=null;};
  document.onkeydown=e=>{if(e.key==='Escape'&&!document.querySelector('form[role=dialog]'))close();};
  $('#cl').onclick=close;$('#bg').onmousedown=e=>{if(e.target.id==='bg')close();};
  pick('#eu',v=>{unit=v;});
  $('#ok').onclick=async()=>{
    const raw=$('#ev').value,v=raw===''?0:+raw,size=unit==='kg'?+c.bottle_kg:+c.bottle_l;
    if(!(v>=0)){toast('Остаток указан неверно');return;}
    if(v>0&&size>0&&v>size){toast('Остаток больше полной бутыли ('+size+' '+(unit==='kg'?'кг':'л')+')');return;}
    const g=$('#eg').value,lv=v===0?0:(unit==='l'?v:null),kv=v===0?0:(unit==='kg'?v:null);
    $('#ok').disabled=true;
    const done=await withPw('Сохранить исправление?',c.name+' · '+dmy(x.shift_date)+' '+hhmm(x.ts)+'\nОтчёт и остатки пересчитаются по новым цифрам.',pw=>rpcAsk('edit_chem',{p_id:x.id,p_pw:pw,p_group:g,p_leftover_l:lv,p_leftover_kg:kv}));
    if(!done){$('#ok').disabled=false;return;}
    close();toast('Запись исправлена');show();
  };
  $('#rm').onclick=()=>{close();delRec('ch',x.id);};
}
async function delRec(k,id){
  const o=k==='ld'?byId[id]:byCh[id];
  let q=k==='ld'?'Удалить эту загрузку белья безвозвратно?':'Удалить эту замену химии безвозвратно?';
  if(o&&o.connect_id)q+='\nЕё остаток уже подключён: подключение и отчёт пересчитаются автоматически.';
  q+='\nВ журнале изменений останется след об удалении.';
  const done=await withPw('Удалить запись?',q,pw=>rpcAsk(k==='ld'?'delete_load':'delete_chem',{p_id:id,p_pw:pw}));
  if(!done)return;
  toast('Запись удалена');show();
}

// ---------- правка истории загрузок (админ и суперадмин, с паролем; права и пароль проверяет база) ----------
const optN=(v,sel)=>`<option value="${v}"${v===sel?' selected':''}`;
function editPanel(l){
  const ex=refs.chemicals.filter(c=>c.kind==='extra'),loc=new Date(new Date(l.ts).getTime()+tz*3600e3).toISOString();
  const t0=loc.slice(11,16),d0=l.shift_date;
  $('#ovl').innerHTML=`<div class="ov" id="bg"><section class="pn" role="dialog" aria-modal="true" aria-label="Исправить загрузку">
   <div class="ph"><div><p class="eb">Админ и суперадмин</p><h2>Исправить загрузку</h2><p class="hint">Запись от ${dmy(l.shift_date)}, ${hhmm(l.ts)}</p></div><button class="ib" id="cl" aria-label="Закрыть">✕</button></div>
   <label>Машина<select id="em">${Array.from({length:12},(_,i)=>i+1).map(m=>`${optN(m,l.machine)}>${m} · ${m<=10?'дозатор 1':'дозатор 2'}</option>`).join('')}</select></label>
   <label>Вид стирки<select id="ew">${refs.washTypes.map(w=>`${optN(w.id,l.wash_type_id)}>${esc(w.name)}</option>`).join('')}</select></label>
   <label>Вес, кг<input id="ek" type="number" min="0" step="any" inputmode="decimal" value="${+l.weight_kg}"></label>
   <div class="acc"><label>Дата смены<input id="ed" type="date" value="${d0}"></label><label>Время запуска<input id="et" type="time" value="${t0}"></label></div>
   <p class="hint">Смена начинается в ${String(st).padStart(2,'0')}:00. Время до ${String(st).padStart(2,'0')}:00 относится к ночи этой же смены.</p>
   ${ex.length?`<h3>Дополнительно, шт</h3><div class="acc">${ex.map(c=>`<label>${esc(c.name)}<input type="number" min="0" step="1" inputmode="numeric" data-x="${c.id}" value="${(l.extras||{})[c.id]||''}" placeholder="0"></label>`).join('')}</div>`:''}
   <button class="go" id="ok">Сохранить исправление</button>
   <button class="ghost danger" id="rm">Удалить запись</button></section></div>`;
  const close=()=>{$('#ovl').innerHTML='';document.onkeydown=null;};
  document.onkeydown=e=>{if(e.key==='Escape'&&!document.querySelector('form[role=dialog]'))close();};
  $('#cl').onclick=close;$('#bg').onmousedown=e=>{if(e.target.id==='bg')close();};
  $('#ok').onclick=async()=>{
    const kg=+$('#ek').value,d=$('#ed').value,t=$('#et').value;
    if(!(kg>0)){toast('Укажите вес в килограммах');return;}
    if(!d||!t){toast('Укажите дату смены и время');return;}
    if(kg>100&&!confirm('Вес '+kg+' кг. Это точно верно?'))return;
    const ex2={};document.querySelectorAll('#ovl [data-x]').forEach(i=>{if(+i.value>0)ex2[i.dataset.x]=+i.value;});
    let ts=null;
    if(d!==d0||t!==t0){                                   // время менялось: пересчитываем момент записи
      const[y,mo,da]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);
      let at=Date.UTC(y,mo-1,da,h,mi)-tz*3600e3;if(h<st)at+=864e5;     // до начала смены = следующие календарные сутки
      ts=new Date(at).toISOString();
    }
    const args={p_id:l.id,p_machine:+$('#em').value,p_wash:+$('#ew').value,p_weight:kg,p_extras:ex2,p_ts:ts};
    $('#ok').disabled=true;
    const done=await withPw('Сохранить исправление?','Машина '+args.p_machine+' · '+kg+' кг\nОтчёт пересчитается по новым цифрам.',pw=>rpcAsk('edit_load',{...args,p_pw:pw}));
    if(!done){$('#ok').disabled=false;return;}
    close();toast('Запись исправлена');show();
  };
  $('#rm').onclick=()=>{close();delRec('ld',l.id);};
}
$('#out').onclick=e=>{
  const tb=e.target.closest('[data-rt]');if(tb){tabR=tb.dataset.rt;draw();return;}
  const k=e.target.closest('#kf [data-v]');if(k){kindF=k.dataset.v;renderOps();return;}
  const b=e.target.closest('[data-ed]');if(b&&byId[b.dataset.ed]){editPanel(byId[b.dataset.ed]);return;}
  const c=e.target.closest('[data-edc]');if(c&&byCh[c.dataset.edc]){chemEdit(byCh[c.dataset.edc]);return;}
  const d=e.target.closest('[data-del]');if(d)delRec(d.dataset.k,d.dataset.del);
};

const mr=n=>{const t=shiftToday(),d=new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7)-1+n,1)),ym=d.toISOString().slice(0,7),last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();return[ym+'-01',ym+'-'+String(last).padStart(2,'0')]};
function mark(){const a=$('#d1').value,b=$('#d2').value,t=shiftToday(),y=addDays(t,-1),w=addDays(t,-6);
  [['t',a===t&&b===t],['y',a===y&&b===y],['w',a===w&&b===t],['mo',a===mr(0)[0]&&b===mr(0)[1]],['pm',a===mr(-1)[0]&&b===mr(-1)[1]]].forEach(([id,on])=>{$('#'+id).classList.toggle('on',on);$('#'+id).setAttribute('aria-pressed',on);});}
function setRange(a,b){$('#d1').value=a;$('#d2').value=b;mark();show();}
$('#d1').onchange=$('#d2').onchange=()=>{mark();show();};
$('#t').onclick=()=>setRange(shiftToday(),shiftToday());
$('#y').onclick=()=>{const d=addDays(shiftToday(),-1);setRange(d,d)};
$('#mo').onclick=()=>setRange(...mr(0));
$('#pm').onclick=()=>setRange(...mr(-1));
$('#w').onclick=()=>setRange(addDays(shiftToday(),-6),shiftToday());

(async()=>{
  const ses=await need();if(!ses)return;
  const {data:pr}=await sb.from('profiles').select('role').eq('id',ses.user.id).maybeSingle();const isSuper=pr?.role==='superadmin';
  const {data:fa}=await sb.from('form_access').select('role').eq('user_id',ses.user.id);
  canEdit=isSuper||(fa||[]).some(r=>r.role==='admin');const _tocl=document.getElementById('tocl');if(_tocl)_tocl.hidden=!canEdit;
  const {data:ok}=await sb.rpc('can_report');
  if(!ok){$('#out').innerHTML='<p>Нет доступа к отчёту. Обратитесь к администратору.</p>';return;}
  const [s,c,w,r]=await Promise.all([sb.from('settings').select('*'),sb.from('chemicals').select('*').order('sort'),sb.from('wash_types').select('id,name').order('sort'),sb.from('recipes').select('*')]);
  const g=k=>{const x=(s.data||[]).find(y=>y.key===k);return x?+x.value:null};
  tz=g('tz_offset')??5;st=g('shift_start')??6;
  refs={water:g('water_l')??55,washTypes:w.data||[],chemicals:c.data||[],recipes:r.data||[]};
  setRange(shiftToday(),shiftToday());
})();
</script></body></html>
