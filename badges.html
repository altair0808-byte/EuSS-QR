<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бейджи QR — EuSS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2aa3b5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EuSS">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css">
<style>
.bt{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0 1rem}
.bt .mini,.bt .go{width:auto;margin:0;padding:0 1rem;min-height:2.75rem}
.rw{display:flex;align-items:center;gap:.75rem;padding:.7rem .8rem;margin-top:.5rem;border:1px solid var(--ln,#d5e1e4);border-radius:.5rem;background:#fff}
.rw .nm{flex:1;min-width:0}.rw .nm b{display:block;overflow-wrap:anywhere}.rw .nm small{color:#566}
.rw input[type=checkbox]{width:1.4rem;height:1.4rem;flex:none}
.rw .st{font-size:.75rem;font-weight:800;padding:.2rem .5rem;border-radius:99px;background:#eef3f4;color:#566;white-space:nowrap}
.rw .st.ok{background:#e3f6ea;color:#176b3a}
.rw .mini{width:auto;min-height:2.5rem;margin:0;padding:0 .8rem;white-space:nowrap}
#sheet{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0!important;padding:0!important;background:#fff!important;width:auto!important;min-height:0!important}
  body>*:not(#sheet){display:none!important}
  #sheet{display:block!important}
  /* 9 бейджей на лист: каждая страница отдельный блок 180x270 мм, сдвигов между страницами нет */
  .bpg{display:grid;grid-template-columns:repeat(3,60mm);grid-auto-rows:90mm;width:180mm;height:270mm;margin:0 auto;break-after:page;page-break-after:always;overflow:hidden}
  .bpg:last-child{break-after:auto;page-break-after:auto}
  .bcell{width:60mm;height:90mm;padding:1mm;box-sizing:border-box}
  .bdg{width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative;
    background:#fff;border:.25mm solid #9fc3ca;border-radius:3.5mm;color:#002f3e;font-family:Manrope,Arial,sans-serif}
  .bdg>*{flex:none}
  .bdg .b-top{margin-top:4mm;height:9mm;display:flex;align-items:center;justify-content:center}
  .bdg .b-top img{height:9mm;width:auto;display:block}
  .bdg .b-tag{margin-top:2.2mm;display:flex;align-items:center;gap:1.6mm;font:800 2.2mm/1 Manrope,Arial,sans-serif;letter-spacing:.3mm;text-transform:uppercase;color:#0097a8}
  .bdg .b-tag::before,.bdg .b-tag::after{content:"";width:6mm;height:.3mm;background:#9fd3da}
  .bdg .b-qf{margin-top:2.4mm;width:40mm;height:40mm;box-sizing:border-box;padding:3mm;background:#fff;border:.35mm solid #0097a8;border-radius:3mm}
  .bdg .b-qf img{display:block;width:100%;height:100%}
  .bdg .b-nm{margin-top:3mm;padding:0 3mm;max-height:12.5mm;overflow:hidden;text-align:center;font-weight:800;line-height:1.12;overflow-wrap:anywhere;text-wrap:balance}
  .bdg .b-lg{margin-top:1.3mm;padding:.7mm 2.4mm;border-radius:99mm;background:#e8f3f3;font:700 2.6mm/1.1 Manrope,Arial,sans-serif;color:#4f6f79;max-width:52mm;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .bdg .b-ft{margin-top:auto;width:100%;height:6.5mm;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#00808e,#0097a8);color:#fff;font:700 2.2mm/1 Manrope,Arial,sans-serif;letter-spacing:.15mm}
}
</style></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Бейджи QR</span></a><nav class="nav"><a class="btn s" href="admin.html">Пользователи</a><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main class="wide">
<div class="top"><h1>Бейджи для входа по QR</h1></div>
<p class="hint">У каждого сотрудника свой QR-код. Сотрудник нажимает на экране входа значок QR и подносит бейдж к камере. Новый QR отключает старый. Админам и суперадмину вход по QR недоступен, они в списке не показаны.</p>
<p class="hint" id="warn" hidden></p>
<div class="bt">
  <button class="mini" id="mkAll" type="button">Создать QR всем, у кого его нет</button>
  <button class="go" id="prSel" type="button">Печать выбранных</button>
  <button class="mini" id="selAll" type="button">Выбрать всех с QR</button>
</div>
<label>Поиск<input id="q2" type="search" placeholder="Имя или логин" autocomplete="off"></label>
<div id="list"><p class="hint">Загрузка…</p></div>
</main>
<div id="sheet" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let people = [], badges = {}, picked = new Set();

const newCode = () => {
  const a = new Uint8Array(24); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');   // 32 символа
};

async function load() {
  // list_accounts (stage11.sql) заодно добавляет в people тех, кого создали вручную в Supabase; без неё читаем people напрямую
  const acc = await sb.rpc('list_accounts');
  const [{ data: ppl, error: pe }, { data: sup }, { data: adm }, { data: bg, error: be }] = await Promise.all([
    acc.error ? sb.from('people').select('id,email,full_name').order('created_at') : Promise.resolve({ data: (acc.data || []).map(a => ({ id: a.acc_id, email: a.acc_email, full_name: a.acc_name })) }),
    sb.from('profiles').select('id').eq('role', 'superadmin'),
    sb.from('form_access').select('user_id').eq('role', 'admin'),
    sb.from('badges').select('user_id,code,created_at,last_used_at')]);
  if (be) { $('#warn').hidden = false; $('#warn').textContent = 'Сначала выполните stage20.sql в Supabase (SQL Editor). Ошибка: ' + be.message; }
  if (pe && !be) { $('#warn').hidden = false; $('#warn').textContent = 'Не удалось загрузить список сотрудников: ' + pe.message; }
  const skip = new Set([...(sup || []).map(x => x.id), ...(adm || []).map(x => x.user_id)]);
  people = (ppl || []).filter(p => p.email && !skip.has(p.id));
  badges = {}; (bg || []).forEach(b => badges[b.user_id] = b);
  [...picked].forEach(id => { if (!badges[id]) picked.delete(id); });
  draw();
}

const fmtD = t => t ? new Date(t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
function draw() {
  const k = $('#q2').value.trim().toLowerCase();
  const list = people.filter(p => !k || (p.full_name || '').toLowerCase().includes(k) || showLogin(p.email).toLowerCase().includes(k));
  $('#list').innerHTML = list.length ? list.map(p => {
    const b = badges[p.id];
    return `<div class="rw"><input type="checkbox" data-pick="${p.id}" ${b ? '' : 'disabled'} ${picked.has(p.id) ? 'checked' : ''} aria-label="Выбрать для печати">
      <div class="nm"><b>${esc(p.full_name || showLogin(p.email))}</b><small>${esc(showLogin(p.email))}${b && b.last_used_at ? ' · вход по QR: ' + fmtD(b.last_used_at) : ''}</small></div>
      <span class="st ${b ? 'ok' : ''}">${b ? 'QR есть' : 'нет QR'}</span>
      <button class="mini" data-mk="${p.id}" type="button">${b ? 'Новый QR' : 'Создать QR'}</button>
      ${b ? `<button class="mini" data-rv="${p.id}" type="button">Отозвать</button>` : ''}</div>`;
  }).join('') : '<p class="hint">' + (k ? 'Никого не найдено' : 'Сотрудников нет: все аккаунты — админы или суперадмин. Создайте сотрудника на странице «Пользователи».') + '</p>';
  document.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick); });
  document.querySelectorAll('[data-mk]').forEach(b => b.onclick = async () => {
    const id = b.dataset.mk;
    if (badges[id] && !confirm('Старый бейдж перестанет работать. Создать новый QR?')) return;
    b.disabled = true; const { error } = await sb.from('badges').upsert({ user_id: id, code: newCode(), created_at: new Date().toISOString(), last_used_at: null });
    if (error) { toast('Не удалось: ' + error.message); b.disabled = false; return; }
    toast('QR создан'); load();
  });
  document.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    if (!confirm('Отозвать QR? Бейдж перестанет работать.')) return;
    const { error } = await sb.from('badges').delete().eq('user_id', b.dataset.rv);
    if (error) { toast('Не удалось: ' + error.message); return; }
    picked.delete(b.dataset.rv); toast('QR отозван'); load();
  });
}
$('#q2').oninput = draw;

$('#mkAll').onclick = async () => {
  const todo = people.filter(p => !badges[p.id]);
  if (!todo.length) { toast('У всех уже есть QR'); return; }
  if (!confirm('Создать QR для ' + todo.length + ' сотрудников?')) return;
  const { error } = await sb.from('badges').insert(todo.map(p => ({ user_id: p.id, code: newCode() })));
  if (error) { toast('Не удалось: ' + error.message); return; }
  toast('Создано: ' + todo.length); load();
};
$('#selAll').onclick = () => { people.forEach(p => { if (badges[p.id]) picked.add(p.id); }); draw(); };

// QR -> векторная картинка (SVG): резкая при печати. Библиотека рисует в canvas с неравным полем справа и снизу,
// поэтому берём только сам код и кладём его в рамку ровно по центру.
function qrSvg(text) {
  const h = document.createElement('div');
  new QRCode(h, { text, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.Q });
  const cv = h.querySelector('canvas'); if (!cv) return '';
  const W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data;
  const dark = (x, y) => { const i = (y * W + x) * 4; return d[i + 3] > 128 && d[i] < 128; };
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (dark(x, y)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return '';
  let run = 0; while (x0 + run < W && dark(x0 + run, y0)) run++;       // верхняя кромка угловой метки = 7 модулей
  const m = run / 7, n = Math.round((x1 - x0 + 1) / m);
  let path = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (dark(Math.min(W - 1, Math.round(x0 + (c + .5) * m)), Math.min(H - 1, Math.round(y0 + (r + .5) * m)))) path += `M${c} ${r}h1v1h-1z`;
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${path}" fill="#000"/></svg>`);
}
const nameMm = t => t.length <= 14 ? 5.4 : t.length <= 22 ? 4.6 : t.length <= 30 ? 4 : 3.5;
const badgeHtml = (p, qr) => { const nm = p.full_name || showLogin(p.email);
  return `<div class="bcell"><div class="bdg"><div class="b-top"><img src="euss-logo.png" alt=""></div><div class="b-tag">Пропуск · вход по QR</div>
    <div class="b-qf"><img src="${qr}" alt=""></div><div class="b-nm" style="font-size:${nameMm(nm)}mm">${esc(nm)}</div><div class="b-lg">${esc(showLogin(p.email))}</div>
    <div class="b-ft">Поднесите к камере на экране входа</div></div></div>`; };

$('#prSel').onclick = async () => {
  const sel = people.filter(p => picked.has(p.id) && badges[p.id]);
  if (!sel.length) { toast('Отметьте сотрудников галочкой'); return; }
  const cards = sel.map(p => badgeHtml(p, qrSvg('euss-badge:' + badges[p.id].code))), pages = [];
  for (let i = 0; i < cards.length; i += 9) pages.push(`<div class="bpg">${cards.slice(i, i + 9).join('')}</div>`);
  const sh = $('#sheet'); sh.innerHTML = pages.join('');
  try { if (document.fonts) await document.fonts.ready; await Promise.all([...sh.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : 0)); } catch (e) {}
  window.print();   // печать только после того, как картинки и шрифт готовы: раньше лист мог уехать
};

(async () => {
  const s = await need(); if (!s) return;
  const { data: pr } = await sb.from('profiles').select('role').eq('id', s.user.id).maybeSingle();
  if (!pr || pr.role !== 'superadmin') { location.replace('index.html'); return; }
  load();
})();
</script><script src="compat.js"></script>
<script src="idle.js"></script>
<script src="pwa.js"></script>
</body></html>
