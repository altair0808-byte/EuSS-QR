<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бланк — EuSS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2aa3b5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EuSS">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Бланки</span></a><nav class="nav"><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main id="app"><p class="hint">Загрузка…</p></main>
<script src="lite.js"></script>
<script src="kiosk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="num.js"></script><script src="app.js"></script><script src="feedback.js"></script><script src="leftover.js"></script><script src="wm.js"></script>
<script>
(async () => {
  const ses = await need(); if (!ses) return;
  const app = $('#app');
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const mw = n => n % 10 === 1 && n % 100 !== 11 ? 'машина' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'машины' : 'машин');
  const { data: f } = await sb.from('forms').select('*').eq('slug', q.get('f')).maybeSingle();
  if (!f) {
    app.innerHTML = '<div class="top"><h1>Бланк недоступен</h1><p class="hint">Проверьте ссылку или обратитесь к администратору.</p></div><a class="btn p" href="index.html">На панель смены</a>';
    return;
  }
  document.title = f.name + ' — EuSS';
  const kind = { laundry_load: 'Загрузка белья', laundry_chem: 'Замена химии' }[f.type] || 'Бланк';
  document.body.classList.add(f.type === 'laundry_chem' ? 'k-chem' : 'k-load');
  const bannerHtml = f.type === 'laundry_chem' ? '<div class="kind"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h5v3h-5z"/><path d="M8.5 5.5h7l2 3.2v10.8a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V8.7z"/><rect x="8.5" y="12" width="7" height="5" rx="1"/></svg> Замена химии</div>' : f.type === 'laundry_load' ? '<div class="kind"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><circle cx="12" cy="13.5" r="4.6"/><path d="M8.7 13.5c1.1-1 2.2 1 3.3 0s2.2 1 3.3 0"/><path d="M7 6h.01M10 6h.01M14 6h4"/></svg> Загрузка белья</div>' : '';
  const head = `${bannerHtml}<div class="top"><p class="eb">${kind}</p><h1>${esc(f.name)}</h1></div>`;
  const washList = w => w || [];
  const toTop = () => window.scrollTo({ top: 0 });
  const smooth = () => matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth';

  async function laundryLoad() {
    app.classList.add('wide');
    const [{ data: wt }, { data: ex }] = await Promise.all([
      sb.from('wash_types').select('id,name,minutes').order('sort'),
      sb.from('chemicals').select('id,name,per_unit,per_unit_unit').eq('kind','extra').order('sort')
    ]);
    const washTypes = washList(wt), extras = ex || [];
    const { data: set } = await sb.from('settings').select('*');
    const sv = k => { const r = (set || []).find(x => x.key === k); return r ? +r.value : null; };
    const tzH = sv('tz_offset') ?? 5, stH = sv('shift_start') ?? 6;
    const state = new Map();
    let lastIds = null, tab = 'all', busy = new Map();
    let names = {};
    try { const n = await sb.rpc('staff_names'); names = Object.fromEntries(((n && n.data) || []).map(x => [x.id, x.name])); } catch (e) {}
    const hhmm = t => new Date(t + tzH * 3600e3).toISOString().slice(11, 16);
    async function loadBusy() {                       // что сейчас стирается: видно ВСЕМ сотрудникам (machine_status из stage14.sql)
      const sd = new Date(Date.now() + (tzH - stH) * 3600e3), d0 = sd.toISOString().slice(0, 10), d1 = new Date(sd.getTime() - 864e5).toISOString().slice(0, 10);
      const [r0, r1] = await Promise.all([sb.rpc('machine_status', { d: d0 }), sb.rpc('machine_status', { d: d1 })]);
      let data;
      if (!r0.error) data = [...(r1.data || []), ...(r0.data || [])];
      else { const since = new Date(Date.now() - 864e5).toISOString(); data = (await sb.from('loads').select('machine,ts,wash_type_id,weight_kg,finished_at,created_by').gte('ts', since).order('ts')).data || []; }   // до stage14.sql: только свои
      data.sort((a, b) => new Date(a.ts) - new Date(b.ts));
      const now = Date.now(), last = {}; busy = new Map();
      data.forEach(l => { last[l.machine] = l; });
      Object.values(last).forEach(l => {
        const w = washTypes.find(x => x.id === l.wash_type_id), t0 = new Date(l.ts).getTime(), tot = (w?.minutes || 0) * 60000, end = t0 + tot;
        if (!l.finished_at && now < end) busy.set(l.machine, { left: Math.max(1, Math.ceil((end - now) / 60000)), name: w?.name || 'Стирка', kg: +l.weight_kg || 0,
          start: hhmm(t0), end: hhmm(end), pc: tot > 0 ? Math.min(100, Math.max(0, (now - t0) / tot * 100)) : 0, who: names[l.created_by] || '' });
      });
    }
    { const st = document.createElement('style'); st.textContent = '.bi{margin:.75rem 0;padding:.85rem 1rem;border:1px solid var(--ac);border-radius:1rem;background:#f1f8f9;background:color-mix(in oklab,var(--ac) 7%,#fff)}.bi .bt{display:flex;justify-content:space-between;gap:.5rem;font-size:1.05rem}.bi .bt span{font-weight:800;color:var(--ac)}.bi .bp{height:.65rem;margin:.6rem 0 .4rem;border-radius:99px;background:rgb(0 0 0/.08);overflow:hidden}.bi .bp i{display:block;height:100%;border-radius:99px;background:var(--ac)}.bi .bs{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem;opacity:.8}.bi .bs b{display:block;font-size:1rem}.bi p{margin:.5rem 0 0;font-size:.8rem;opacity:.8}'; document.head.appendChild(st); }
    const busyInfo = m => { const b = busy.get(m); if (!b) return ''; return `<div class="bi"><div class="bt"><b><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><circle cx="12" cy="13.5" r="4.6"/><path d="M8.7 13.5c1.1-1 2.2 1 3.3 0s2.2 1 3.3 0"/><path d="M7 6h.01M10 6h.01M14 6h4"/></svg> Сейчас в машине: ${esc(b.name)}</b><span>${fmt(b.kg)} кг</span></div><div class="bp"><i style="width:${b.pc.toFixed(0)}%"></i></div><div class="bs"><span>Начало<b>${b.start}</b></span><span>Осталось<b>${b.left} мин</b></span><span>Конец<b>${b.end}</b></span></div>${b.who ? `<p>Загрузил: ${esc(b.who)}</p>` : ''}</div>`; };
    const busyLine = m => { const b = busy.get(m); return `${esc(b.name)} · ${fmt(b.kg)} кг · ${b.left} мин`; };
    if (!document.getElementById('busy-css')) { const st = document.createElement('style'); st.id = 'busy-css';
      st.textContent = '.on .dr::after{content:"";position:absolute;top:-.45rem;right:-.45rem;bottom:-.45rem;left:-.45rem;border:.22rem solid transparent;border-top-color:var(--ac);border-radius:99px;animation:bsp 3.2s linear infinite}.on .dr{animation:bsh .35s linear infinite}@keyframes bsp{to{transform:rotate(360deg)}}@keyframes bsh{25%{transform:translate(.6px,-.4px)}75%{transform:translate(-.5px,.4px)}}@media(prefers-reduced-motion:reduce){.on .dr,.on .dr::after{animation:none}}';
      document.head.appendChild(st); }
    { const st2 = document.createElement('style'); st2.textContent = '.mv .wm{max-width:min(82%,8.5rem)}'; document.head.appendChild(st2); }
    await loadBusy();
    setInterval(async () => { if (!document.hidden && document.querySelector('.mgr') && !document.querySelector('#ovl .ov')) { await loadBusy(); render(); } }, window.pollMs ? pollMs(30000) : 30000);
    const hh = n => String(n).padStart(2, '0');
    const fmt = n => Num.fmt(n);
    const dos = m => m <= 10 ? 'Основной дозатор · 1–10' : 'Отдельный дозатор · 11–12';
    const wname = id => washTypes.find(x => x.id === +id)?.name || 'Не выбран';

    function render() {
      const vis = Array.from({ length: 12 }, (_, i) => i + 1).filter(m => tab === 'all' || (tab === 'main' ? m <= 10 : m >= 11));
      const kg = [...state.values()].reduce((a, v) => a + (+v.weight_kg || 0), 0);
      const nMain = [...state.keys()].filter(m => m <= 10).length, nExtra = state.size - nMain;
      const T = [['all', 'Все машины'], ['main', 'Дозатор 1 · 1–10'], ['extra', 'Дозатор 2 · 11–12']];
      const M = [['Настроено', state.size + ' / 12', '', 'машин в этой отправке', ''], ['Общий вес', fmt(kg), 'кг', 'по настроенным', 'm2'], ['Дозатор 1', nMain + ' / 10', '', 'машины 1–10', 'm3'], ['Дозатор 2', nExtra + ' / 2', '', 'машины 11–12', 'm4']];
      app.innerHTML = `
        ${bannerHtml}<div class="top"><p class="eb">Загрузка белья</p><h1>${esc(f.name)}</h1></div>
        <section class="mg" aria-label="Итоги">${M.map(([l, v, u, n, c]) => `<article class="m ${c}"><p class="l">${l}</p><p class="v">${v} ${u ? `<small>${u}</small>` : ''}</p><p class="n">${n}</p></article>`).join('')}</section>
        <div class="sh"><div><h2>Стиральные машины</h2><p>Выберите машину, задайте вид стирки и вес, затем проверьте всё и отправьте</p></div>
          <div class="seg" role="tablist">${T.map(([id, l]) => `<button role="tab" aria-selected="${tab === id}" class="${tab === id ? 'on' : ''}" data-t="${id}">${l}</button>`).join('')}</div></div>
        <div class="mgr">${vis.map(m => { const v = state.get(m); const b = busy.get(m); return `<article class="mc ${v ? 'set' : ''} ${b ? 'on' : ''}"><button class="mv" data-m="${m}" aria-label="Машина ${m}">${WM.html({n:m,on:!!b,left:b?b.left:null,set:!!v,scr:v?'✓':undefined})}<span class="st">${v ? esc(wname(v.wash_type_id)) + ' · ' + fmt(v.weight_kg) + ' кг' : b ? busyLine(m) : 'Не настроена'}</span></button><button class="btn s ${v ? '' : 'p'}" data-m="${m}">${v ? 'Изменить' : 'Настроить'} →</button></article>`; }).join('')}</div>
        <div class="bar"><button class="go" id="review">Проверить всё${state.size ? ' · ' + state.size + ' ' + mw(state.size) : ''}</button>
        <button class="ghost" id="undo" hidden>Отменить последнюю запись</button></div><div id="ovl"></div>`;
      document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
      document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => panel(+b.dataset.m));
      $('#review').onclick = () => state.size ? showReview() : toast('Сначала настройте хотя бы одну машину');
      const show = undoBtn('loads');
      if (lastIds) show(lastIds);
    }

    function panel(machine) {
      const old = state.get(machine) || { wash_type_id: null, weight_kg: 25, extras: {} };
      let w = old.wash_type_id;
      $('#ovl').innerHTML = `<div class="ov" id="bg"><section class="pn" role="dialog" aria-modal="true" aria-label="Машина ${machine}">
        <div class="ph"><div><p class="eb">${state.has(machine) ? 'Настроена' : 'Новая настройка'}</p><h2>Машина ${hh(machine)}</h2><p class="hint">${dos(machine)}</p></div><button class="ib" id="cl" aria-label="Закрыть">✕</button></div>
        ${busyInfo(machine)}
        <h3>Вид стирки</h3>
        <div class="list" id="wg">${washTypes.map(x => `<button data-v="${x.id}" class="${+old.wash_type_id === x.id ? 'on' : ''}"><span>${esc(x.name)}</span>${x.minutes ? `<small>${x.minutes} мин</small>` : ''}</button>`).join('')}</div>
        <h3>Вес, кг</h3>
        <div class="kg"><button id="mi" aria-label="Меньше">−</button><input id="kg" type="number" min="0" step="any" inputmode="decimal" value="${old.weight_kg}"><button id="pl" aria-label="Больше">+</button></div>
        ${extras.length ? `<h3>Дополнительно, количество (шт)</h3><div class="acc">${extras.map(x => `<label>${esc(x.name)}<input type="number" min="0" step="1" inputmode="numeric" data-x="${x.id}" data-u="${+x.per_unit || 0}" data-un="${x.per_unit_unit === 'g' ? 'г' : 'мл'}" placeholder="0" value="${old.extras[x.id] || ''}"><small class="hint" style="display:block;margin:.2rem 0 0;font-weight:500">1 шт = ${+x.per_unit || 0} ${x.per_unit_unit === 'g' ? 'г' : 'мл'}</small></label>`).join('')}</div>` : ''}
        <button class="go" id="ok">Готово для машины ${machine}</button>
        ${state.has(machine) ? '<button class="ghost danger" id="rm">Убрать из отправки</button>' : ''}</section></div>`;
      const close = () => { $('#ovl').innerHTML = ''; document.onkeydown = null; };
      document.onkeydown = e => { if (e.key === 'Escape') close(); };
      $('#cl').onclick = close; $('#bg').onmousedown = e => { if (e.target.id === 'bg') close(); };
      pick('#wg', v => { w = +v; });
      document.querySelectorAll('[data-x]').forEach(i => i.oninput = () => { const n = +i.value || 0, u = +i.dataset.u; i.nextElementSibling.textContent = n > 0 ? `${n} шт × ${u} = ${fmt(n * u)} ${i.dataset.un}` : `1 шт = ${u} ${i.dataset.un}`; });
      $('#mi').onclick = () => $('#kg').value = Math.max(0, (+$('#kg').value || 0) - 1);
      $('#pl').onclick = () => $('#kg').value = (+$('#kg').value || 0) + 1;
      if ($('#rm')) $('#rm').onclick = () => { state.delete(machine); close(); render(); toast(`Машина ${machine} убрана`); };
      $('#ok').onclick = () => {
        if (!w) { toast('Выберите вид стирки'); return; }
        const kgv = +$('#kg').value;
        if (!(kgv > 0)) { toast('Укажите вес белья в килограммах'); return; }
        if (kgv > 100 && !confirm('Вес ' + kgv + ' кг. Это точно верно?')) return;
        const e2 = {}; document.querySelectorAll('[data-x]').forEach(i => { if (+i.value > 0) e2[i.dataset.x] = +i.value; });
        state.set(machine, { wash_type_id: w, weight_kg: kgv, extras: e2 });
        close(); render(); toast(`Машина ${machine} настроена`);
      };
    }

    function showReview() {
      const rows = [...state.entries()].sort((a, b) => a[0] - b[0]);
      app.innerHTML = `${bannerHtml}<div class="top"><p class="eb">Загрузка белья</p><h1>Проверка перед отправкой</h1><p class="hint">Пока не нажата кнопка внизу, записи в базу не отправлены.</p></div>
        <div class="cards">${rows.map(([m, v]) => {
          const chem = Object.entries(v.extras).map(([id, qty]) => {
            const c = extras.find(x => String(x.id) === String(id));
            return c ? `${esc(c.name)}: ${qty} шт` : '';
          }).filter(Boolean).join(', ');
          return `<div class="card"><div><span class="nm">Машина ${m} · ${m <= 10 ? 'основной дозатор' : 'отдельный дозатор'}</span><small>${esc(wname(v.wash_type_id))} · ${v.weight_kg} кг${chem ? ' · ' + chem : ''}</small></div><button class="mini" data-edit="${m}">Изменить</button></div>`;
        }).join('')}</div>
        <div class="box"><h2>Когда стирки были запущены</h2><p class="hint">По умолчанию — сейчас. Если заполняете бланк позже, укажите время запуска: от него зависит, к дню или к ночи и к какой смене попадёт запись.</p>
          <div class="seg" id="tm"><button data-v="now" class="on">Сейчас</button><button data-v="set">Указать время</button></div>
          <div id="tw" hidden><label>Время запуска (в этой смене)<input id="tt" type="time"></label></div></div>
        <div class="box"><b>Итого машин: ${rows.length}</b><p class="hint" style="margin:.25rem 0 0">1–10: ${rows.filter(([m]) => m <= 10).length}; 11–12: ${rows.filter(([m]) => m >= 11).length}.</p></div>
        <div class="bar"><button class="go" id="confirm">Все верно — отправить ${rows.length} ${mw(rows.length)}</button><button class="ghost" id="back">← Вернуться к машинам</button></div><div id="ovl"></div>`;
      toTop();
      app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { render(); panel(+b.dataset.edit); });
      $('#back').onclick = () => { render(); toTop(); };
      let when = 'now';
      pick('#tm', v => { when = v; $('#tw').hidden = v === 'now'; });
      const startedAt = () => {                                   // время запуска -> момент времени внутри текущей смены
        if (when === 'now') return { ts: null };
        const t = $('#tt').value; if (!t) return { err: 'Укажите время запуска' };
        const [h, mi] = t.split(':').map(Number);
        const sd = new Date(Date.now() + (tzH - stH) * 3600e3).toISOString().slice(0, 10).split('-').map(Number);
        const start = Date.UTC(sd[0], sd[1] - 1, sd[2], stH) - tzH * 3600e3;
        let at = Date.UTC(sd[0], sd[1] - 1, sd[2], h, mi) - tzH * 3600e3; if (h < stH) at += 864e5;
        if (at > Date.now() + 60e3) return { err: 'Это время ещё не наступило' };
        if (at < start) return { err: 'Это время раньше начала текущей смены' };
        return { ts: new Date(at).toISOString() };
      };
      $('#confirm').onclick = async () => {
        const w = startedAt(); if (w.err) { toast(w.err); return; }
        const payload = rows.map(([m, v]) => ({ form_id: f.id, machine: m, wash_type_id: +v.wash_type_id, weight_kg: +v.weight_kg, extras: v.extras, ...(w.ts ? { ts: w.ts } : {}) }));
        $('#confirm').disabled = true;
        let data, error; try { ({ data, error } = await sb.from('loads').insert(payload).select('id,machine')); } catch (x) { error = x; }
        if (!error && (!data || !data.length)) error = { code: '42501', message: 'row-level security' };   // база не вернула записи: прав нет
        if (error) { Fb.err(error); $('#confirm').disabled = false; return; }
        Fb.ok(`Отправлено: ${data.length} ${mw(data.length)}`);
        lastIds = data.map(x => x.id); state.clear(); await loadBusy(); render(); toTop();
      };
    }

    render();
  }

  // ---------- справочник химии: карточки с фото ----------
  const fmt = n => Num.fmt(+n || 0);                // без округления: 0,175 → «0,175», 0,350 → «0,35»
  const fmtC = fmt;                                  // пересчёт «≈» (литры ↔ кг по плотности) тоже без округления до сотых
  const hue = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
  const safeUrl = u => /^https?:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim().replace(/^http:\/\//i, 'https://') : '';
  // картинка химиката; если ссылки нет или фото не загрузилось, видна цветная буква
  const chemImg = (x, cls = '') => `<span class="ci ${cls}" style="--h:${hue(x.name)}"><span class="lt"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h5v3h-5z"/><path d="M8.5 5.5h7l2 3.2v10.8a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V8.7z"/><rect x="8.5" y="12" width="7" height="5" rx="1"/></svg></span>${safeUrl(x.image_url) ? `<img src="${esc(safeUrl(x.image_url))}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</span>`;
  const imgFallback = root => root.querySelectorAll('.ci img').forEach(i => { i.onerror = () => i.remove(); });
  const sizeTxt = x => { const p = []; if (+x.bottle_l > 0) p.push(fmt(+x.bottle_l) + ' л'); if (+x.bottle_kg > 0) p.push(fmt(+x.bottle_kg) + ' кг'); return p.length ? 'Бутыль ' + p.join(' · ') : 'Размер бутыли не задан'; };

  // добавить или изменить химикат (кнопки видны только суперадмину; права дополнительно закрыты в базе)
  function chemPanel(chems, cur, onDone) {
    const nv = v => v == null ? '' : v;
    $('#ovl').innerHTML = `<div class="ov" id="bg"><section class="pn" role="dialog" aria-modal="true" aria-label="${cur ? 'Изменить химикат' : 'Новый химикат'}">
      <div class="ph"><div><p class="eb">Справочник химии · суперадмин</p><h2>${cur ? 'Изменить химикат' : 'Новый химикат'}</h2></div><button class="ib" id="cl" aria-label="Закрыть">✕</button></div>
      <div id="pvw"></div>
      <label>Название<input id="cn" autocomplete="off" value="${esc(cur ? cur.name : '')}"></label>
      <label>Ссылка на фото<input id="ci" type="url" inputmode="url" autocomplete="off" placeholder="https://…" value="${esc(cur ? cur.image_url : '')}"></label>
      <p class="hint">Вставьте прямую ссылку на картинку (начинается с https://). Без фото будет цветная буква.</p>
      <div class="acc"><label>1 бутыль = литров<input id="cl2" type="number" min="0" step="any" inputmode="decimal" value="${nv(cur && cur.bottle_l)}"></label><label>1 бутыль = кг<input id="ckg" type="number" min="0" step="any" inputmode="decimal" value="${nv(cur && cur.bottle_kg)}"></label></div>
      <button class="go" id="ok">${cur ? 'Сохранить' : 'Добавить химикат'}</button></section></div>`;
    const prev = () => { $('#pvw').innerHTML = `<div class="pvc">${chemImg({ name: $('#cn').value || '?', image_url: $('#ci').value }, 'pv')}</div>`; imgFallback($('#pvw')); };
    prev();
    $('#cn').oninput = prev; $('#ci').oninput = prev;
    const close = () => { $('#ovl').innerHTML = ''; document.onkeydown = null; };
    document.onkeydown = e => { if (e.key === 'Escape') close(); };
    $('#cl').onclick = close; $('#bg').onmousedown = e => { if (e.target.id === 'bg') close(); };
    const num = v => v === '' ? null : +v;
    $('#ok').onclick = async () => {
      const name = $('#cn').value.trim(), url = $('#ci').value.trim();
      if (!name) { toast('Укажите название'); return; }
      if (url && !safeUrl(url)) { toast('Ссылка на фото должна начинаться с http:// или https://'); return; }
      if (chems.some(x => x.name.toLowerCase() === name.toLowerCase() && (!cur || x.id !== cur.id))) { toast('Такой химикат уже есть'); return; }
      const row = { name, image_url: url || null, bottle_l: num($('#cl2').value), bottle_kg: num($('#ckg').value) };
      $('#ok').disabled = true;
      if (cur) {
        const { data, error } = await sb.from('chemicals').update(row).eq('id', cur.id).select('id');
        if (error || !data || !data.length) { toast('Не сохранено: ' + (error ? error.message : 'нет прав или не выполнен stage5.sql')); $('#ok').disabled = false; return; }
        close(); toast('Химикат обновлён'); onDone(cur.id); return;
      }
      row.kind = 'main'; row.sort = Math.max(0, ...chems.map(x => x.sort || 0)) + 1;
      const { data, error } = await sb.from('chemicals').insert(row).select('id').single();
      if (error) { toast('Не сохранено: ' + error.message); $('#ok').disabled = false; return; }
      const { data: ws } = await sb.from('wash_types').select('id');
      if (ws && ws.length) await sb.from('recipes').insert(ws.map(w => ({ wash_type_id: w.id, chemical_id: data.id, ml_per_l: 0 })));
      close(); toast('Химикат добавлен, задайте рецепты в настройках'); onDone(data.id);
    };
  }

  async function laundryChem(lastId, preChem, preG) {
    const [{ data: ch }, { data: pr }] = await Promise.all([
      sb.from('chemicals').select('*').order('sort'),
      sb.from('profiles').select('role').eq('id', ses.user.id).maybeSingle()
    ]);
    const chems = (ch || []).filter(x => x.kind === 'main');          // Ваниш, Ленор, Порошок здесь не нужны
    const { data: setC } = await sb.from('settings').select('*');
    const svC = k => { const r = (setC || []).find(x => x.key === k); return r ? +r.value : null; };
    const tzH = svC('tz_offset') ?? 5, stH = svC('shift_start') ?? 6;
    const lo = await Leftover.fetch();                                  // остатки в запасе (после stage6.sql)
    const canConn = true;   // права окончательно проверяет база (can_fill_chem)
    const isSuper = pr?.role === 'superadmin';
    const groups = [['1_10', 'Основной дозатор', 'машины 1–10', '1–10'], ['11_12', 'Отдельный дозатор', 'машины 11–12', '11–12']];
    let g = preG || null, c = preChem ? String(preChem) : null, mode = 'empty', unit = 'kg';
    app.innerHTML = head + `
      <div class="box"><h2>1 · Дозатор</h2>
        <div class="dz" id="cg">${groups.map(([v, n, s, b]) => `<button type="button" class="dzc ${g === v ? 'sel' : ''}" data-v="${v}" aria-pressed="${g === v}"><b>${b}</b><span>${n}</span><small>${s}</small></button>`).join('')}</div></div>
      <div class="box"><div class="sh2"><h2>2 · Какая химия закончилась</h2>${isSuper ? '<button type="button" class="mini opt" id="addc">+ Добавить</button>' : ''}</div>
        <div class="chg" id="chem">${chems.map(x => `<div class="cw"><button type="button" class="cc ${String(x.id) === c ? 'sel' : ''}" data-v="${x.id}" aria-pressed="${String(x.id) === c}">${chemImg(x)}<span class="cn">${esc(x.name)}</span><small>${sizeTxt(x)}</small><i class="ck" aria-hidden="true">✓</i></button>${isSuper ? `<button type="button" class="ed" data-e="${x.id}" aria-label="Изменить ${esc(x.name)}" title="Изменить"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19zM13 7l4 4"/></svg></button>` : ''}</div>`).join('') || '<p class="hint">Химия пока не добавлена.</p>'}</div></div>
      <div class="box"><h2>3 · Остаток в бутыли</h2>
        <p class="hint">Сколько осталось в снятой бутыли. Остаток запишется вместе с заменой и попадёт в запас: он виден на панели смены, там же его переливают в дозатор.</p>
        <div class="seg" id="lm"><button data-v="empty" class="on">Бутыль пустая</button><button data-v="some">Остался остаток</button></div>
        <div id="lw" hidden><div class="seg" id="lu" aria-label="Единица"><button data-v="kg" class="on">кг</button><button data-v="l">литры</button></div>
          <label>Остаток, <span id="lul">кг</span><span class="lfw"><input id="lf" type="number" min="0" step="any" inputmode="decimal" placeholder="0"><output id="lconv" class="cvo" aria-live="polite"></output></span></label><div class="fill"><i id="fb"></i></div></div>
        <p class="hint" id="lh"></p></div>
      ${lo.rows ? `<div class="box"><h2>Остатки в запасе</h2><p class="hint">Остаток из бутылей, которые сняли не пустыми. Когда выльете его в дозатор, нажмите «Перелить в дозатор» и выберите, в какой именно.</p><div id="lov">${Leftover.html(lo.rows, chems, lo.names, { can: canConn, today: new Date(Date.now() + (tzH - stH) * 3600e3).toISOString().slice(0, 10) })}</div></div>` : ''}
      <div class="bar"><button class="go" id="save">Проверить и заменить</button>
      <button class="ghost" id="undo" hidden>Отменить последнюю запись</button></div><div id="ovl"></div>`;
    imgFallback(app);
    if (lo.rows && $('#lov')) Leftover.bind($('#lov'), lo.rows, chems, lo.names, { can: canConn, today: new Date(Date.now() + (tzH - stH) * 3600e3).toISOString().slice(0, 10) }, () => laundryChem(undefined, c, g));
    const show = undoBtn('chem_changes');
    if (lastId) show(lastId);
    const cur = () => chems.find(x => String(x.id) === c);
    const sizeOf = x => x ? (unit === 'kg' ? +x.bottle_kg : +x.bottle_l) : 0;
    const U = () => unit === 'kg' ? 'кг' : 'л';
    const cvt = n => { const x = cur(); if (!x || !(+x.bottle_l > 0 && +x.bottle_kg > 0)) return ''; return unit === 'kg' ? fmtC(n * x.bottle_l / x.bottle_kg) + ' л' : fmtC(n * x.bottle_kg / x.bottle_l) + ' кг'; };
    const hint = () => {
      const x = cur(), v = $('#lf').value, size = sizeOf(x); let t = 'Бутыль будет записана как пустая.', pct = 0;
      if (mode === 'some') {
        t = 'Введите, сколько осталось в бутыли.';
        if (!x) t = 'Сначала выберите химию выше.';
        else if (!(size > 0)) t = unit === 'kg' ? 'Вес полной бутыли не задан. Введите остаток в литрах или попросите суперадмина задать вес.' : 'Объём бутыли не задан. Введите остаток в килограммах или попросите суперадмина задать объём.';
        else if (v !== '') {
          pct = Math.min(100, +v / size * 100);
          if (+v > size) t = `Больше, чем в полной бутыли (${fmt(size)} ${U()}). Проверьте.`;
          else {
            const other = unit === 'kg' ? (+x.bottle_l > 0 ? `≈ ${fmtC(+v * x.bottle_l / x.bottle_kg)} л · ` : '') : (+x.bottle_kg > 0 ? `≈ ${fmtC(+v * x.bottle_kg / x.bottle_l)} кг · ` : '');
            t = other + `${Num.fmt(pct, 1)}% полной бутыли`;
          }
        }
      }
      const stk = lo.rows && x ? Leftover.summary(lo.rows, chems).find(z => String(z.c.id) === String(x.id)) : null;
      if (stk) t += ` В запасе уже: ${Leftover.N(stk.total)} ${Leftover.U(stk.p)}.`;
      const dn = x && +x.bottle_l > 0 && +x.bottle_kg > 0 ? +x.bottle_kg / +x.bottle_l : null, nv = parseFloat(String(v).replace(',', '.'));
      $('#lconv').textContent = dn && v !== '' && isFinite(nv) ? '≈ ' + fmtC(unit === 'kg' ? nv / dn : nv * dn) + (unit === 'kg' ? ' л' : ' кг') : '';   // сразу рядом: 1 кг → 0,97 л
      $('#lh').textContent = t; $('#fb').style.width = pct + '%'; $('#lul').textContent = unit === 'kg' ? 'кг' : 'литры';
    };
    $('#cg').onclick = e => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      g = b.dataset.v;
      $('#cg').querySelectorAll('.dzc').forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b); });
    };
    $('#chem').onclick = e => {
      const ed = e.target.closest('[data-e]');
      if (ed) { chemPanel(chems, chems.find(x => String(x.id) === ed.dataset.e), id => laundryChem(undefined, id, g)); return; }
      const b = e.target.closest('.cc'); if (!b) return;
      c = b.dataset.v;
      $('#chem').querySelectorAll('.cc').forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b); });
      hint();
    };
    pick('#lm', v => { mode = v; $('#lw').hidden = v === 'empty'; hint(); });
    pick('#lu', v => { unit = v; hint(); });
    $('#lf').oninput = hint; $('#lf').onblur = () => { const n = Num.parse($('#lf').value); if (isFinite(n)) $('#lf').value = Num.plain(n); hint(); }; hint();   // ввод не округляется: 0,175 остаётся 0.175
    if ($('#addc')) $('#addc').onclick = () => chemPanel(chems, null, id => laundryChem(undefined, id, g));
    $('#save').onclick = () => {
      if (!g) { toast('Выберите дозатор'); return; }
      if (!c) { toast('Выберите, какая химия закончилась'); return; }
      const x = cur(), lf = mode === 'empty' ? '' : $('#lf').value;
      if (mode === 'some' && lf === '') { toast('Укажите остаток или выберите «Бутыль пустая»'); return; }
      if (mode === 'some' && !(sizeOf(x) > 0)) { toast(unit === 'kg' ? 'Для этой химии не задан вес бутыли: введите остаток в литрах' : 'Для этой химии не задан объём бутыли: введите остаток в килограммах'); return; }
      if (lf !== '' && +lf > sizeOf(x)) { toast('Остаток больше полной бутыли'); return; }
      const gn = groups.find(r => r[0] === g).slice(1, 3).join(' · ');
      app.innerHTML = head + `<div class="box"><h2>Проверка замены</h2>
        <div class="acc"><span>Дозатор</span><b>${gn}</b></div><div class="acc"><span>Химия</span><b class="chrow">${chemImg(x, 'sm')}${esc(x.name)}</b></div>
        <div class="acc"><span>Остаток</span><b>${lf === '' ? 'бутыль пустая' : fmt(+lf) + ' ' + U() + (cvt(+lf) ? ' · ≈ ' + cvt(+lf) : '')}</b></div></div>
        <div class="bar"><button class="go" id="confirm">Все верно — записать замену</button><button class="ghost" id="back">Изменить</button></div>`;
      imgFallback(app);
      toTop();
      $('#back').onclick = () => laundryChem(undefined, c, g);
      $('#confirm').onclick = async () => {
        $('#confirm').disabled = true;
        let data, error; try { ({ data, error } = await sb.from('chem_changes').insert({ form_id: f.id, chemical_id: +c, ...(lf === '' ? { leftover_kg: 0, leftover_l: 0 } : unit === 'kg' ? { leftover_kg: +lf } : { leftover_l: +lf }), machine_group: g }).select('id').single()); } catch (x) { error = x; }
        if (error || !data) { Fb.err(error || { code: '42501', message: 'row-level security' }); $('#confirm').disabled = false; return; }
        Fb.ok('Замена записана'); laundryChem(data.id); toTop();
      };
    };
  }

  ({ laundry_load: laundryLoad, laundry_chem: laundryChem }[f.type] || (() => app.innerHTML = head + '<p class="hint">Этот тип бланка пока не подключён.</p>'))();
})();
</script><script src="compat.js"></script>
<script src="idle.js"></script>
<script src="pwa.js"></script>
</body></html>
