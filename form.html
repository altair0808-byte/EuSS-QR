<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бланк — EuSS</title><link rel="icon" href="favicon.png" type="image/png"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hd"><div><a class="lg" href="index.html" aria-label="На панель смены"><img src="euss-logo.png" alt="EuSS"><span class="sep"></span><span class="sub">Бланки</span></a><nav class="nav"><a class="btn s" href="index.html">← Панель</a></nav></div></header>
<main id="app"><p class="hint">Загрузка…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
(async () => {
  if (!await need()) return;
  const app = $('#app');
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const mw = n => n % 10 === 1 && n % 100 !== 11 ? 'машина' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'машины' : 'машин');
  const { data: f } = await sb.from('forms').select('*').eq('slug', q.get('f')).maybeSingle();
  if (!f) {
    app.innerHTML = '<div class="top"><h1>Бланк недоступен</h1><p class="hint">Проверьте ссылку или обратитесь к администратору.</p></div><a class="btn p" href="index.html">На панель смены</a>';
    return;
  }
  document.title = f.name + ' — EuSS';
  const kind = { laundry_load: 'Загрузка белья', laundry_chem: 'Замена химии' }[f.type] || 'Бланк';
  const head = `<div class="top"><p class="eb">${kind}</p><h1>${esc(f.name)}</h1></div>`;
  const toTop = () => window.scrollTo({ top: 0 });
  const smooth = () => matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth';

  async function laundryLoad() {
    const [{ data: wt }, { data: ex }] = await Promise.all([
      sb.from('wash_types').select('id,name,minutes').order('sort'),
      sb.from('chemicals').select('id,name,per_unit,per_unit_unit').eq('kind','extra').order('sort')
    ]);
    const washTypes = wt || [], extras = ex || [];
    const state = new Map();
    let openM = null, lastIds = null;

    const group = m => m <= 10 ? '1_10' : '11_12';
    const groupName = g => g === '1_10' ? 'Машины 1–10' : 'Машины 11–12';
    const dos = m => m <= 10 ? 'основной дозатор' : 'отдельный дозатор';
    const tile = n => `<button data-m="${n}" class="${state.has(n) ? 'on' : ''}${n === openM ? ' cur' : ''}" aria-label="Машина ${n}${state.has(n) ? ', настроена' : ''}">${n}${state.has(n) ? '<small>готово</small>' : ''}</button>`;

    function render() {
      app.innerHTML = head + `
        <h2>Настройка машин</h2>
        <p class="hint">Каждую машину настройте отдельно: вид стирки, вес и дополнительную химию. После этого система покажет полный список для проверки.</p>
        <div id="mg"><div class="grp">Основной дозатор · машины 1–10</div><div class="grid">${Array.from({length:10},(_,i)=>tile(i+1)).join('')}</div>
        <div class="grp">Отдельный дозатор · машины 11–12</div><div class="grid">${[11,12].map(n=>tile(n)).join('')}</div></div>
        <div id="cfg" class="box"><p class="hint" style="margin:0">Выберите машину выше, чтобы указать вид стирки и вес.</p></div>
        <div class="bar"><button class="go" id="review">Проверить всё${state.size ? ' · ' + state.size + ' ' + mw(state.size) : ''}</button>
        <button class="ghost" id="undo" hidden>Отменить последнюю запись</button></div>`;
      $('#mg').onclick = e => {
        const b = e.target.closest('[data-m]'); if (!b) return;
        openMachine(+b.dataset.m, true);
      };
      $('#review').onclick = () => state.size ? showReview() : toast('Сначала настройте хотя бы одну машину');
      const show = undoBtn('loads');
      if (lastIds) show(lastIds);
    }

    function openMachine(machine, scroll) {
      openM = machine;
      document.querySelectorAll('#mg [data-m]').forEach(b => b.classList.toggle('cur', +b.dataset.m === machine));
      const old = state.get(machine) || { wash_type_id: null, weight_kg: 25, extras: {} };
      $('#cfg').innerHTML = `
        <h2>Машина ${machine} · ${dos(machine)}</h2>
        <p class="hint">Параметры сохраняются только для машины ${machine} до общего подтверждения.</p>
        <h3>Вид стирки</h3>
        <div class="list" id="wg">${washTypes.map(x=>`<button data-v="${x.id}" class="${+old.wash_type_id===x.id?'on':''}"><span>${esc(x.name)}</span>${x.minutes?`<small>${x.minutes} мин</small>`:''}</button>`).join('')}</div>
        <h3>Вес машины, кг</h3>
        <div class="kg"><button id="mi" aria-label="Меньше">−</button><input id="kg" type="number" min="0" step="0.5" inputmode="decimal" value="${old.weight_kg}"><button id="pl" aria-label="Больше">+</button></div>
        ${extras.length?`<h3>Дополнительная химия</h3><p class="hint">Количество указывается для этой машины.</p>${extras.map(x=>`<label>${esc(x.name)}${x.per_unit_unit==='g'?' (г)':' (мл)'}<input type="number" min="0" step="1" inputmode="numeric" data-x="${x.id}" value="${old.extras[x.id]||''}"></label>`).join('')}`:''}
        <button class="go" id="doneMachine">Готово для машины ${machine}</button>`;
      let w = old.wash_type_id;
      pick('#wg', v => { w = +v; });
      $('#mi').onclick = () => $('#kg').value = Math.max(0, (+$('#kg').value || 0) - 1);
      $('#pl').onclick = () => $('#kg').value = (+$('#kg').value || 0) + 1;
      $('#doneMachine').onclick = () => {
        if (!w) { toast('Выберите вид стирки'); return; }
        const ex = {}; document.querySelectorAll('[data-x]').forEach(i => { if (+i.value > 0) ex[i.dataset.x] = +i.value; });
        state.set(machine, { wash_type_id: w, weight_kg: +$('#kg').value || 25, extras: ex });
        render(); openMachine(machine);
        toast(`Машина ${machine} настроена`);
      };
      if (scroll) $('#cfg').scrollIntoView({ behavior: smooth(), block: 'nearest' });
    }

    function showReview() {
      const rows = [...state.entries()].sort((a, b) => a[0] - b[0]);
      app.innerHTML = head + `
        <h2>Проверка перед отправкой</h2>
        <p class="hint">Проверьте каждую машину. Пока не нажата кнопка ниже, записи в базу не отправлены.</p>
        <div class="cards">${rows.map(([m, v]) => {
          const w = washTypes.find(x => x.id === +v.wash_type_id);
          const chem = Object.entries(v.extras).map(([id, qty]) => {
            const c = extras.find(x => String(x.id) === String(id));
            return c ? `${esc(c.name)}: ${qty} ${c.per_unit_unit === 'g' ? 'г' : 'мл'}` : '';
          }).filter(Boolean).join(', ');
          return `<div class="card"><div><span class="nm">Машина ${m} · ${dos(m)}</span><small>${esc(w?.name || 'Не выбран')} · ${v.weight_kg} кг${chem ? ' · ' + chem : ''}</small></div><button class="mini" data-edit="${m}">Изменить</button></div>`;
        }).join('')}</div>
        <div class="box"><b>Итого машин: ${rows.length}</b><p class="hint" style="margin:.25rem 0 0">1–10: ${rows.filter(([m]) => m <= 10).length}; 11–12: ${rows.filter(([m]) => m >= 11).length}.</p></div>
        <div class="bar"><button class="go" id="confirm">Все верно — отправить ${rows.length} ${mw(rows.length)}</button><button class="ghost" id="back">← Вернуться к настройке</button></div>`;
      toTop();
      app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { render(); openMachine(+b.dataset.edit, true); });
      $('#back').onclick = () => { render(); toTop(); };
      $('#confirm').onclick = async () => {
        const payload = rows.map(([m, v]) => ({ form_id: f.id, machine: m, wash_type_id: +v.wash_type_id, weight_kg: +v.weight_kg || 25, extras: v.extras }));
        $('#confirm').disabled = true;
        const { data, error } = await sb.from('loads').insert(payload).select('id,machine');
        if (error) { toast('Не сохранено: ' + error.message); $('#confirm').disabled = false; return; }
        toast(`Отправлено: ${data.length} ${mw(data.length)}`);
        lastIds = data.map(x => x.id); state.clear(); openM = null; render(); toTop();
      };
    }

    render();
  }

  async function laundryChem(lastId) {
    const { data: ch } = await sb.from('chemicals').select('id,name,bottle_l,bottle_kg').order('sort');
    const groups = [['1_10', 'Машины 1–10 · основной дозатор'], ['11_12', 'Машины 11–12 · отдельный дозатор']];
    app.innerHTML = head + `
      <h3>Группа дозатора</h3>
      <div class="list" id="cg">${groups.map(([v, n]) => `<button data-v="${v}">${n}</button>`).join('')}</div>
      <h3>Какая химия закончилась</h3><div class="list" id="chem">${(ch || []).map(x => `<button data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div>
      <label>Остаток на дне, кг<input id="lf" type="number" min="0" step="0.1" inputmode="decimal"></label>
      <p class="hint" id="lh">Если бутыль пустая, оставьте поле пустым.</p>
      <button class="go" id="save">Проверить и заменить</button>
      <button class="ghost" id="undo" hidden>Отменить последнюю запись</button>`;
    let g = null, c = null; const show = undoBtn('chem_changes');
    if (lastId) show(lastId);
    const cur = () => (ch || []).find(x => x.id === +c);
    const hint = () => {
      const x = cur(), v = $('#lf').value; let t = 'Если бутыль пустая, оставьте поле пустым.';
      if (x && !(+x.bottle_kg > 0)) t = 'Вес бутыли не задан в настройках, остаток не пересчитается в литры.';
      else if (x && v !== '') {
        if (+v > +x.bottle_kg) t = `Больше, чем в полной бутыли (${x.bottle_kg} кг). Проверьте.`;
        else if (+x.bottle_l > 0) t = `≈ ${(+v * x.bottle_l / x.bottle_kg).toLocaleString('ru-RU', { maximumFractionDigits: 2 })} л`;
      }
      $('#lh').textContent = t;
    };
    pick('#cg', v => { g = v; }); pick('#chem', v => { c = v; hint(); }); $('#lf').oninput = hint;
    $('#save').onclick = () => {
      if (!g) { toast('Выберите группу дозатора'); return; }
      if (!c) { toast('Выберите, какая химия закончилась'); return; }
      const x = cur(), lf = $('#lf').value;
      if (lf !== '' && x && +x.bottle_kg > 0 && +lf > +x.bottle_kg) { toast('Остаток больше полной бутыли'); return; }
      const gn = g === '1_10' ? 'Машины 1–10' : 'Машины 11–12';
      app.innerHTML = head + `<h2>Проверка замены химии</h2><div class="box"><p><b>Дозатор:</b> ${gn}</p><p><b>Химия:</b> ${esc(x.name)}</p><p><b>Остаток:</b> ${lf === '' ? 'бутыль пустая' : esc(lf) + ' кг'}</p></div><div class="bar"><button class="go" id="confirm">Все верно — записать замену</button><button class="ghost" id="back">Изменить</button></div>`;
      toTop();
      $('#back').onclick = () => laundryChem();
      $('#confirm').onclick = async () => {
        $('#confirm').disabled = true;
        const { data, error } = await sb.from('chem_changes').insert({ form_id: f.id, chemical_id: +c, leftover_kg: lf === '' ? null : +lf, machine_group: g }).select('id').single();
        if (error) { toast('Не сохранено: ' + error.message); $('#confirm').disabled = false; return; }
        toast('Замена записана'); laundryChem(data.id); toTop();
      };
    };
  }

  ({ laundry_load: laundryLoad, laundry_chem: laundryChem }[f.type] || (() => app.innerHTML = head + '<p class="hint">Этот тип бланка пока не подключён.</p>'))();
})();
</script></body></html>
